<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="monospace">
  <style>
    .client   { fill: #fafafa; stroke: #333;    stroke-width: 1.5; }
    .gateway  { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2;   }
    .upstream { fill: #fce8e6; stroke: #c5221f; stroke-width: 1.5; }
    .title    { font-size: 15px; font-weight: bold; fill: #222; }
    .label    { font-size: 13px; fill: #222; }
    .small    { font-size: 11px; fill: #555; }
    .arrow    { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrowR   { stroke: #555; stroke-width: 1;   fill: none; marker-end: url(#arrow); stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <text x="400" y="22" text-anchor="middle" class="title">s04: 前缀选 provider</text>

  <!-- Client -->
  <rect class="client" x="40" y="120" width="140" height="80"/>
  <text x="110" y="148" text-anchor="middle" class="label">Client</text>
  <text x="110" y="166" text-anchor="middle" class="small">POST /v1/chat/completions</text>
  <text x="110" y="184" text-anchor="middle" class="small">model: gpt-* / claude-* / gemini-*</text>

  <!-- Relay (gateway) -->
  <rect class="gateway" x="220" y="120" width="220" height="80"/>
  <text x="330" y="146" text-anchor="middle" class="label">Relay</text>
  <text x="330" y="164" text-anchor="middle" class="small">pick_provider(model)</text>
  <text x="330" y="182" text-anchor="middle" class="small">to_upstream / from_upstream</text>

  <!-- 3 Upstream boxes -->
  <rect class="upstream" x="480" y="40" width="280" height="60"/>
  <text x="620" y="62" text-anchor="middle" class="label">OpenAIProvider</text>
  <text x="620" y="80" text-anchor="middle" class="small">gpt-* / o* prefix</text>
  <text x="620" y="96" text-anchor="middle" class="small">to_upstream: identity / from_upstream: identity</text>

  <rect class="upstream" x="480" y="130" width="280" height="60"/>
  <text x="620" y="152" text-anchor="middle" class="label">ClaudeProvider</text>
  <text x="620" y="170" text-anchor="middle" class="small">claude-* prefix</text>
  <text x="620" y="186" text-anchor="middle" class="small">to_upstream: messages + x-api-key + max_tokens</text>

  <rect class="upstream" x="480" y="220" width="280" height="60"/>
  <text x="620" y="242" text-anchor="middle" class="label">GeminiProvider</text>
  <text x="620" y="260" text-anchor="middle" class="small">gemini-* prefix</text>
  <text x="620" y="276" text-anchor="middle" class="small">to_upstream: contents[] + ?key=...</text>

  <!-- Request flow client -> relay -->
  <line class="arrow" x1="180" y1="150" x2="218" y2="150"/>
  <text x="199" y="145" text-anchor="middle" class="small">OpenAI JSON</text>

  <!-- 3 dispatch arrows -->
  <line class="arrow" x1="440" y1="135" x2="478" y2="70"/>
  <text x="459" y="98" text-anchor="middle" class="small">gpt-*</text>

  <line class="arrow" x1="440" y1="160" x2="478" y2="160"/>
  <text x="459" y="155" text-anchor="middle" class="small">claude-*</text>

  <line class="arrow" x1="440" y1="185" x2="478" y2="250"/>
  <text x="459" y="223" text-anchor="middle" class="small">gemini-*</text>

  <!-- Response arrows (dashed) returning to client -->
  <line class="arrowR" x1="478" y1="95" x2="440" y2="180"/>
  <line class="arrowR" x1="478" y1="170" x2="440" y2="170"/>
  <line class="arrowR" x1="478" y1="245" x2="440" y2="160"/>

  <!-- Caption -->
  <text x="400" y="304" text-anchor="middle" class="small">prefix 路由:gpt-* / o* -&gt; OpenAI,claude-* -&gt; Claude,gemini-* -&gt; Gemini · 未知前缀 -&gt; 400</text>
</svg>
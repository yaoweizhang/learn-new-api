<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" font-family="monospace">
  <style>
    .client     { fill: #fafafa; stroke: #333;    stroke-width: 1.5; }
    .gateway    { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2;   }
    .middleware { fill: #fff5d6; stroke: #b58900; stroke-width: 1.5; }
    .storage    { fill: #e6f4ea; stroke: #228b22; stroke-width: 1.5; }
    .upstream   { fill: #fce8e6; stroke: #c5221f; stroke-width: 1.5; }
    .title      { font-size: 15px; font-weight: bold; fill: #222; }
    .label      { font-size: 13px; fill: #222; }
    .small      { font-size: 11px; fill: #555; }
    .arrow      { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrowR     { stroke: #555; stroke-width: 1;   fill: none; marker-end: url(#arrow); stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <text x="460" y="22" text-anchor="middle" class="title">s13: 失败即标,切下一条</text>

  <!-- Client -->
  <rect class="client" x="20" y="100" width="140" height="64"/>
  <text x="90" y="124" text-anchor="middle" class="label">Client</text>
  <text x="90" y="142" text-anchor="middle" class="small">POST /v1/chat/completions</text>
  <text x="90" y="158" text-anchor="middle" class="small">Bearer</text>

  <!-- s13 local route (chat_with_retry) -->
  <rect class="gateway" x="200" y="80" width="220" height="100"/>
  <text x="310" y="104" text-anchor="middle" class="label">s13 local route</text>
  <text x="310" y="122" text-anchor="middle" class="small">@app.post("/v1/chat/...")</text>
  <text x="310" y="138" text-anchor="middle" class="small">chat_with_retry(req)</text>
  <text x="310" y="154" text-anchor="middle" class="small">本地路由挡 s12 mount</text>
  <text x="310" y="170" text-anchor="middle" class="small">client.post(url, body) · 无重试</text>

  <!-- for-loop box -->
  <rect class="middleware" x="460" y="80" width="180" height="100"/>
  <text x="550" y="104" text-anchor="middle" class="label">for ch in candidates:</text>
  <text x="550" y="122" text-anchor="middle" class="small">if !ch.healthy: continue</text>
  <text x="550" y="138" text-anchor="middle" class="small">try client.post(...)</text>
  <text x="550" y="154" text-anchor="middle" class="small">on 2xx -&gt; return</text>
  <text x="550" y="170" text-anchor="middle" class="small">on fail -&gt; mark_unhealthy + next</text>

  <!-- channels pool with healthy indicators -->
  <rect class="storage" x="680" y="60" width="220" height="140"/>
  <text x="790" y="84" text-anchor="middle" class="label">channels pool</text>
  <text x="790" y="104" text-anchor="middle" class="small" fill="#228b22">c1 OpenAI-A    priority=0 healthy=True</text>
  <text x="790" y="124" text-anchor="middle" class="small" fill="#c5221f">c2 OpenAI-B    priority=0 healthy=False (503)</text>
  <text x="790" y="144" text-anchor="middle" class="small" fill="#228b22">c3 OpenAI-C    priority=1 healthy=True</text>
  <text x="790" y="164" text-anchor="middle" class="small">list_channels() · mark_unhealthy(cid)</text>
  <text x="790" y="184" text-anchor="middle" class="small">下一次请求自动 skip c2</text>

  <!-- arrows client -> s13 -> for-loop -> pool -->
  <line class="arrow" x1="160" y1="130" x2="198" y2="130"/>
  <text x="179" y="125" text-anchor="middle" class="small">HTTP</text>
  <line class="arrow" x1="420" y1="130" x2="458" y2="130"/>
  <text x="439" y="125" text-anchor="middle" class="small">iterate</text>
  <line class="arrow" x1="640" y1="130" x2="678" y2="120"/>
  <text x="659" y="115" text-anchor="middle" class="small">candidates</text>

  <!-- Upstream column -->
  <rect class="upstream" x="200" y="240" width="180" height="60"/>
  <text x="290" y="262" text-anchor="middle" class="label">Upstream c1</text>
  <text x="290" y="278" text-anchor="middle" class="small">200 OK</text>
  <text x="290" y="294" text-anchor="middle" class="small" fill="#228b22">success path</text>

  <rect class="upstream" x="420" y="240" width="180" height="60"/>
  <text x="510" y="262" text-anchor="middle" class="label">Upstream c2</text>
  <text x="510" y="278" text-anchor="middle" class="small">503 fail</text>
  <text x="510" y="294" text-anchor="middle" class="small" fill="#c5221f">mark_unhealthy(c2)</text>

  <rect class="upstream" x="640" y="240" width="180" height="60"/>
  <text x="730" y="262" text-anchor="middle" class="label">Upstream c3</text>
  <text x="730" y="278" text-anchor="middle" class="small">200 OK</text>
  <text x="730" y="294" text-anchor="middle" class="small" fill="#228b22">fallback</text>

  <!-- for-loop arrow to each upstream -->
  <line class="arrow" x1="290" y1="180" x2="290" y2="238"/>
  <text x="305" y="215" text-anchor="middle" class="small">try</text>
  <line class="arrow" x1="510" y1="180" x2="510" y2="238"/>
  <line class="arrow" x1="730" y1="180" x2="730" y2="238"/>

  <!-- mark_unhealthy arrow back to pool -->
  <line class="arrowR" x1="510" y1="300" x2="790" y2="200" stroke="#c5221f"/>
  <text x="650" y="278" text-anchor="middle" class="small" fill="#c5221f">mark_unhealthy(c2) 即时生效</text>

  <!-- success response back to client (from c1 OR c3, show c1 here) -->
  <line class="arrowR" x1="200" y1="270" x2="162" y2="270" stroke="#228b22"/>
  <line class="arrowR" x1="162" y1="270" x2="162" y2="146" stroke="#228b22"/>
  <text x="80" y="248" text-anchor="middle" class="small" fill="#228b22">200 + body</text>

  <!-- final-fail return (dotted) -->
  <line class="arrowR" x1="640" y1="280" x2="160" y2="280" stroke="#c5221f"/>
  <text x="380" y="328" text-anchor="middle" class="small" fill="#c5221f">全失败 -&gt; raise HTTPException(502, last_error)</text>

  <!-- s12 mount still reachable -->
  <rect class="gateway" x="200" y="360" width="500" height="50"/>
  <text x="450" y="382" text-anchor="middle" class="label">app.mount("/", s12_app)</text>
  <text x="450" y="400" text-anchor="middle" class="small">/admin/cache/stats 仍可达 · /v1 路径已被本地路由遮蔽</text>

  <line class="arrow" x1="310" y1="180" x2="450" y2="358"/>
  <text x="370" y="280" text-anchor="middle" class="small">挂载点(本地路由之后)</text>

  <!-- Caption -->
  <text x="460" y="458" text-anchor="middle" class="small">for ch in candidates:try -&gt; 失败 mark_unhealthy -&gt; 下一条 · 全失败 -&gt; 502</text>
  <text x="460" y="476" text-anchor="middle" class="small">每条渠道最多被调一次(无 tenacity 退避) · 不做熔断器</text>
</svg>
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="monospace">
  <style>
    .client     { fill: #fafafa; stroke: #333;    stroke-width: 1.5; }
    .gateway    { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2;   }
    .middleware { fill: #fff5d6; stroke: #b58900; stroke-width: 1.5; }
    .storage    { fill: #e6f4ea; stroke: #228b22; stroke-width: 1.5; }
    .upstream   { fill: #fce8e6; stroke: #c5221f; stroke-width: 1.5; }
    .reference  { fill: #f5f5f5; stroke: #888;    stroke-width: 1; stroke-dasharray: 4 3; }
    .title      { font-size: 14px; font-weight: bold; fill: #222; }
    .label      { font-size: 13px; fill: #222; }
    .small      { font-size: 11px; fill: #555; }
    .refsmall   { font-size: 11px; fill: #777; }
    .arrow      { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrowR     { stroke: #555; stroke-width: 1;   fill: none; marker-end: url(#arrow); stroke-dasharray: 4 3; }
    .arrowRef   { stroke: #888; stroke-width: 1;   fill: none; marker-end: url(#arrowRef); stroke-dasharray: 3 2; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrowRef" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <text x="360" y="22" text-anchor="middle" class="title">s13: 失败换下一条</text>

  <!-- ============ TOP-LEFT: s10 channels 参考框 (前置, 本章接力) ============ -->

  <rect class="reference" x="20" y="50" width="260" height="80"/>
  <text x="150" y="78" text-anchor="middle" class="small" fill="#555">s10 channels (前置)</text>
  <text x="150" y="100" text-anchor="middle" class="refsmall">_channels · mark</text>
  <text x="150" y="118" text-anchor="middle" class="refsmall">不重写 for 遍历</text>

  <!-- ============ MAIN FLOW ROW ============ -->

  <!-- Client -->
  <rect class="client" x="20" y="160" width="120" height="64"/>
  <text x="80" y="186" text-anchor="middle" class="label">Client</text>
  <text x="80" y="206" text-anchor="middle" class="small">POST · 同请求</text>

  <!-- s13 local route -->
  <rect class="gateway" x="170" y="160" width="160" height="64"/>
  <text x="250" y="186" text-anchor="middle" class="label">s13 本地路由</text>
  <text x="250" y="206" text-anchor="middle" class="small">挡 mount · 无重试</text>

  <!-- for-loop box -->
  <rect class="middleware" x="360" y="160" width="180" height="64"/>
  <text x="450" y="186" text-anchor="middle" class="label">for ch in candidates</text>
  <text x="450" y="206" text-anchor="middle" class="small">fail → mark + 下一条</text>

  <!-- channels pool (storage) -->
  <rect class="storage" x="570" y="160" width="130" height="64"/>
  <text x="635" y="186" text-anchor="middle" class="label">channels pool</text>
  <text x="635" y="206" text-anchor="middle" class="small">c1 c2 c3 · 即时</text>

  <!-- ============ ARROWS: client → s13 → for-loop → pool ============ -->

  <line class="arrow" x1="140" y1="190" x2="168" y2="190"/>
  <text x="154" y="185" text-anchor="middle" class="small">HTTP</text>

  <line class="arrow" x1="330" y1="190" x2="358" y2="190"/>
  <text x="344" y="185" text-anchor="middle" class="small">遍历</text>

  <line class="arrow" x1="540" y1="190" x2="568" y2="190"/>
  <text x="554" y="185" text-anchor="middle" class="small">取</text>

  <!-- ============ ATTEMPT FLOW ROW: upstream boxes + arrows ============ -->

  <!-- Attempt 1: c1 (success) — placeholder just to convey the first-try path -->
  <rect class="upstream" x="20" y="290" width="140" height="50"/>
  <text x="90" y="312" text-anchor="middle" class="label">首选 c1</text>
  <text x="90" y="328" text-anchor="middle" class="small" fill="#228b22">200 OK</text>

  <line class="arrow" x1="450" y1="225" x2="90" y2="288"/>
  <text x="240" y="255" text-anchor="middle" class="small" fill="#228b22">首选</text>

  <!-- Attempt 2: c2 (fail) — keeps path to mark_unhealthy flow -->
  <rect class="upstream" x="200" y="290" width="160" height="50"/>
  <text x="280" y="312" text-anchor="middle" class="label">尝试 c2</text>
  <text x="280" y="328" text-anchor="middle" class="small" fill="#c5221f">503 · 切下一条</text>

  <line class="arrow" x1="450" y1="235" x2="280" y2="288"/>
  <text x="380" y="265" text-anchor="middle" class="small" fill="#c5221f">失败</text>

  <!-- mark_unhealthy back to pool — Round-8 fix preserved: polyline up c2 column -->
  <polyline class="arrowR" points="300,340 300,260 635,224" stroke="#c5221f"/>
  <text x="310" y="280" text-anchor="start" class="small" fill="#c5221f">mark 即时</text>

  <!-- Attempt 3: c3 (fallback success) -->
  <rect class="upstream" x="400" y="290" width="160" height="50"/>
  <text x="480" y="312" text-anchor="middle" class="label">切到 c3</text>
  <text x="480" y="328" text-anchor="middle" class="small" fill="#228b22">fallback 200</text>

  <line class="arrow" x1="450" y1="245" x2="480" y2="288"/>
  <text x="455" y="270" text-anchor="middle" class="small" fill="#228b22">切下一条</text>

  <!-- success response back to client — Round-8 fix preserved: routed below row to x=10 -->
  <polyline class="arrowR" points="480,340 480,348 10,348 10,224" stroke="#228b22"/>
  <text x="245" y="343" text-anchor="middle" class="small" fill="#228b22">200 → 客户端</text>

  <!-- ============ s10 参考框 → s13 主路径 的"接力"虚线 ============ -->

  <line class="arrowRef" x1="280" y1="132" x2="280" y2="158"/>
  <text x="286" y="150" text-anchor="start" class="refsmall">接力</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" font-family="monospace">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- Client -->
  <rect x="10" y="60" width="80" height="60" fill="#eee" stroke="#333"/>
  <text x="50" y="95" text-anchor="middle">Client</text>

  <!-- OpenAI-shaped API -->
  <rect x="180" y="60" width="160" height="60" fill="#cfc" stroke="#333"/>
  <text x="260" y="90" text-anchor="middle">OpenAI-shaped API</text>
  <text x="260" y="108" text-anchor="middle" font-size="10">/v1/chat/completions</text>

  <!-- Upstream -->
  <rect x="430" y="60" width="80" height="60" fill="#eee" stroke="#333"/>
  <text x="470" y="95" text-anchor="middle">Upstream</text>

  <!-- Line Client -> API -->
  <line x1="90" y1="90" x2="180" y2="90" stroke="#333" marker-end="url(#a)"/>
  <text x="135" y="82" text-anchor="middle" font-size="10">OpenAI JSON</text>

  <!-- Line API -> Upstream -->
  <line x1="340" y1="90" x2="430" y2="90" stroke="#333" marker-end="url(#a)"/>
  <text x="385" y="82" text-anchor="middle" font-size="10">forwarded</text>

  <!-- Annotation: model_dump(exclude_none=True) -->
  <text x="260" y="150" text-anchor="middle" font-size="11" fill="#555">model_dump(exclude_none=True)</text>
  <line x1="260" y1="125" x2="260" y2="140" stroke="#888" stroke-dasharray="3,2"/>
</svg>

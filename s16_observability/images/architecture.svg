<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" font-family="monospace">
  <style>
    .client     { fill: #fafafa; stroke: #333;    stroke-width: 1.5; }
    .gateway    { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2;   }
    .middleware { fill: #fff5d6; stroke: #b58900; stroke-width: 1.5; }
    .storage    { fill: #e6f4ea; stroke: #228b22; stroke-width: 1.5; }
    .upstream   { fill: #fce8e6; stroke: #c5221f; stroke-width: 1.5; }
    .title      { font-size: 15px; font-weight: bold; fill: #222; }
    .label      { font-size: 13px; fill: #222; }
    .small      { font-size: 11px; fill: #555; }
    .arrow      { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrowR     { stroke: #555; stroke-width: 1;   fill: none; marker-end: url(#arrow); stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <text x="460" y="22" text-anchor="middle" class="title">s16: trace_id 串,Prometheus 拉</text>

  <!-- ============ Top row: request flow ============ -->

  <!-- Client -->
  <rect class="client" x="20" y="80" width="140" height="64"/>
  <text x="90" y="104" text-anchor="middle" class="label">Client</text>
  <text x="90" y="122" text-anchor="middle" class="small">x-trace-id: abc-123</text>
  <text x="90" y="138" text-anchor="middle" class="small">POST /v1/chat/completions</text>

  <!-- TraceAndMetricsMiddleware (NEW, BEFORE the mount chain) -->
  <rect class="middleware" x="200" y="60" width="240" height="100"/>
  <text x="320" y="84" text-anchor="middle" class="label">TraceAndMetricsMiddleware</text>
  <text x="320" y="102" text-anchor="middle" class="small">trace_id = hdr or uuid4().hex</text>
  <text x="320" y="118" text-anchor="middle" class="small">t0 = perf_counter()</text>
  <text x="320" y="134" text-anchor="middle" class="small">structlog.info(trace_id, elapsed, ...)</text>
  <text x="320" y="150" text-anchor="middle" class="small">response.headers["x-trace-id"]</text>

  <!-- s15 mount -->
  <rect class="gateway" x="480" y="60" width="220" height="100"/>
  <text x="590" y="84" text-anchor="middle" class="label">s15 mount (链路)</text>
  <text x="590" y="102" text-anchor="middle" class="small">/v1/chat/completions</text>
  <text x="590" y="118" text-anchor="middle" class="small">s14 -&gt; s13 -&gt; ... -&gt; s08</text>
  <text x="590" y="134" text-anchor="middle" class="small">call_next(trace_id 已在 ctx)</text>
  <text x="590" y="150" text-anchor="middle" class="small">request.state.model 透传</text>

  <!-- Upstream -->
  <rect class="upstream" x="740" y="60" width="160" height="100"/>
  <text x="820" y="84" text-anchor="middle" class="label">Upstream</text>
  <text x="820" y="118" text-anchor="middle" class="small">OpenAI / ...</text>
  <text x="820" y="134" text-anchor="middle" class="small">httpx post</text>

  <!-- request flow arrows -->
  <line class="arrow" x1="160" y1="100" x2="198" y2="100"/>
  <text x="179" y="95" text-anchor="middle" class="small">x-trace-id</text>
  <line class="arrow" x1="440" y1="100" x2="478" y2="100"/>
  <text x="459" y="95" text-anchor="middle" class="small">call_next</text>
  <line class="arrow" x1="700" y1="100" x2="738" y2="100"/>
  <text x="719" y="95" text-anchor="middle" class="small">HTTP</text>

  <!-- response back with x-trace-id echoed -->
  <line class="arrowR" x1="738" y1="120" x2="702" y2="120"/>
  <line class="arrowR" x1="478" y1="120" x2="442" y2="120"/>
  <line class="arrowR" x1="198" y1="120" x2="162" y2="120"/>
  <text x="460" y="115" text-anchor="middle" class="small">200 + x-trace-id: abc-123</text>

  <!-- ============ Metrics row ============ -->

  <!-- REQUESTS counter -->
  <rect class="storage" x="200" y="200" width="180" height="80"/>
  <text x="290" y="222" text-anchor="middle" class="label">REQUESTS (Counter)</text>
  <text x="290" y="240" text-anchor="middle" class="small">labels: model, status</text>
  <text x="290" y="256" text-anchor="middle" class="small">.inc() on chat path</text>
  <text x="290" y="272" text-anchor="middle" class="small">process-internal</text>

  <!-- LATENCY histogram -->
  <rect class="storage" x="400" y="200" width="180" height="80"/>
  <text x="490" y="222" text-anchor="middle" class="label">LATENCY (Histogram)</text>
  <text x="490" y="240" text-anchor="middle" class="small">labels: model</text>
  <text x="490" y="256" text-anchor="middle" class="small">.observe(elapsed)</text>
  <text x="490" y="272" text-anchor="middle" class="small">P50/P99 from buckets</text>

  <!-- structlog -->
  <rect class="middleware" x="600" y="200" width="180" height="80"/>
  <text x="690" y="222" text-anchor="middle" class="label">structlog</text>
  <text x="690" y="240" text-anchor="middle" class="small">JSON 一行一条</text>
  <text x="690" y="256" text-anchor="middle" class="small">trace_id · path · status · elapsed</text>
  <text x="690" y="272" text-anchor="middle" class="small">stdout -&gt; docker logs</text>

  <!-- arrows: middleware -> metrics + structlog -->
  <line class="arrow" x1="290" y1="160" x2="290" y2="198"/>
  <line class="arrow" x1="490" y1="160" x2="490" y2="198"/>
  <line class="arrow" x1="690" y1="160" x2="690" y2="198"/>
  <text x="480" y="190" text-anchor="middle" class="small">on /v1/chat/completions</text>

  <!-- ============ /metrics scrape ============ -->

  <!-- /metrics endpoint -->
  <rect class="gateway" x="280" y="320" width="200" height="64"/>
  <text x="380" y="342" text-anchor="middle" class="label">GET /metrics</text>
  <text x="380" y="360" text-anchor="middle" class="small">text/plain; v=1.0.0; charset=utf-8</text>
  <text x="380" y="376" text-anchor="middle" class="small">注册在 s15 mount 之前</text>

  <!-- Prometheus scraper -->
  <rect class="client" x="540" y="320" width="200" height="64"/>
  <text x="640" y="342" text-anchor="middle" class="label">Prometheus</text>
  <text x="640" y="360" text-anchor="middle" class="small">scrape every 15s</text>
  <text x="640" y="376" text-anchor="middle" class="small">拉取 text/plain</text>

  <!-- REQUESTS + LATENCY -> /metrics -->
  <line class="arrow" x1="290" y1="282" x2="380" y2="318"/>
  <line class="arrow" x1="490" y1="282" x2="380" y2="318"/>
  <text x="320" y="304" text-anchor="middle" class="small">read</text>

  <!-- Prometheus scrape /metrics -->
  <line class="arrow" x1="538" y1="352" x2="482" y2="352"/>
  <text x="510" y="347" text-anchor="middle" class="small">scrape</text>

  <!-- Caption -->
  <text x="460" y="448" text-anchor="middle" class="small">x-trace-id 注入 + 转发 · Prometheus 拉 /metrics · 错误率 / 延迟 / 请求 / 失败</text>
  <text x="460" y="466" text-anchor="middle" class="small">labels=model(status) 高基数,生产需采样 · structlog JSON -&gt; Loki</text>
</svg>
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" font-family="monospace">
  <style>
    .client     { fill: #fafafa; stroke: #333;    stroke-width: 1.5; }
    .gateway    { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2;   }
    .middleware { fill: #fff5d6; stroke: #b58900; stroke-width: 1.5; }
    .storage    { fill: #e6f4ea; stroke: #228b22; stroke-width: 1.5; }
    .upstream   { fill: #fce8e6; stroke: #c5221f; stroke-width: 1.5; }
    .reference  { fill: #f5f5f5; stroke: #888;    stroke-width: 1; stroke-dasharray: 4 3; }
    .title      { font-size: 14px; font-weight: bold; fill: #222; }
    .label      { font-size: 13px; fill: #222; }
    .small      { font-size: 11px; fill: #555; }
    .refsmall   { font-size: 11px; fill: #777; }
    .arrow      { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrowR     { stroke: #555; stroke-width: 1;   fill: none; marker-end: url(#arrow); stroke-dasharray: 4 3; }
    .arrowRef   { stroke: #888; stroke-width: 1;   fill: none; marker-end: url(#arrowRef); stroke-dasharray: 3 2; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrowRef" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <text x="360" y="22" text-anchor="middle" class="title">s16: trace_id 串请求 + Prom 拉指标 + structlog</text>

  <rect class="reference" x="20" y="50" width="260" height="64"/>
  <text x="150" y="76" text-anchor="middle" class="small" fill="#555">s15 docker + s11 logs (前置)</text>
  <text x="150" y="100" text-anchor="middle" class="refsmall">/v1/chat 已能转发 + 落日志</text>

  <rect class="client" x="20" y="150" width="120" height="60"/>
  <text x="80" y="178" text-anchor="middle" class="label">Client</text>
  <text x="80" y="196" text-anchor="middle" class="small">带 x-trace-id</text>

  <rect class="middleware" x="160" y="150" width="180" height="60"/>
  <text x="250" y="178" text-anchor="middle" class="label">TraceMetrics MW</text>
  <text x="250" y="196" text-anchor="middle" class="small">uuid4 · perf_counter</text>

  <rect class="gateway" x="360" y="150" width="160" height="60"/>
  <text x="440" y="178" text-anchor="middle" class="label">s15 mount</text>
  <text x="440" y="196" text-anchor="middle" class="small">链路</text>

  <rect class="upstream" x="540" y="150" width="100" height="60"/>
  <text x="590" y="178" text-anchor="middle" class="label">Upstream</text>
  <text x="590" y="196" text-anchor="middle" class="small">200 JSON</text>

  <line class="arrow" x1="140" y1="180" x2="158" y2="180"/>
  <text x="149" y="175" text-anchor="middle" class="small">next</text>

  <line class="arrow" x1="340" y1="180" x2="358" y2="180"/>
  <text x="349" y="175" text-anchor="middle" class="small">HTTP</text>

  <line class="arrowR" x1="358" y1="200" x2="342" y2="200"/>
  <line class="arrowR" x1="158" y1="200" x2="142" y2="200"/>
  <text x="250" y="195" text-anchor="middle" class="small">200 + trace_id</text>

  <rect class="storage" x="160" y="240" width="160" height="60"/>
  <text x="240" y="268" text-anchor="middle" class="label">REQUESTS Counter</text>
  <text x="240" y="286" text-anchor="middle" class="small">model · status</text>

  <rect class="storage" x="340" y="240" width="160" height="60"/>
  <text x="420" y="268" text-anchor="middle" class="label">LATENCY Histogram</text>
  <text x="420" y="286" text-anchor="middle" class="small">model · 延迟分桶</text>

  <rect class="middleware" x="520" y="240" width="180" height="60"/>
  <text x="610" y="268" text-anchor="middle" class="label">structlog JSON</text>
  <text x="610" y="286" text-anchor="middle" class="small">trace_id · stdout</text>

  <polyline class="arrow" points="250,210 250,228 240,238"/>
  <polyline class="arrow" points="250,210 420,228 420,238"/>
  <polyline class="arrow" points="250,210 610,228 610,238"/>
  <text x="440" y="232" text-anchor="middle" class="small" fill="#228b22">on chat path</text>
</svg>

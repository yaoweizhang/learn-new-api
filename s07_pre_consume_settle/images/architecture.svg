<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="monospace">
  <style>
    .client     { fill: #fafafa; stroke: #333;    stroke-width: 1.5; }
    .gateway    { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2;   }
    .storage    { fill: #e6f4ea; stroke: #228b22; stroke-width: 1.5; }
    .upstream   { fill: #fce8e6; stroke: #c5221f; stroke-width: 1.5; }
    .title      { font-size: 14px; font-weight: bold; fill: #222; }
    .label      { font-size: 13px; fill: #222; }
    .small      { font-size: 11px; fill: #555; }
    .arrow      { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrowR     { stroke: #555; stroke-width: 1;   fill: none; marker-end: url(#arrow); stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <text x="360" y="22" text-anchor="middle" class="title">s07: 预扣 + 结算,失败整笔退</text>

  <rect class="client" x="20" y="160" width="120" height="64"/>
  <text x="80" y="186" text-anchor="middle" class="label">Client</text>
  <text x="80" y="206" text-anchor="middle" class="small">带 Bearer</text>

  <rect class="gateway" x="170" y="160" width="160" height="64"/>
  <text x="250" y="186" text-anchor="middle" class="label">/v1/chat/...</text>
  <text x="250" y="206" text-anchor="middle" class="small">扣 → 调 → 退/补</text>

  <rect class="storage" x="360" y="160" width="160" height="64"/>
  <text x="440" y="186" text-anchor="middle" class="label">quota.py</text>
  <text x="440" y="206" text-anchor="middle" class="small">dict + Lock · 原子</text>

  <rect class="upstream" x="550" y="160" width="150" height="64"/>
  <text x="625" y="186" text-anchor="middle" class="label">Upstream</text>
  <text x="625" y="206" text-anchor="middle" class="small">回 usage</text>

  <polyline class="arrowR" points="440,160 440,148 80,148 80,160" stroke="#c5221f"/>
  <text x="260" y="143" text-anchor="middle" class="small" fill="#c5221f">402</text>

  <line class="arrow" x1="140" y1="190" x2="168" y2="190"/>
  <text x="154" y="185" text-anchor="middle" class="small">求</text>

  <line class="arrow" x1="330" y1="180" x2="358" y2="180"/>
  <text x="344" y="175" text-anchor="middle" class="small">扣</text>

  <polyline class="arrow" points="250,224 250,260 625,260 625,224"/>
  <text x="437" y="255" text-anchor="middle" class="small">求</text>

  <polyline class="arrowR" points="625,224 625,246 250,246 250,224"/>
  <text x="437" y="241" text-anchor="middle" class="small">回</text>

  <line class="arrowR" x1="330" y1="208" x2="358" y2="208" stroke="#228b22"/>
  <text x="344" y="222" text-anchor="middle" class="small" fill="#228b22">退</text>

  <line class="arrowR" x1="170" y1="290" x2="80" y2="290" stroke="#c5221f"/>
  <text x="125" y="285" text-anchor="middle" class="small" fill="#c5221f">退整</text>
</svg>

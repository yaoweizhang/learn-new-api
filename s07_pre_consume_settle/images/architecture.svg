<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="monospace">
  <style>
    .client     { fill: #fafafa; stroke: #333;    stroke-width: 1.5; }
    .gateway    { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2;   }
    .middleware { fill: #fff5d6; stroke: #b58900; stroke-width: 1.5; }
    .storage    { fill: #e6f4ea; stroke: #228b22; stroke-width: 1.5; }
    .upstream   { fill: #fce8e6; stroke: #c5221f; stroke-width: 1.5; }
    .title      { font-size: 15px; font-weight: bold; fill: #222; }
    .label      { font-size: 13px; fill: #222; }
    .small      { font-size: 11px; fill: #555; }
    .arrow      { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrowR     { stroke: #555; stroke-width: 1;   fill: none; marker-end: url(#arrow); stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <text x="400" y="22" text-anchor="middle" class="title">s07: 多扣一点,结账退给你</text>

  <!-- Client -->
  <rect class="client" x="20" y="120" width="120" height="80"/>
  <text x="80" y="148" text-anchor="middle" class="label">Client</text>
  <text x="80" y="166" text-anchor="middle" class="small">+ Bearer</text>
  <text x="80" y="184" text-anchor="middle" class="small">POST /v1/chat/completions</text>

  <!-- Auth (s05) -->
  <rect class="middleware" x="160" y="120" width="100" height="80"/>
  <text x="210" y="146" text-anchor="middle" class="label">s05</text>
  <text x="210" y="164" text-anchor="middle" class="small">require_api_key</text>
  <text x="210" y="182" text-anchor="middle" class="small">-&gt; Principal</text>

  <!-- Tokenizer (s06) -->
  <rect class="middleware" x="280" y="120" width="100" height="80"/>
  <text x="330" y="146" text-anchor="middle" class="label">s06</text>
  <text x="330" y="164" text-anchor="middle" class="small">count_prompt</text>
  <text x="330" y="182" text-anchor="middle" class="small">prompt_tokens</text>

  <!-- Quota store (NEW) -->
  <rect class="storage" x="400" y="40" width="160" height="100"/>
  <text x="480" y="62" text-anchor="middle" class="label">quota.py</text>
  <text x="480" y="80" text-anchor="middle" class="small">_balances: dict + Lock</text>
  <text x="480" y="98" text-anchor="middle" class="small">deduct / refund / settle</text>
  <text x="480" y="116" text-anchor="middle" class="small">estimate = (pt + 256) * RATE</text>
  <text x="480" y="134" text-anchor="middle" class="small">atomic, in-memory</text>

  <!-- Relay handler -->
  <rect class="gateway" x="400" y="170" width="160" height="80"/>
  <text x="480" y="194" text-anchor="middle" class="label">Relay</text>
  <text x="480" y="212" text-anchor="middle" class="small">if !deduct(est): 402</text>
  <text x="480" y="230" text-anchor="middle" class="small">httpx upstream + settle/refund</text>

  <!-- Upstream -->
  <rect class="upstream" x="600" y="170" width="160" height="80"/>
  <text x="680" y="198" text-anchor="middle" class="label">Upstream</text>
  <text x="680" y="216" text-anchor="middle" class="small">returns usage</text>
  <text x="680" y="234" text-anchor="middle" class="small">prompt+completion tokens</text>

  <!-- Chain arrows (left to right) -->
  <line class="arrow" x1="140" y1="150" x2="158" y2="150"/>
  <line class="arrow" x1="260" y1="150" x2="278" y2="150"/>
  <text x="269" y="145" text-anchor="middle" class="small">pt</text>

  <!-- Tokenizer -> quota (pre-deduct) -->
  <line class="arrow" x1="380" y1="135" x2="398" y2="100"/>
  <text x="389" y="115" text-anchor="middle" class="small">est</text>

  <!-- 402 reject path (dashed red) from quota back to client -->
  <line class="arrowR" x1="400" y1="65" x2="80" y2="65" stroke="#c5221f"/>
  <line class="arrowR" x1="80" y1="65" x2="80" y2="118" stroke="#c5221f"/>
  <text x="240" y="60" text-anchor="middle" class="small" fill="#c5221f">insufficient -&gt; 402 Payment Required</text>

  <!-- Relay -> Upstream -->
  <line class="arrow" x1="560" y1="200" x2="598" y2="200"/>
  <text x="579" y="195" text-anchor="middle" class="small">HTTP</text>

  <!-- Settle / refund arrow back to quota -->
  <line class="arrowR" x1="600" y1="240" x2="560" y2="135" stroke="#228b22"/>
  <text x="580" y="180" text-anchor="middle" class="small" fill="#228b22">settle(pre, actual)</text>

  <!-- Caption -->
  <text x="400" y="290" text-anchor="middle" class="small">pre_consume(估) -&gt; upstream -&gt; settle(pt, ct) -&gt; refund 差额 · 402 if not enough</text>
</svg>
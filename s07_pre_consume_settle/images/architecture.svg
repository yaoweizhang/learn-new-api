<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="monospace">
  <style>
    .client     { fill: #fafafa; stroke: #333;    stroke-width: 1.5; }
    .gateway    { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2;   }
    .middleware { fill: #fff5d6; stroke: #b58900; stroke-width: 1.5; }
    .storage    { fill: #e6f4ea; stroke: #228b22; stroke-width: 1.5; }
    .upstream   { fill: #fce8e6; stroke: #c5221f; stroke-width: 1.5; }
    .reference  { fill: #f5f5f5; stroke: #888;    stroke-width: 1; stroke-dasharray: 4 3; }
    .title      { font-size: 15px; font-weight: bold; fill: #222; }
    .label      { font-size: 13px; fill: #222; }
    .small      { font-size: 11px; fill: #555; }
    .refsmall   { font-size: 11px; fill: #777; }
    .arrow      { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrowR     { stroke: #555; stroke-width: 1;   fill: none; marker-end: url(#arrow); stroke-dasharray: 4 3; }
    .arrowRef   { stroke: #888; stroke-width: 1;   fill: none; marker-end: url(#arrowRef); stroke-dasharray: 3 2; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrowRef" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <text x="360" y="22" text-anchor="middle" class="title">s07: 先多扣一点用完退,拦住超额调用</text>

  <!-- ============ TOP-LEFT: s05 + s06 参考框 (上两章, 本章接力) ============ -->

  <rect class="reference" x="20" y="52" width="280" height="120"/>
  <text x="160" y="74" text-anchor="middle" class="small" fill="#555">s05 auth + s06 token 计数 (上两章)</text>
  <text x="160" y="94" text-anchor="middle" class="refsmall">require_api_key → Principal (user_id)</text>
  <text x="160" y="112" text-anchor="middle" class="refsmall">count_prompt → prompt_tokens</text>
  <text x="160" y="130" text-anchor="middle" class="refsmall">这两个数字是本章的输入: 谁在打 + 这一单约多少 token</text>
  <text x="160" y="148" text-anchor="middle" class="refsmall">本章不重写, 直接接力</text>
  <text x="160" y="166" text-anchor="middle" class="refsmall">(对比: 不是 spend-after)</text>

  <!-- ============ MAIN FLOW (本章主路径) ============ -->

  <!-- Client -->
  <rect class="client" x="20" y="200" width="120" height="80"/>
  <text x="80" y="226" text-anchor="middle" class="label">Chat Client</text>
  <text x="80" y="244" text-anchor="middle" class="small">+ Bearer</text>
  <text x="80" y="262" text-anchor="middle" class="small">POST /v1/chat/completions</text>

  <!-- Relay handler -->
  <rect class="gateway" x="160" y="200" width="160" height="80"/>
  <text x="240" y="226" text-anchor="middle" class="label">/v1/chat/completions</text>
  <text x="240" y="244" text-anchor="middle" class="small">estimate = (pt + 256) × RATE</text>
  <text x="240" y="262" text-anchor="middle" class="small">deduct / settle / refund</text>

  <!-- quota store (NEW — in-memory, code.py process-local) -->
  <rect class="storage" x="340" y="200" width="160" height="80"/>
  <text x="420" y="226" text-anchor="middle" class="label">quota.py (内存 dict + Lock)</text>
  <text x="420" y="244" text-anchor="middle" class="small">_balances: dict[uid → int]</text>
  <text x="420" y="262" text-anchor="middle" class="small">deduct / refund / settle (原子)</text>

  <!-- Upstream -->
  <rect class="upstream" x="520" y="200" width="120" height="80"/>
  <text x="580" y="226" text-anchor="middle" class="label">Upstream</text>
  <text x="580" y="244" text-anchor="middle" class="small">回包带真实</text>
  <text x="580" y="262" text-anchor="middle" class="small">usage (pt + ct)</text>

  <!-- 402 reject path (dashed red) from quota back to client -->
  <line class="arrowR" x1="340" y1="220" x2="140" y2="220" stroke="#c5221f"/>
  <text x="240" y="215" text-anchor="middle" class="small" fill="#c5221f">estimate > balance → 402 Payment Required</text>

  <!-- Chain arrows (left to right) -->
  <line class="arrow" x1="140" y1="240" x2="158" y2="240"/>
  <text x="149" y="235" text-anchor="middle" class="small">Bearer</text>

  <!-- Handler -> quota: pre-deduct -->
  <line class="arrow" x1="320" y1="220" x2="338" y2="220"/>
  <text x="329" y="215" text-anchor="middle" class="small">先扣 estimate</text>

  <!-- Handler -> upstream: ask -->
  <line class="arrow" x1="320" y1="260" x2="518" y2="260"/>
  <text x="419" y="255" text-anchor="middle" class="small">ask</text>

  <!-- Upstream -> handler: reply with usage -->
  <line class="arrowR" x1="518" y1="240" x2="322" y2="240"/>
  <text x="420" y="235" text-anchor="middle" class="small">回包带 usage</text>

  <!-- Handler -> quota: settle / refund -->
  <line class="arrowR" x1="320" y1="278" x2="338" y2="278" stroke="#228b22"/>
  <text x="329" y="295" text-anchor="middle" class="small" fill="#228b22">退/补 差额</text>

  <!-- 502 / 4xx reject path (dashed red) — failure refund -->
  <line class="arrowR" x1="160" y1="295" x2="80" y2="295" stroke="#c5221f"/>
  <line class="arrowR" x1="80" y1="295" x2="80" y2="282" stroke="#c5221f"/>
  <text x="120" y="290" text-anchor="middle" class="small" fill="#c5221f">失败 → refund 全额 → 5xx/4xx</text>

  <!-- ============ BOTTOM ROW: 成功结算 + 响应回 client ============ -->

  <!-- 成功响应回 client (dashed): usage + quota_charged -->
  <line class="arrowR" x1="160" y1="320" x2="80" y2="320"/>
  <text x="120" y="315" text-anchor="middle" class="small">响应 usage + quota_charged</text>

  <!-- ============ s05 + s06 参考框 → s07 主路径 的"接力"虚线 ============ -->

  <line class="arrowRef" x1="240" y1="174" x2="240" y2="198"/>
  <text x="246" y="190" text-anchor="start" class="refsmall">接力</text>

  <!-- ============ Caption: WHY → 本章做了啥 → 后续接力 ============ -->

  <text x="360" y="362" text-anchor="middle" class="small">没有 s07: 网关在请求飞行前不知道够不够扣, 并发请求可能让用户变负; 失败调用照样扣费, 用户不愿付钱</text>
  <text x="360" y="380" text-anchor="middle" class="small">本章做了啥: 预扣 estimate (调前) + settle 退/补差额 (调后) + 失败整笔 refund, 全在 quota.py 进程内 dict + threading.Lock 下原子</text>
  <text x="360" y="408" text-anchor="middle" class="small">后续接力: s08 在闸门后按 Principal 限速 (本章只算账不限速), s09 把 _balances 持久化进 SQLite 走事务化扣减 (进程内 dict 重启即失)</text>
  <text x="360" y="426" text-anchor="middle" class="small">注意 s07 是 pre-consume 不是 post-bill: 先扣够再打, 失败也退, 用户不为无效调用付费</text>
</svg>
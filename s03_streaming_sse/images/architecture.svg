<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="monospace">
  <style>
    .client   { fill: #fafafa; stroke: #333;    stroke-width: 1.5; }
    .gateway  { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2;   }
    .upstream { fill: #fce8e6; stroke: #c5221f; stroke-width: 1.5; }
    .title    { font-size: 15px; font-weight: bold; fill: #222; }
    .label    { font-size: 13px; fill: #222; }
    .small    { font-size: 11px; fill: #555; }
    .arrow    { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrowR   { stroke: #555; stroke-width: 1;   fill: none; marker-end: url(#arrow); stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <text x="400" y="22" text-anchor="middle" class="title">s03: 一个字一个字流出去</text>

  <!-- Client -->
  <rect class="client" x="40" y="100" width="160" height="80"/>
  <text x="120" y="130" text-anchor="middle" class="label">Client</text>
  <text x="120" y="148" text-anchor="middle" class="small">stream:true</text>
  <text x="120" y="166" text-anchor="middle" class="small">curl -N / SDK stream=True</text>

  <!-- Relay (gateway) -->
  <rect class="gateway" x="280" y="100" width="220" height="80"/>
  <text x="390" y="128" text-anchor="middle" class="label">Relay</text>
  <text x="390" y="146" text-anchor="middle" class="small">StreamingResponse</text>
  <text x="390" y="164" text-anchor="middle" class="small">async for chunk in aiter_bytes()</text>
  <text x="390" y="182" text-anchor="middle" class="small">cache-control: no-cache + x-accel-buffering: no</text>

  <!-- Upstream -->
  <rect class="upstream" x="580" y="100" width="160" height="80"/>
  <text x="660" y="130" text-anchor="middle" class="label">Upstream (SSE)</text>
  <text x="660" y="148" text-anchor="middle" class="small">text/event-stream</text>
  <text x="660" y="166" text-anchor="middle" class="small">data: {chunk}\n\n ...</text>

  <!-- Request flow (top, single line) -->
  <line class="arrow" x1="200" y1="130" x2="278" y2="130"/>
  <line class="arrow" x1="500" y1="130" x2="578" y2="130"/>
  <text x="239" y="125" text-anchor="middle" class="small">POST {stream:true}</text>
  <text x="539" y="125" text-anchor="middle" class="small">forwarded</text>

  <!-- SSE chunk 1 -->
  <line class="arrowR" x1="578" y1="142" x2="500" y2="142"/>
  <line class="arrowR" x1="278" y1="142" x2="200" y2="142"/>
  <text x="539" y="138" text-anchor="middle" class="small">data: hello\n\n</text>
  <text x="239" y="138" text-anchor="middle" class="small">data: hello\n\n</text>

  <!-- SSE chunk 2 -->
  <line class="arrowR" x1="578" y1="156" x2="500" y2="156"/>
  <line class="arrowR" x1="278" y1="156" x2="200" y2="156"/>
  <text x="539" y="172" text-anchor="middle" class="small">data: world\n\n</text>
  <text x="239" y="172" text-anchor="middle" class="small">data: world\n\n</text>

  <!-- SSE DONE -->
  <line class="arrowR" x1="578" y1="170" x2="500" y2="170"/>
  <line class="arrowR" x1="278" y1="170" x2="200" y2="170"/>
  <text x="539" y="166" text-anchor="middle" class="small">data: [DONE]\n\n</text>
  <text x="239" y="166" text-anchor="middle" class="small">data: [DONE]\n\n</text>

  <!-- Caption -->
  <text x="400" y="240" text-anchor="middle" class="small">StreamingResponse:转发第一个字节就开始往客户端 flush,不等整个 body</text>
  <text x="400" y="258" text-anchor="middle" class="small">req.stream ? aiter_bytes passthrough : s02 JSON 路径</text>
</svg>
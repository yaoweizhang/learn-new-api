<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="monospace">
  <style>
    .client   { fill: #fafafa; stroke: #333;    stroke-width: 1.5; }
    .gateway  { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2;   }
    .upstream { fill: #fce8e6; stroke: #c5221f; stroke-width: 1.5; }
    .title    { font-size: 14px; font-weight: bold; fill: #222; }
    .label    { font-size: 13px; fill: #222; }
    .small    { font-size: 11px; fill: #555; }
    .arrow    { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrowR   { stroke: #555; stroke-width: 1;   fill: none; marker-end: url(#arrow); stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <text x="360" y="22" text-anchor="middle" class="title">s03: stream=true 时,转发第一个字节就开始推</text>

  <rect class="client" x="40" y="80" width="160" height="80"/>
  <text x="120" y="105" text-anchor="middle" class="label">Client</text>
  <text x="120" y="125" text-anchor="middle" class="small">流式调用方 · 读一个 chunk 渲一个</text>

  <rect class="gateway" x="260" y="72" width="200" height="96"/>
  <text x="360" y="97" text-anchor="middle" class="label">Relay</text>
  <text x="360" y="117" text-anchor="middle" class="small">本章要写 · 拿到字节就 yield</text>

  <rect class="upstream" x="520" y="80" width="160" height="80"/>
  <text x="600" y="105" text-anchor="middle" class="label">Upstream</text>
  <text x="600" y="125" text-anchor="middle" class="small">SSE · data:... 一帧接一帧</text>

  <line class="arrow" x1="200" y1="116" x2="258" y2="116"/>
  <text x="229" y="111" text-anchor="middle" class="small">stream:true</text>
  <line class="arrow" x1="460" y1="116" x2="518" y2="116"/>
  <text x="489" y="111" text-anchor="middle" class="small">开长连接</text>

  <line class="arrowR" x1="518" y1="146" x2="462" y2="146"/>
  <line class="arrowR" x1="258" y1="146" x2="202" y2="146"/>
  <text x="360" y="141" text-anchor="middle" class="small">首个 chunk 立刻吐</text>
</svg>
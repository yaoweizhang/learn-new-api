<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" font-family="monospace">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <!-- Client -->
  <rect x="10" y="100" width="80" height="60" fill="#eee" stroke="#333"/>
  <text x="50" y="135" text-anchor="middle">Client</text>

  <!-- Relay -->
  <rect x="200" y="100" width="160" height="60" fill="#cfc" stroke="#333"/>
  <text x="280" y="130" text-anchor="middle">Relay</text>
  <text x="280" y="148" text-anchor="middle" font-size="10">/v1/chat/completions</text>

  <!-- Upstream -->
  <rect x="470" y="100" width="80" height="60" fill="#eee" stroke="#333"/>
  <text x="510" y="135" text-anchor="middle">Upstream</text>

  <!-- Request (single line, top) -->
  <line x1="90" y1="85" x2="200" y2="85" stroke="#333" marker-end="url(#a)"/>
  <text x="145" y="77" text-anchor="middle" font-size="10">POST {stream:true}</text>
  <line x1="360" y1="85" x2="470" y2="85" stroke="#333" marker-end="url(#a)"/>
  <text x="415" y="77" text-anchor="middle" font-size="10">forwarded</text>

  <!-- SSE chunk 1 -->
  <line x1="470" y1="125" x2="360" y2="125" stroke="#888" marker-end="url(#b)"/>
  <line x1="200" y1="125" x2="90" y2="125" stroke="#888" marker-end="url(#b)"/>
  <text x="415" y="118" text-anchor="middle" font-size="9" fill="#555">data: hello</text>
  <text x="145" y="118" text-anchor="middle" font-size="9" fill="#555">data: hello</text>

  <!-- SSE chunk 2 -->
  <line x1="470" y1="145" x2="360" y2="145" stroke="#888" marker-end="url(#b)"/>
  <line x1="200" y1="145" x2="90" y2="145" stroke="#888" marker-end="url(#b)"/>
  <text x="415" y="160" text-anchor="middle" font-size="9" fill="#555">data: world</text>
  <text x="145" y="160" text-anchor="middle" font-size="9" fill="#555">data: world</text>

  <!-- SSE [DONE] -->
  <line x1="470" y1="175" x2="360" y2="175" stroke="#888" marker-end="url(#b)"/>
  <line x1="200" y1="175" x2="90" y2="175" stroke="#888" marker-end="url(#b)"/>
  <text x="415" y="192" text-anchor="middle" font-size="9" fill="#555">data: [DONE]</text>
  <text x="145" y="192" text-anchor="middle" font-size="9" fill="#555">data: [DONE]</text>

  <!-- Annotation -->
  <text x="280" y="225" text-anchor="middle" font-size="11" fill="#555">aiter_bytes() passthrough</text>
  <line x1="280" y1="200" x2="280" y2="215" stroke="#888" stroke-dasharray="3,2"/>
</svg>
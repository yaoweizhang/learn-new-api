<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="monospace">
  <style>
    .client     { fill: #fafafa; stroke: #333;    stroke-width: 1.5; }
    .gateway    { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2;   }
    .middleware { fill: #fff5d6; stroke: #b58900; stroke-width: 1.5; }
    .upstream   { fill: #fce8e6; stroke: #c5221f; stroke-width: 1.5; }
    .title      { font-size: 15px; font-weight: bold; fill: #222; }
    .label      { font-size: 13px; fill: #222; }
    .small      { font-size: 11px; fill: #555; }
    .arrow      { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrowR     { stroke: #555; stroke-width: 1;   fill: none; marker-end: url(#arrow); stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <text x="360" y="22" text-anchor="middle" class="title">s05: 一行密码头拦住匿名,401 把 unknown 打掉</text>

  <!-- Client -->
  <rect class="client" x="40" y="84" width="160" height="96"/>
  <text x="120" y="110" text-anchor="middle" class="label">Chat Client</text>
  <text x="120" y="130" text-anchor="middle" class="small">带: Authorization: Bearer &lt;key&gt;</text>
  <text x="120" y="146" text-anchor="middle" class="small">不带: 直接 POST /v1/chat/...</text>
  <text x="120" y="162" text-anchor="middle" class="small">不知道 key 是谁发的</text>

  <!-- Auth middleware -->
  <rect class="middleware" x="240" y="80" width="200" height="104"/>
  <text x="340" y="106" text-anchor="middle" class="label">require_api_key 闸门</text>
  <text x="340" y="124" text-anchor="middle" class="small">depends(require_api_key)</text>
  <text x="340" y="140" text-anchor="middle" class="small">读 Bearer, 剥前缀, 查 key</text>
  <text x="340" y="156" text-anchor="middle" class="small">缺 / 错 / 黑 -&gt; 401</text>
  <text x="340" y="172" text-anchor="middle" class="small">通过: 挂 Principal 到 request.state</text>

  <!-- Relay (gateway) -->
  <rect class="gateway" x="480" y="80" width="200" height="104"/>
  <text x="580" y="106" text-anchor="middle" class="label">/v1/chat/completions</text>
  <text x="580" y="124" text-anchor="middle" class="small">chat 路由处理器</text>
  <text x="580" y="140" text-anchor="middle" class="small">假设闸门已放行</text>
  <text x="580" y="156" text-anchor="middle" class="small">pick_provider + 转发 (s04)</text>
  <text x="580" y="172" text-anchor="middle" class="small">新路由默认是开放的</text>

  <!-- Request flow client -> auth (with bearer) -->
  <line class="arrow" x1="200" y1="116" x2="238" y2="116"/>
  <text x="219" y="111" text-anchor="middle" class="small">Bearer sk-...</text>

  <!-- Auth -> gateway (principal passed) -->
  <line class="arrow" x1="440" y1="116" x2="478" y2="116"/>
  <text x="459" y="111" text-anchor="middle" class="small">Principal</text>

  <!-- 401 reject path (dashed red) -->
  <line stroke="#c5221f" stroke-width="1.2" fill="none" stroke-dasharray="4 3"
        x1="340" y1="184" x2="340" y2="240"/>
  <line stroke="#c5221f" stroke-width="1.2" fill="none" stroke-dasharray="4 3"
        x1="340" y1="240" x2="120" y2="240"/>
  <line stroke="#c5221f" stroke-width="1.2" fill="none" stroke-dasharray="4 3"
        x1="120" y1="240" x2="120" y2="182"/>
  <text x="230" y="232" text-anchor="middle" class="small" fill="#c5221f">无 key → 401</text>

  <!-- Caption: WHY this chapter exists -->
  <text x="360" y="262" text-anchor="middle" class="small">s04 中继完全敞开: 能摸到端口的人都能花你的上游 key, 按用户限速 / 计费 / scope 全挂不上去</text>
  <text x="360" y="280" text-anchor="middle" class="small">本章只做一件事: chat 路由前加 require_api_key 闸门, 缺 Bearer / 未知 key / 黑名单 → 401, 通过则挂 Principal 到 request.state</text>
  <text x="360" y="308" text-anchor="middle" class="small">后续 s07 在闸门后按 Principal 计配额, s08 按 Principal 限速, s11 把每次调用的 user_id 落日志</text>
</svg>

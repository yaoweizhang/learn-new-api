<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="monospace">
  <style>
    .client     { fill: #fafafa; stroke: #333;    stroke-width: 1.5; }
    .gateway    { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2;   }
    .middleware { fill: #fff5d6; stroke: #b58900; stroke-width: 1.5; }
    .upstream   { fill: #fce8e6; stroke: #c5221f; stroke-width: 1.5; }
    .title      { font-size: 14px; font-weight: bold; fill: #222; }
    .label      { font-size: 13px; fill: #222; }
    .small      { font-size: 11px; fill: #555; }
    .arrow      { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrowR     { stroke: #555; stroke-width: 1;   fill: none; marker-end: url(#arrow); stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <text x="360" y="22" text-anchor="middle" class="title">s05: chat 路由前加一道 Bearer 闸门,401 把匿名打掉</text>

  <!-- Client -->
  <rect class="client" x="40" y="80" width="160" height="80"/>
  <text x="120" y="105" text-anchor="middle" class="label">Client</text>
  <text x="120" y="125" text-anchor="middle" class="small">调用方 · 必须带 Bearer sk-...</text>

  <!-- Auth middleware -->
  <rect class="middleware" x="240" y="72" width="200" height="96"/>
  <text x="340" y="97" text-anchor="middle" class="label">require_api_key 闸门</text>
  <text x="340" y="117" text-anchor="middle" class="small">本章要写 · 读 Bearer + 查 key + 挂 Principal</text>

  <!-- Relay (gateway) -->
  <rect class="gateway" x="480" y="72" width="200" height="96"/>
  <text x="580" y="97" text-anchor="middle" class="label">/v1/chat/completions</text>
  <text x="580" y="117" text-anchor="middle" class="small">chat 路由 · 闸门已放行,跑转发 (s04)</text>

  <!-- Request flow client -> auth (with bearer) -->
  <line class="arrow" x1="200" y1="116" x2="238" y2="116"/>
  <text x="219" y="111" text-anchor="middle" class="small">Bearer</text>

  <!-- Auth -> gateway (principal passed) -->
  <line class="arrow" x1="440" y1="116" x2="478" y2="116"/>
  <text x="459" y="111" text-anchor="middle" class="small">+ Principal</text>

  <!-- 401 reject path (dashed red) -->
  <line stroke="#c5221f" stroke-width="1.2" fill="none" stroke-dasharray="4 3"
        x1="340" y1="170" x2="340" y2="220"/>
  <line stroke="#c5221f" stroke-width="1.2" fill="none" stroke-dasharray="4 3"
        x1="340" y1="220" x2="120" y2="220"/>
  <line stroke="#c5221f" stroke-width="1.2" fill="none" stroke-dasharray="4 3"
        x1="120" y1="220" x2="120" y2="162"/>
  <text x="230" y="212" text-anchor="middle" class="small" fill="#c5221f">401</text>
</svg>
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="monospace">
  <style>
    .client     { fill: #fafafa; stroke: #333;    stroke-width: 1.5; }
    .gateway    { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2;   }
    .middleware { fill: #fff5d6; stroke: #b58900; stroke-width: 1.5; }
    .upstream   { fill: #fce8e6; stroke: #c5221f; stroke-width: 1.5; }
    .title      { font-size: 15px; font-weight: bold; fill: #222; }
    .label      { font-size: 13px; fill: #222; }
    .small      { font-size: 11px; fill: #555; }
    .arrow      { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrowR     { stroke: #555; stroke-width: 1;   fill: none; marker-end: url(#arrow); stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <text x="360" y="22" text-anchor="middle" class="title">s05: Bearer 一行拦住所有人</text>

  <!-- Client -->
  <rect class="client" x="40" y="100" width="140" height="80"/>
  <text x="110" y="130" text-anchor="middle" class="label">Client</text>
  <text x="110" y="148" text-anchor="middle" class="small">+ Bearer &lt;key&gt;</text>
  <text x="110" y="166" text-anchor="middle" class="small">Authorization header</text>

  <!-- Auth middleware -->
  <rect class="middleware" x="220" y="100" width="200" height="80"/>
  <text x="320" y="128" text-anchor="middle" class="label">require_api_key</text>
  <text x="320" y="146" text-anchor="middle" class="small">is_blocked? / lookup_key</text>
  <text x="320" y="164" text-anchor="middle" class="small">-&gt; Principal (user_id, scopes)</text>
  <text x="320" y="182" text-anchor="middle" class="small">挂在 request.state</text>

  <!-- Relay (gateway) -->
  <rect class="gateway" x="460" y="100" width="220" height="80"/>
  <text x="570" y="130" text-anchor="middle" class="label">/v1/chat/completions</text>
  <text x="570" y="148" text-anchor="middle" class="small">Depends(require_api_key)</text>
  <text x="570" y="166" text-anchor="middle" class="small">upstream forward</text>

  <!-- Request flow client -> auth -->
  <line class="arrow" x1="180" y1="130" x2="218" y2="130"/>
  <text x="199" y="125" text-anchor="middle" class="small">POST + Bearer</text>

  <!-- 401 reject path (dashed red back to client) -->
  <line class="arrowR" x1="320" y1="180" x2="320" y2="260" stroke="#c5221f"/>
  <line class="arrowR" x1="320" y1="260" x2="110" y2="260" stroke="#c5221f"/>
  <line class="arrowR" x1="110" y1="260" x2="110" y2="182" stroke="#c5221f"/>
  <text x="320" y="240" text-anchor="middle" class="small" fill="#c5221f">missing / unknown / blocked -&gt; 401</text>

  <!-- Auth -> gateway (allowed) -->
  <line class="arrow" x1="420" y1="130" x2="458" y2="130"/>
  <text x="439" y="125" text-anchor="middle" class="small">Principal</text>

  <!-- Caption -->
  <text x="360" y="304" text-anchor="middle" class="small">Authorization: Bearer &lt;key&gt; -&gt; 401 if missing / unknown / blocked · 自定义 401 JSON body</text>
</svg>
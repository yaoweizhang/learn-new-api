<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="monospace">
  <style>
    .client   { fill: #fafafa; stroke: #333;    stroke-width: 1.5; }
    .gateway  { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2;   }
    .upstream { fill: #fce8e6; stroke: #c5221f; stroke-width: 1.5; }
    .title    { font-size: 15px; font-weight: bold; fill: #222; }
    .label    { font-size: 13px; fill: #222; }
    .small    { font-size: 11px; fill: #555; }
    .arrow    { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrowR   { stroke: #555; stroke-width: 1;   fill: none; marker-end: url(#arrow); stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <text x="360" y="22" text-anchor="middle" class="title">s01: 最小的转发中继内核</text>

  <!-- Client -->
  <rect class="client" x="40" y="100" width="160" height="80"/>
  <text x="120" y="130" text-anchor="middle" class="label">Client</text>
  <text x="120" y="148" text-anchor="middle" class="small">httpx / curl / SDK</text>
  <text x="120" y="166" text-anchor="middle" class="small">POST /v1/chat/completions</text>

  <!-- Relay (gateway) -->
  <rect class="gateway" x="260" y="100" width="200" height="80"/>
  <text x="360" y="130" text-anchor="middle" class="label">Relay (FastAPI)</text>
  <text x="360" y="148" text-anchor="middle" class="small">s01_minimal_relay</text>
  <text x="360" y="166" text-anchor="middle" class="small">2 routes: /health, /relay</text>

  <!-- Upstream -->
  <rect class="upstream" x="520" y="100" width="160" height="80"/>
  <text x="600" y="130" text-anchor="middle" class="label">Upstream</text>
  <text x="600" y="148" text-anchor="middle" class="small">OpenAI / Claude / Gemini</text>
  <text x="600" y="166" text-anchor="middle" class="small">httpx POST forward</text>

  <!-- Request flow (top) -->
  <line class="arrow" x1="200" y1="130" x2="258" y2="130"/>
  <line class="arrow" x1="460" y1="130" x2="518" y2="130"/>
  <text x="229" y="125" text-anchor="middle" class="small">HTTP request</text>
  <text x="489" y="125" text-anchor="middle" class="small">HTTP request</text>

  <!-- Response flow (bottom) -->
  <line class="arrowR" x1="258" y1="160" x2="200" y2="160"/>
  <line class="arrowR" x1="518" y1="160" x2="460" y2="160"/>
  <text x="229" y="175" text-anchor="middle" class="small">response</text>
  <text x="489" y="175" text-anchor="middle" class="small">response</text>

  <!-- Caption -->
  <text x="360" y="240" text-anchor="middle" class="small">2 routes in code.py: /health (GET), /relay (POST) — 自创路径,s02 才换成 /v1/chat/completions</text>
  <text x="360" y="258" text-anchor="middle" class="small">No auth · No rate-limit · No quota · Just forward</text>
</svg>

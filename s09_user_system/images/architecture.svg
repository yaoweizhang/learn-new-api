<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="monospace">
  <style>
    .client     { fill: #fafafa; stroke: #333;    stroke-width: 1.5; }
    .gateway    { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2;   }
    .middleware { fill: #fff5d6; stroke: #b58900; stroke-width: 1.5; }
    .storage    { fill: #e6f4ea; stroke: #228b22; stroke-width: 1.5; }
    .title      { font-size: 15px; font-weight: bold; fill: #222; }
    .label      { font-size: 13px; fill: #222; }
    .small      { font-size: 11px; fill: #555; }
    .arrow      { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrowR     { stroke: #555; stroke-width: 1;   fill: none; marker-end: url(#arrow); stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <text x="360" y="22" text-anchor="middle" class="title">s09: 邮箱注册换真用户,密码哈希 + 签 JWT</text>

  <!-- ============ TOP ROW: signup/login flow ============ -->

  <!-- Client -->
  <rect class="client" x="40" y="64" width="160" height="96"/>
  <text x="120" y="90" text-anchor="middle" class="label">Dashboard / Admin</text>
  <text x="120" y="110" text-anchor="middle" class="small">浏览器 / curl</text>
  <text x="120" y="126" text-anchor="middle" class="small">POST /auth/signup</text>
  <text x="120" y="142" text-anchor="middle" class="small">POST /auth/login</text>

  <!-- /auth/signup · /auth/login -->
  <rect class="gateway" x="240" y="60" width="180" height="104"/>
  <text x="330" y="84" text-anchor="middle" class="label">/auth/signup · /auth/login</text>
  <text x="330" y="104" text-anchor="middle" class="small">bcrypt.hashpw 存密码</text>
  <text x="330" y="120" text-anchor="middle" class="small">bcrypt.checkpw 验密码</text>
  <text x="330" y="136" text-anchor="middle" class="small">issue(uid, email, is_admin)</text>
  <text x="330" y="152" text-anchor="middle" class="small">HS256 签名, payload 带上 exp</text>

  <!-- JWT verify dependency -->
  <rect class="middleware" x="460" y="60" width="220" height="104"/>
  <text x="570" y="84" text-anchor="middle" class="label">_current_user 依赖</text>
  <text x="570" y="104" text-anchor="middle" class="small">decode Bearer &lt;jwt&gt;</text>
  <text x="570" y="120" text-anchor="middle" class="small">先查 is_revoked(SHA-256)</text>
  <text x="570" y="136" text-anchor="middle" class="small">再验签名 + exp</text>
  <text x="570" y="152" text-anchor="middle" class="small">/me 拿 claims {id, email, is_admin}</text>

  <!-- Client -> /auth (signup) -->
  <line class="arrow" x1="200" y1="90" x2="238" y2="90"/>
  <text x="219" y="85" text-anchor="middle" class="small">email + pwd</text>

  <!-- /auth -> client (token) dashed return -->
  <line class="arrowR" x1="238" y1="110" x2="202" y2="110"/>
  <text x="220" y="105" text-anchor="middle" class="small">JWT</text>

  <!-- /auth <-> users.db (storage) -->
  <line class="arrow" x1="420" y1="112" x2="458" y2="112"/>
  <text x="439" y="107" text-anchor="middle" class="small">查表</text>

  <!-- /me arrow client -> _current_user with JWT (top track) -->
  <line class="arrow" x1="200" y1="148" x2="458" y2="148"/>
  <text x="320" y="143" text-anchor="middle" class="small">Bearer &lt;jwt&gt;</text>

  <!-- /me return -->
  <line class="arrowR" x1="460" y1="158" x2="202" y2="158"/>
  <text x="330" y="153" text-anchor="middle" class="small">200 {id, email, is_admin}</text>

  <!-- ============ BOTTOM ROW: logout flow ============ -->

  <!-- /auth/logout -->
  <rect class="middleware" x="240" y="208" width="180" height="96"/>
  <text x="330" y="232" text-anchor="middle" class="label">/auth/logout</text>
  <text x="330" y="252" text-anchor="middle" class="small">revoke()</text>
  <text x="330" y="268" text-anchor="middle" class="small">SHA-256(token) 进黑名单</text>
  <text x="330" y="284" text-anchor="middle" class="small">204 No Content</text>

  <!-- users.db -->
  <rect class="storage" x="460" y="208" width="220" height="96"/>
  <text x="570" y="232" text-anchor="middle" class="label">users.db (SQLite)</text>
  <text x="570" y="252" text-anchor="middle" class="small">id / email / password_hash</text>
  <text x="570" y="268" text-anchor="middle" class="small">is_admin / created_at</text>
  <text x="570" y="284" text-anchor="middle" class="small">create_user / find_by_email</text>

  <!-- Client -> /auth/logout -->
  <line class="arrow" x1="200" y1="240" x2="238" y2="240"/>
  <text x="219" y="235" text-anchor="middle" class="small">Bearer &lt;jwt&gt;</text>

  <!-- /auth/logout -> users.db (deny-list lives alongside storage) -->
  <line class="arrow" x1="420" y1="240" x2="458" y2="240"/>
  <text x="439" y="235" text-anchor="middle" class="small">deny-list</text>

  <!-- /auth/logout -> client (204) dashed -->
  <line class="arrowR" x1="238" y1="260" x2="202" y2="260"/>
  <text x="220" y="255" text-anchor="middle" class="small">204</text>

  <!-- Caption: WHY this chapter exists -->
  <text x="360" y="318" text-anchor="middle" class="small">s05 用 API key 字符串代替用户: 不能注册 / 找回 / 改密, 明文存等数据库一漏全员完蛋</text>
  <text x="360" y="336" text-anchor="middle" class="small">本章只做一件事: 邮箱注册 + bcrypt 哈希 + HS256 JWT, JWT 走 SHA-256 黑名单支持注销</text>
  <text x="360" y="354" text-anchor="middle" class="small">chat 路径保留 s05 (不替换), dashboard / admin 给运营一套真身份钥匙, s10 用 is_admin 给管理员加渠道</text>
</svg>

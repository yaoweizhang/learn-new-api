<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="monospace">
  <style>
    .client     { fill: #fafafa; stroke: #333;    stroke-width: 1.5; }
    .gateway    { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2;   }
    .middleware { fill: #fff5d6; stroke: #b58900; stroke-width: 1.5; }
    .storage    { fill: #e6f4ea; stroke: #228b22; stroke-width: 1.5; }
    .reference  { fill: #f5f5f5; stroke: #888;    stroke-width: 1; stroke-dasharray: 4 3; }
    .title      { font-size: 14px; font-weight: bold; fill: #222; }
    .label      { font-size: 13px; fill: #222; }
    .small      { font-size: 11px; fill: #555; }
    .refsmall   { font-size: 11px; fill: #777; }
    .arrow      { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrowR     { stroke: #555; stroke-width: 1;   fill: none; marker-end: url(#arrow); stroke-dasharray: 4 3; }
    .arrowRef   { stroke: #888; stroke-width: 1;   fill: none; marker-end: url(#arrowRef); stroke-dasharray: 3 2; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrowRef" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <text x="360" y="22" text-anchor="middle" class="title">s09: 注册换真用户,JWT+黑名单(双轨之二)</text>

  <!-- s05 chat 路径 参考框 (双轨其一) -->
  <rect class="reference" x="20" y="50" width="200" height="60"/>
  <text x="120" y="78" text-anchor="middle" class="small" fill="#555">s05 chat 路径</text>
  <text x="120" y="98" text-anchor="middle" class="refsmall">Bearer sk-… 闸门</text>

  <!-- Client -->
  <rect class="client" x="250" y="50" width="130" height="60"/>
  <text x="315" y="78" text-anchor="middle" class="label">Client</text>
  <text x="315" y="98" text-anchor="middle" class="small">邮箱+密码 表单</text>

  <!-- /auth/signup · /auth/login -->
  <rect class="gateway" x="410" y="50" width="160" height="60"/>
  <text x="490" y="78" text-anchor="middle" class="label">signup · login</text>
  <text x="490" y="98" text-anchor="middle" class="small">bcrypt + 签 JWT</text>

  <!-- /me 路由 + _current_user 依赖 -->
  <rect class="middleware" x="600" y="50" width="110" height="60"/>
  <text x="655" y="78" text-anchor="middle" class="label">GET /me</text>
  <text x="655" y="98" text-anchor="middle" class="small">验签+查黑名单</text>

  <!-- Client -> /auth -->
  <line class="arrow" x1="380" y1="75" x2="408" y2="75"/>
  <text x="394" y="70" text-anchor="middle" class="small">凭据</text>

  <!-- /auth -> client (JWT) -->
  <line class="arrowR" x1="408" y1="95" x2="382" y2="95"/>
  <text x="395" y="90" text-anchor="middle" class="small">JWT</text>

  <!-- Client -> /me -->
  <line class="arrow" x1="315" y1="110" x2="315" y2="150"/>
  <line class="arrow" x1="315" y1="150" x2="655" y2="150"/>
  <text x="485" y="145" text-anchor="middle" class="small">Bearer</text>

  <!-- /me -> client -->
  <line class="arrowR" x1="655" y1="160" x2="315" y2="160"/>
  <text x="485" y="155" text-anchor="middle" class="small">claims</text>

  <!-- /auth/logout -->
  <rect class="middleware" x="250" y="190" width="170" height="60"/>
  <text x="335" y="218" text-anchor="middle" class="label">/auth/logout</text>
  <text x="335" y="238" text-anchor="middle" class="small">撤销 JWT</text>

  <!-- users.db (SQLite) -->
  <rect class="storage" x="450" y="190" width="150" height="60"/>
  <text x="525" y="218" text-anchor="middle" class="label">users.db</text>
  <text x="525" y="238" text-anchor="middle" class="small">SQLite 表</text>

  <!-- token_blacklist (内存 box — Round-9 fix 保留) -->
  <rect class="middleware" x="630" y="190" width="80" height="60"/>
  <text x="670" y="218" text-anchor="middle" class="label">blacklist</text>
  <text x="670" y="238" text-anchor="middle" class="small">内存 set</text>

  <!-- Client -> /auth/logout -->
  <line class="arrow" x1="335" y1="110" x2="335" y2="188"/>
  <text x="345" y="160" text-anchor="start" class="small">Bearer</text>

  <!-- /auth/logout -> users.db -->
  <line class="arrow" x1="420" y1="210" x2="448" y2="210"/>
  <text x="434" y="205" text-anchor="middle" class="small">查</text>

  <!-- /auth/logout -> token_blacklist -->
  <line class="arrow" x1="420" y1="240" x2="628" y2="240"/>
  <text x="524" y="235" text-anchor="middle" class="small">撤</text>

  <!-- /auth/logout -> client -->
  <line class="arrowR" x1="250" y1="210" x2="200" y2="210"/>
  <text x="225" y="205" text-anchor="middle" class="small">204</text>

  <!-- s05 参考 → s09 主路径 的"对照"虚线 (双轨并存) -->
  <line class="arrowRef" x1="220" y1="80" x2="248" y2="68"/>
  <text x="240" y="68" text-anchor="middle" class="refsmall">并存</text>
</svg>
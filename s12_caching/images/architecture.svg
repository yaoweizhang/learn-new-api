<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="monospace">
  <style>
    .client     { fill: #fafafa; stroke: #333;    stroke-width: 1.5; }
    .gateway    { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2;   }
    .middleware { fill: #fff5d6; stroke: #b58900; stroke-width: 1.5; }
    .storage    { fill: #e6f4ea; stroke: #228b22; stroke-width: 1.5; }
    .upstream   { fill: #fce8e6; stroke: #c5221f; stroke-width: 1.5; }
    .reference  { fill: #f5f5f5; stroke: #888;    stroke-width: 1; stroke-dasharray: 4 3; }
    .title      { font-size: 14px; font-weight: bold; fill: #222; }
    .label      { font-size: 13px; fill: #222; }
    .small      { font-size: 11px; fill: #555; }
    .refsmall   { font-size: 11px; fill: #777; }
    .arrow      { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrowR     { stroke: #555; stroke-width: 1;   fill: none; marker-end: url(#arrow); stroke-dasharray: 4 3; }
    .arrowRef   { stroke: #888; stroke-width: 1;   fill: none; marker-end: url(#arrowRef); stroke-dasharray: 3 2; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrowRef" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <text x="360" y="22" text-anchor="middle" class="title">s12: 同 prompt 命中 → 直接吐 bytes, 不打上游</text>

  <!-- ============ TOP-LEFT: s11 mount 参考框 (前置, 本章接力) ============ -->

  <rect class="reference" x="20" y="50" width="260" height="80"/>
  <text x="150" y="78" text-anchor="middle" class="small" fill="#555">s11 mount (前置)</text>
  <text x="150" y="100" text-anchor="middle" class="refsmall">LogMiddleware + s10/s09/s08</text>
  <text x="150" y="118" text-anchor="middle" class="refsmall">CacheMiddleware 包在外层</text>

  <!-- ============ MAIN FLOW ============ -->

  <!-- Client -->
  <rect class="client" x="20" y="160" width="120" height="64"/>
  <text x="80" y="186" text-anchor="middle" class="label">Client</text>
  <text x="80" y="206" text-anchor="middle" class="small">+ Bearer · POST</text>

  <!-- CacheMiddleware (NEW) -->
  <rect class="middleware" x="170" y="160" width="170" height="64"/>
  <text x="255" y="186" text-anchor="middle" class="label">CacheMiddleware</text>
  <text x="255" y="206" text-anchor="middle" class="small">hit → 短路 / miss → 转发</text>

  <!-- cache store -->
  <rect class="storage" x="170" y="260" width="170" height="44"/>
  <text x="255" y="284" text-anchor="middle" class="label">cache.py</text>

  <!-- s11 mount (handler chain) -->
  <rect class="gateway" x="370" y="160" width="170" height="64"/>
  <text x="455" y="186" text-anchor="middle" class="label">s11 mount (接力)</text>
  <text x="455" y="206" text-anchor="middle" class="small">Log + s10/s09/s08</text>

  <!-- Upstream -->
  <rect class="upstream" x="570" y="160" width="130" height="64"/>
  <text x="635" y="186" text-anchor="middle" class="label">Upstream</text>
  <text x="635" y="206" text-anchor="middle" class="small">miss → 200 body</text>

  <!-- ============ ARROWS ============ -->

  <!-- client → CacheMiddleware -->
  <line class="arrow" x1="140" y1="190" x2="168" y2="190"/>
  <text x="154" y="185" text-anchor="middle" class="small">JSON</text>

  <!-- CacheMiddleware → cache: lookup -->
  <line class="arrow" x1="255" y1="224" x2="255" y2="258"/>
  <text x="261" y="244" text-anchor="start" class="small">key</text>

  <!-- CacheMiddleware → s11 mount: miss only -->
  <line class="arrow" x1="340" y1="190" x2="368" y2="190"/>
  <text x="354" y="185" text-anchor="middle" class="small">miss</text>

  <!-- s11 → upstream -->
  <line class="arrow" x1="540" y1="190" x2="568" y2="190"/>
  <text x="554" y="185" text-anchor="middle" class="small">ask</text>

  <!-- upstream → s11 → cache: write back (dashed red, routed BELOW) -->
  <polyline class="arrowR" points="635,224 635,288 342,288" stroke="#c5221f"/>
  <text x="500" y="283" text-anchor="middle" class="small" fill="#c5221f">写回</text>

  <!-- HIT short-circuit: cache → CacheMiddleware → client (dashed green, routed ABOVE) -->
  <polyline class="arrowR" points="200,260 200,138 80,138 80,160" stroke="#228b22"/>
  <text x="100" y="132" text-anchor="middle" class="small" fill="#228b22">命中 → 直接回</text>

  <!-- ============ s11 参考框 → s12 主路径 的"接力"虚线 ============ -->

  <line class="arrowRef" x1="280" y1="132" x2="280" y2="158"/>
  <text x="286" y="150" text-anchor="start" class="refsmall">接力</text>
</svg>
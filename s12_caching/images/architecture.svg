<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="monospace">
  <style>
    .client     { fill: #fafafa; stroke: #333;    stroke-width: 1.5; }
    .gateway    { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2;   }
    .middleware { fill: #fff5d6; stroke: #b58900; stroke-width: 1.5; }
    .storage    { fill: #e6f4ea; stroke: #228b22; stroke-width: 1.5; }
    .upstream   { fill: #fce8e6; stroke: #c5221f; stroke-width: 1.5; }
    .reference  { fill: #f5f5f5; stroke: #888;    stroke-width: 1; stroke-dasharray: 4 3; }
    .title      { font-size: 14px; font-weight: bold; fill: #222; }
    .label      { font-size: 13px; fill: #222; }
    .small      { font-size: 11px; fill: #555; }
    .refsmall   { font-size: 11px; fill: #777; }
    .arrow      { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrowR     { stroke: #555; stroke-width: 1;   fill: none; marker-end: url(#arrow); stroke-dasharray: 4 3; }
    .arrowRef   { stroke: #888; stroke-width: 1;   fill: none; marker-end: url(#arrowRef); stroke-dasharray: 3 2; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrowRef" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <text x="360" y="22" text-anchor="middle" class="title">s12: 同 prompt 命中→吐 bytes</text>

  <!-- s11 mount 参考框 (前置) -->
  <rect class="reference" x="20" y="50" width="200" height="50"/>
  <text x="120" y="76" text-anchor="middle" class="small" fill="#555">s11 mount</text>
  <text x="120" y="94" text-anchor="middle" class="refsmall">Log + 转发链</text>

  <!-- ============ MAIN FLOW ============ -->

  <!-- Client -->
  <rect class="client" x="20" y="130" width="110" height="56"/>
  <text x="75" y="158" text-anchor="middle" class="label">Client</text>
  <text x="75" y="176" text-anchor="middle" class="small">POST</text>

  <!-- CacheMiddleware (NEW) -->
  <rect class="middleware" x="155" y="130" width="160" height="56"/>
  <text x="235" y="158" text-anchor="middle" class="label">CacheMiddleware</text>
  <text x="235" y="176" text-anchor="middle" class="small">命中→短路</text>

  <!-- cache store -->
  <rect class="storage" x="155" y="225" width="160" height="40"/>
  <text x="235" y="249" text-anchor="middle" class="label">cache.py</text>

  <!-- s11 mount (handler chain) -->
  <rect class="gateway" x="345" y="130" width="160" height="56"/>
  <text x="425" y="158" text-anchor="middle" class="label">s11 mount</text>
  <text x="425" y="176" text-anchor="middle" class="small">→ 上游链</text>

  <!-- Upstream -->
  <rect class="upstream" x="540" y="130" width="120" height="56"/>
  <text x="600" y="158" text-anchor="middle" class="label">Upstream</text>
  <text x="600" y="176" text-anchor="middle" class="small">miss→200</text>

  <!-- ============ ARROWS ============ -->

  <!-- client → CacheMiddleware -->
  <line class="arrow" x1="130" y1="158" x2="153" y2="158"/>
  <text x="141" y="153" text-anchor="middle" class="small">JSON</text>

  <!-- CacheMiddleware → cache: lookup -->
  <line class="arrow" x1="235" y1="186" x2="235" y2="223"/>
  <text x="241" y="208" text-anchor="start" class="small">key</text>

  <!-- CacheMiddleware → s11 mount: miss only -->
  <line class="arrow" x1="315" y1="158" x2="343" y2="158"/>
  <text x="329" y="153" text-anchor="middle" class="small">miss</text>

  <!-- s11 → upstream -->
  <line class="arrow" x1="505" y1="158" x2="538" y2="158"/>
  <text x="521" y="153" text-anchor="middle" class="small">ask</text>

  <!-- upstream → s11 → cache: write back (dashed red, routed BELOW) -->
  <polyline class="arrowR" points="600,186 600,250 317,250" stroke="#c5221f"/>
  <text x="460" y="245" text-anchor="middle" class="small" fill="#c5221f">写回</text>

  <!-- HIT short-circuit: cache → CacheMiddleware → client (dashed green, routed ABOVE) -->
  <polyline class="arrowR" points="180,225 180,110 75,110 75,130" stroke="#228b22"/>
  <text x="100" y="105" text-anchor="middle" class="small" fill="#228b22">命中返</text>

  <!-- ============ s11 参考框 → s12 主路径 的"接力"虚线 ============ -->

  <line class="arrowRef" x1="220" y1="100" x2="220" y2="128"/>
  <text x="226" y="118" text-anchor="start" class="refsmall">接力</text>
</svg>
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="monospace">
  <style>
    .client     { fill: #fafafa; stroke: #333;    stroke-width: 1.5; }
    .gateway    { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2;   }
    .middleware { fill: #fff5d6; stroke: #b58900; stroke-width: 1.5; }
    .storage    { fill: #e6f4ea; stroke: #228b22; stroke-width: 1.5; }
    .upstream   { fill: #fce8e6; stroke: #c5221f; stroke-width: 1.5; }
    .reference  { fill: #f5f5f5; stroke: #888;    stroke-width: 1; stroke-dasharray: 4 3; }
    .title      { font-size: 15px; font-weight: bold; fill: #222; }
    .label      { font-size: 13px; fill: #222; }
    .small      { font-size: 11px; fill: #555; }
    .refsmall   { font-size: 11px; fill: #777; }
    .arrow      { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrowR     { stroke: #555; stroke-width: 1;   fill: none; marker-end: url(#arrow); stroke-dasharray: 4 3; }
    .arrowRef   { stroke: #888; stroke-width: 1;   fill: none; marker-end: url(#arrowRef); stroke-dasharray: 3 2; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrowRef" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <text x="360" y="22" text-anchor="middle" class="title">s12: 完全相同 prompt 命中缓存, 不再重打上游</text>

  <!-- ============ TOP-LEFT: s11 mount 参考框 (前置章节, 本章接力) ============ -->

  <rect class="reference" x="20" y="52" width="280" height="100"/>
  <text x="160" y="74" text-anchor="middle" class="small" fill="#555">s11 call_logs mount (前置)</text>
  <text x="160" y="92" text-anchor="middle" class="refsmall">LogMiddleware (异步落日志)</text>
  <text x="160" y="108" text-anchor="middle" class="refsmall">+ s10 channels → s09 users → s08 bucket</text>
  <text x="160" y="124" text-anchor="middle" class="refsmall">本章 CacheMiddleware 包在外层 (call_next)</text>
  <text x="160" y="140" text-anchor="middle" class="refsmall">对比: 不缓存 stream=true 的请求</text>

  <!-- ============ MAIN FLOW ============ -->

  <!-- Client -->
  <rect class="client" x="20" y="200" width="120" height="80"/>
  <text x="80" y="226" text-anchor="middle" class="label">Chat Client</text>
  <text x="80" y="244" text-anchor="middle" class="small">+ Bearer API key</text>
  <text x="80" y="262" text-anchor="middle" class="small">POST /v1/chat/completions</text>

  <!-- CacheMiddleware (NEW) -->
  <rect class="middleware" x="160" y="200" width="180" height="80"/>
  <text x="250" y="226" text-anchor="middle" class="label">CacheMiddleware (本章)</text>
  <text x="250" y="244" text-anchor="middle" class="small">key = sha256(canonical JSON)</text>
  <text x="250" y="262" text-anchor="middle" class="small">hit → 直接返 | miss → call_next</text>

  <!-- cache store -->
  <rect class="storage" x="160" y="320" width="180" height="80"/>
  <text x="250" y="346" text-anchor="middle" class="label">cache.py (内存 dict + Lock)</text>
  <text x="250" y="364" text-anchor="middle" class="small">_store: dict[key, (exp, bytes)]</text>
  <text x="250" y="382" text-anchor="middle" class="small">get/set/stats · TTL 300s · monotonic</text>

  <!-- s11 mount → upstream -->
  <rect class="gateway" x="360" y="200" width="160" height="80"/>
  <text x="440" y="226" text-anchor="middle" class="label">s11 mount (接力)</text>
  <text x="440" y="244" text-anchor="middle" class="small">LogMiddleware + s10/s09/s08</text>
  <text x="440" y="262" text-anchor="middle" class="small">→ POST 上游 (miss 时才走)</text>

  <!-- Upstream -->
  <rect class="upstream" x="540" y="200" width="160" height="80"/>
  <text x="620" y="226" text-anchor="middle" class="label">Upstream</text>
  <text x="620" y="244" text-anchor="middle" class="small">OpenAI / Claude / Gemini</text>
  <text x="620" y="262" text-anchor="middle" class="small">miss → 200 body → cache.set</text>

  <!-- ============ ARROWS ============ -->

  <!-- client → CacheMiddleware -->
  <line class="arrow" x1="140" y1="240" x2="158" y2="240"/>
  <text x="149" y="235" text-anchor="middle" class="small">JSON body</text>

  <!-- CacheMiddleware → cache: lookup -->
  <line class="arrow" x1="250" y1="282" x2="250" y2="318"/>
  <text x="256" y="304" text-anchor="start" class="small">hash(prompt+model) → key</text>

  <!-- CacheMiddleware → s11 mount: miss only -->
  <line class="arrow" x1="340" y1="240" x2="358" y2="240"/>
  <text x="349" y="235" text-anchor="middle" class="small">未命中 → 上游</text>

  <!-- s11 → upstream -->
  <line class="arrow" x1="520" y1="240" x2="538" y2="240"/>
  <text x="529" y="235" text-anchor="middle" class="small">HTTP</text>

  <!-- upstream → s11 → cache: write back (dashed red, routed BELOW) -->
  <polyline class="arrowR" points="620,295 620,360 342,360"/>
  <text x="500" y="355" text-anchor="middle" class="small" fill="#c5221f">200 body → cache.set(key, body, ttl=300)</text>

  <!-- HIT short-circuit: cache → CacheMiddleware → client (dashed green, routed ABOVE) -->
  <polyline class="arrowR" points="200,320 200,170 80,170 80,198" stroke="#228b22"/>
  <text x="100" y="164" text-anchor="middle" class="small" fill="#228b22">命中 → 直接回</text>

  <!-- ============ s11 参考框 → s12 主路径 的"接力"虚线 ============ -->

  <line class="arrowRef" x1="240" y1="152" x2="240" y2="198"/>
  <text x="246" y="178" text-anchor="start" class="refsmall">接力</text>

  <!-- ============ Caption: WHY → 本章做了啥 → 后续接力 ============ -->

  <text x="360" y="436" text-anchor="middle" class="small">没有 s12: 1000 个相同 prompt 1000 次打上游, 账单翻 1000 倍, 冷启动 800ms 体感延迟</text>
  <text x="360" y="454" text-anchor="middle" class="small">本章做了啥: CacheMiddleware 包在 s11 mount 外层, sha256(canonical JSON) 做 key, 命中直接吐 bytes (短路), miss → call_next + 写回 cache (TTL 300s, monotonic 时钟)</text>
  <text x="360" y="472" text-anchor="middle" class="small">后续接力: s13 在 CacheMiddleware 内侧加失败回落 (落下一条渠道), 真上 Redis 时接口不动 cache.py 一文件替换 (签名照搬 redis-py)</text>
  <text x="360" y="490" text-anchor="middle" class="small">注意精确匹配不是语义缓存: "讲个笑话" 和 "给我说个笑话" 在本章算两个 key; stream=true 也跳过 (SSE 是持续字节流没法整体缓存)</text>
</svg>
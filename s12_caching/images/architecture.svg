<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="monospace">
  <style>
    .client     { fill: #fafafa; stroke: #333;    stroke-width: 1.5; }
    .gateway    { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2;   }
    .middleware { fill: #fff5d6; stroke: #b58900; stroke-width: 1.5; }
    .storage    { fill: #e6f4ea; stroke: #228b22; stroke-width: 1.5; }
    .upstream   { fill: #fce8e6; stroke: #c5221f; stroke-width: 1.5; }
    .title      { font-size: 15px; font-weight: bold; fill: #222; }
    .label      { font-size: 13px; fill: #222; }
    .small      { font-size: 11px; fill: #555; }
    .arrow      { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrowR     { stroke: #555; stroke-width: 1;   fill: none; marker-end: url(#arrow); stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <text x="400" y="22" text-anchor="middle" class="title">s12: 规范化 JSON 命中即返</text>

  <!-- Client -->
  <rect class="client" x="20" y="80" width="140" height="64"/>
  <text x="90" y="104" text-anchor="middle" class="label">Client</text>
  <text x="90" y="122" text-anchor="middle" class="small">+ Bearer</text>
  <text x="90" y="138" text-anchor="middle" class="small">POST /v1/chat/completions</text>

  <!-- CacheMiddleware (NEW) -->
  <rect class="middleware" x="200" y="60" width="220" height="100"/>
  <text x="310" y="84" text-anchor="middle" class="label">CacheMiddleware (s12 NEW)</text>
  <text x="310" y="102" text-anchor="middle" class="small">key = sha256(</text>
  <text x="310" y="118" text-anchor="middle" class="small">  json.dumps(payload, sort_keys,</text>
  <text x="310" y="134" text-anchor="middle" class="small">  separators=(",", ":")))</text>
  <text x="310" y="150" text-anchor="middle" class="small">stream=true 跳过</text>

  <!-- s11 mount -->
  <rect class="gateway" x="460" y="60" width="160" height="100"/>
  <text x="540" y="84" text-anchor="middle" class="label">s11 mount</text>
  <text x="540" y="102" text-anchor="middle" class="small">LogMiddleware</text>
  <text x="540" y="118" text-anchor="middle" class="small">+ s10 -&gt; s09 -&gt; s08</text>
  <text x="540" y="134" text-anchor="middle" class="small">call_next on miss</text>

  <!-- Upstream -->
  <rect class="upstream" x="660" y="60" width="120" height="100"/>
  <text x="720" y="84" text-anchor="middle" class="label">Upstream</text>
  <text x="720" y="118" text-anchor="middle" class="small">OpenAI / ...</text>
  <text x="720" y="134" text-anchor="middle" class="small">httpx post</text>

  <!-- request flow -->
  <line class="arrow" x1="160" y1="100" x2="198" y2="100"/>
  <text x="179" y="95" text-anchor="middle" class="small">JSON body</text>
  <line class="arrow" x1="420" y1="100" x2="458" y2="100"/>
  <text x="439" y="95" text-anchor="middle" class="small">miss</text>
  <line class="arrow" x1="620" y1="100" x2="658" y2="100"/>
  <text x="639" y="95" text-anchor="middle" class="small">HTTP</text>

  <!-- ============ cache store ============ -->

  <!-- cache dict -->
  <rect class="storage" x="60" y="240" width="220" height="100"/>
  <text x="170" y="264" text-anchor="middle" class="label">cache.py</text>
  <text x="170" y="282" text-anchor="middle" class="small">_store: dict[key, (exp, val)]</text>
  <text x="170" y="298" text-anchor="middle" class="small">get(payload) -&gt; bytes | None</text>
  <text x="170" y="314" text-anchor="middle" class="small">set(payload, body, ttl=300s)</text>
  <text x="170" y="330" text-anchor="middle" class="small">threading.Lock</text>

  <!-- cache stats -->
  <rect class="gateway" x="320" y="240" width="200" height="100"/>
  <text x="420" y="264" text-anchor="middle" class="label">GET /admin/cache/stats</text>
  <text x="420" y="282" text-anchor="middle" class="small">{size: int, live: int}</text>
  <text x="420" y="298" text-anchor="middle" class="small">总条目数 / 未过期条目数</text>

  <!-- HIT path (short-circuit back to client) -->
  <!-- cache -> middleware (hit) -->
  <line class="arrow" x1="170" y1="238" x2="240" y2="160"/>
  <text x="160" y="200" text-anchor="middle" class="small" fill="#228b22">hit -&gt; bytes</text>

  <!-- HIT response (skipping upstream) -->
  <line class="arrowR" x1="198" y1="120" x2="162" y2="120"/>
  <line class="arrowR" x1="170" y1="340" x2="170" y2="380"/>
  <line class="arrowR" x1="170" y1="380" x2="90" y2="380"/>
  <line class="arrowR" x1="90" y1="380" x2="90" y2="146" stroke="#228b22"/>
  <text x="160" y="396" text-anchor="middle" class="small" fill="#228b22">cache hit (短路径,不上游)</text>

  <!-- MISS path: response from upstream -> cache.set -->
  <line class="arrowR" x1="658" y1="120" x2="722" y2="120"/>
  <line class="arrowR" x1="722" y1="120" x2="722" y2="200"/>
  <line class="arrowR" x1="722" y1="200" x2="282" y2="280" stroke="#c5221f"/>
  <text x="600" y="195" text-anchor="middle" class="small" fill="#c5221f">200 body 写入 cache</text>

  <!-- Miss path response back to client -->
  <line class="arrowR" x1="458" y1="120" x2="422" y2="120"/>
  <line class="arrowR" x1="310" y1="162" x2="310" y2="200"/>
  <line class="arrowR" x1="310" y1="200" x2="90" y2="200" stroke="#c5221f"/>
  <line class="arrowR" x1="90" y1="200" x2="90" y2="146" stroke="#c5221f"/>
  <text x="200" y="190" text-anchor="middle" class="small" fill="#c5221f">miss → 转发 → cache.set(payload, body)</text>

  <!-- Caption -->
  <text x="400" y="438" text-anchor="middle" class="small">sha256(canonical JSON) 做 key · 命中 -&gt; 直接返 · miss -&gt; 转发 + 写入 cache(300s TTL)</text>
  <text x="400" y="456" text-anchor="middle" class="small">stream=true 跳过缓存 · sort_keys + separators 让 key 与字段顺序无关</text>
</svg>
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" font-family="sans-serif">
  <title>s14: minimal server-rendered admin dashboard</title>

  <defs>
    <style>
      .box { fill: #ffffff; stroke: #333; stroke-width: 1.5; }
      .accent { fill: #fdf6e3; stroke: #cb4b16; stroke-width: 1.5; }
      .cookie { fill: #eee8d5; stroke: #cb4b16; stroke-width: 1.5; }
      .mounted { fill: #f6f6f6; stroke: #999; stroke-width: 1; stroke-dasharray: 4 3; }
      .label { font-size: 14px; fill: #222; }
      .sub { font-size: 11px; fill: #666; }
      .arrow { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#a); }
      .redir { stroke: #268bd2; stroke-width: 2; fill: none; marker-end: url(#ar); }
      .auth { stroke: #2a9d4a; stroke-width: 2; fill: none; marker-end: url(#ao); }
      .deny { stroke: #d33682; stroke-width: 2; fill: none; marker-end: url(#ad); }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#268bd2"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a9d4a"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d33682"/>
    </marker>
  </defs>

  <text x="400" y="28" text-anchor="middle" font-size="18" font-weight="bold">s14: server-rendered admin dashboard</text>

  <!-- Browser -->
  <rect class="box" x="40" y="70" width="100" height="40" rx="4"/>
  <text class="label" x="90" y="95" text-anchor="middle">Browser</text>

  <!-- s14 app boundary -->
  <rect class="box" x="180" y="60" width="580" height="420" rx="6" stroke-dasharray="4 3"/>
  <text class="label" x="200" y="80">s14_admin_dashboard (app)</text>

  <!-- Login form (GET) -->
  <rect class="accent" x="200" y="100" width="240" height="60" rx="4"/>
  <text class="label" x="320" y="122" text-anchor="middle">GET /dashboard/login</text>
  <text class="sub" x="320" y="142" text-anchor="middle">login_form() returns HTML form</text>

  <!-- Login submit (POST) -->
  <rect class="accent" x="200" y="180" width="240" height="70" rx="4"/>
  <text class="label" x="320" y="205" text-anchor="middle">POST /dashboard/login</text>
  <text class="sub" x="320" y="225" text-anchor="middle">login_post(email, password)</text>
  <text class="sub" x="320" y="240" text-anchor="middle">sets cookie "admin=1" on success</text>

  <!-- Dashboard GET -->
  <rect class="accent" x="200" y="270" width="240" height="70" rx="4"/>
  <text class="label" x="320" y="295" text-anchor="middle">GET /dashboard/</text>
  <text class="sub" x="320" y="315" text-anchor="middle">_require_admin + TemplateResponse</text>
  <text class="sub" x="320" y="330" text-anchor="middle">renders dashboard.html with stats</text>

  <!-- Cookie -->
  <rect class="cookie" x="480" y="200" width="260" height="40" rx="4"/>
  <text class="label" x="610" y="225" text-anchor="middle">Session cookie: admin=1 (httponly)</text>

  <!-- s13 mount (last) -->
  <rect class="mounted" x="480" y="290" width="260" height="50" rx="4"/>
  <text class="label" x="610" y="312" text-anchor="middle">app.mount("/", s13_app)</text>
  <text class="sub" x="610" y="328" text-anchor="middle">local routes shadow mount</text>

  <!-- Live data sources -->
  <rect class="box" x="200" y="380" width="110" height="50" rx="4"/>
  <text class="label" x="255" y="402" text-anchor="middle">s10 channels</text>
  <text class="sub" x="255" y="420" text-anchor="middle">list_channels()</text>

  <rect class="box" x="330" y="380" width="110" height="50" rx="4"/>
  <text class="label" x="385" y="402" text-anchor="middle">s11 log_store</text>
  <text class="sub" x="385" y="420" text-anchor="middle">list_logs()</text>

  <rect class="box" x="460" y="380" width="110" height="50" rx="4"/>
  <text class="label" x="515" y="402" text-anchor="middle">s09 users</text>
  <text class="sub" x="515" y="420" text-anchor="middle">stub: 0 (no list_all)</text>

  <!-- Arrows -->
  <line class="arrow" x1="140" y1="90" x2="200" y2="130"/>
  <line class="redir" x1="320" y1="160" x2="320" y2="180"/>
  <text class="sub" x="325" y="175">POST form</text>
  <line class="redir" x1="440" y1="215" x2="480" y2="220"/>
  <text class="sub" x="445" y="210">Set-Cookie</text>
  <line class="redir" x1="320" y1="250" x2="320" y2="270"/>
  <text class="sub" x="325" y="265">302 -> /dashboard/</text>
  <line class="auth" x1="140" y1="105" x2="200" y2="305"/>
  <text class="sub" x="155" y="240">+ cookie</text>
  <line class="deny" x1="140" y1="95" x2="200" y2="295"/>
  <text class="sub" x="155" y="200">no cookie</text>
  <line class="arrow" x1="320" y1="340" x2="255" y2="380"/>
  <line class="arrow" x1="320" y1="340" x2="385" y2="380"/>
  <line class="arrow" x1="320" y1="340" x2="515" y2="380"/>
</svg>

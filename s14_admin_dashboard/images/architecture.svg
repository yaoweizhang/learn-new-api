<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" font-family="monospace">
  <style>
    .client     { fill: #fafafa; stroke: #333;    stroke-width: 1.5; }
    .gateway    { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2;   }
    .middleware { fill: #fff5d6; stroke: #b58900; stroke-width: 1.5; }
    .storage    { fill: #e6f4ea; stroke: #228b22; stroke-width: 1.5; }
    .upstream   { fill: #fce8e6; stroke: #c5221f; stroke-width: 1.5; }
    .title      { font-size: 15px; font-weight: bold; fill: #222; }
    .label      { font-size: 13px; fill: #222; }
    .small      { font-size: 11px; fill: #555; }
    .arrow      { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrowR     { stroke: #555; stroke-width: 1;   fill: none; marker-end: url(#arrow); stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <text x="460" y="22" text-anchor="middle" class="title">s14: 浏览器一开就看见</text>

  <!-- Browser -->
  <rect class="client" x="20" y="80" width="140" height="64"/>
  <text x="90" y="104" text-anchor="middle" class="label">Browser</text>
  <text x="90" y="122" text-anchor="middle" class="small">GET /dashboard/login</text>
  <text x="90" y="138" text-anchor="middle" class="small">POST 凭证 / GET 看板</text>

  <!-- login form (GET) -->
  <rect class="gateway" x="200" y="60" width="180" height="56"/>
  <text x="290" y="84" text-anchor="middle" class="label">GET /dashboard/login</text>
  <text x="290" y="100" text-anchor="middle" class="small">Jinja2 HTML form</text>

  <!-- login submit (POST) -->
  <rect class="gateway" x="200" y="136" width="180" height="64"/>
  <text x="290" y="160" text-anchor="middle" class="label">POST /dashboard/login</text>
  <text x="290" y="178" text-anchor="middle" class="small">校验 ADMIN_EMAIL/PASSWORD</text>
  <text x="290" y="194" text-anchor="middle" class="small">302 + Set-Cookie admin=1</text>

  <!-- Cookie session -->
  <rect class="middleware" x="420" y="136" width="160" height="64"/>
  <text x="500" y="160" text-anchor="middle" class="label">Cookie session</text>
  <text x="500" y="178" text-anchor="middle" class="small">admin=1 (httponly)</text>
  <text x="500" y="194" text-anchor="middle" class="small">明文 · 教学版 YAGNI</text>

  <!-- /dashboard/ (GET) -->
  <rect class="gateway" x="200" y="220" width="180" height="64"/>
  <text x="290" y="244" text-anchor="middle" class="label">GET /dashboard/</text>
  <text x="290" y="262" text-anchor="middle" class="small">_require_admin 检查 Cookie</text>
  <text x="290" y="278" text-anchor="middle" class="small">TemplateResponse(dashboard.html)</text>

  <!-- Rendered dashboard (HTML) -->
  <rect class="middleware" x="420" y="220" width="220" height="64"/>
  <text x="530" y="244" text-anchor="middle" class="label">dashboard.html (Jinja2)</text>
  <text x="530" y="262" text-anchor="middle" class="small">Users: 0 · Channels: N · Logs: M</text>
  <text x="530" y="278" text-anchor="middle" class="small">服务端渲染 HTML · 浏览器直出</text>

  <!-- arrows: browser -> login form -->
  <line class="arrow" x1="160" y1="100" x2="198" y2="88"/>
  <text x="180" y="84" text-anchor="middle" class="small">GET</text>

  <!-- login form -> login submit -->
  <line class="arrow" x1="290" y1="116" x2="290" y2="134"/>
  <text x="300" y="128" text-anchor="middle" class="small">submit</text>

  <!-- login submit -> Cookie -->
  <line class="arrow" x1="380" y1="160" x2="418" y2="160"/>
  <text x="400" y="155" text-anchor="middle" class="small">Set-Cookie</text>

  <!-- login submit 302 back to browser (cookie set, redirect) -->
  <line class="arrowR" x1="200" y1="156" x2="162" y2="156"/>
  <line class="arrowR" x1="162" y1="156" x2="162" y2="120"/>
  <text x="100" y="148" text-anchor="middle" class="small">302 -&gt; /dashboard/</text>

  <!-- browser -> /dashboard/ with cookie -->
  <line class="arrow" x1="160" y1="120" x2="198" y2="240"/>
  <text x="100" y="200" text-anchor="middle" class="small">Cookie admin=1</text>

  <!-- /dashboard/ -> rendered dashboard -->
  <line class="arrow" x1="380" y1="240" x2="418" y2="240"/>
  <text x="400" y="235" text-anchor="middle" class="small">render</text>

  <!-- No cookie: 401 back to browser -->
  <line class="arrowR" x1="198" y1="252" x2="162" y2="252" stroke="#c5221f"/>
  <text x="100" y="248" text-anchor="middle" class="small" fill="#c5221f">no cookie -&gt; 401</text>

  <!-- ============ Data sources ============ -->

  <!-- s10 channels -->
  <rect class="storage" x="680" y="60" width="220" height="64"/>
  <text x="790" y="84" text-anchor="middle" class="label">s10 channels</text>
  <text x="790" y="102" text-anchor="middle" class="small">list_channels() -&gt; Channels: N</text>
  <text x="790" y="118" text-anchor="middle" class="small">内存 dict + Lock</text>

  <!-- s11 log_store -->
  <rect class="storage" x="680" y="144" width="220" height="64"/>
  <text x="790" y="168" text-anchor="middle" class="label">s11 log_store</text>
  <text x="790" y="186" text-anchor="middle" class="small">list_logs() -&gt; Logs: M</text>
  <text x="790" y="202" text-anchor="middle" class="small">异步 flush 后的 list</text>

  <!-- s09 users -->
  <rect class="storage" x="680" y="228" width="220" height="56"/>
  <text x="790" y="252" text-anchor="middle" class="label">s09 users</text>
  <text x="790" y="268" text-anchor="middle" class="small">stub: 0 · 没 list_all()</text>

  <!-- arrows: dashboard reads from data sources -->
  <line class="arrow" x1="530" y1="220" x2="678" y2="92"/>
  <text x="600" y="148" text-anchor="middle" class="small" fill="#228b22">直接 import 读内存单例</text>
  <line class="arrow" x1="530" y1="240" x2="678" y2="176"/>
  <line class="arrow" x1="530" y1="260" x2="678" y2="256"/>

  <!-- s13 mount -->
  <rect class="gateway" x="200" y="320" width="500" height="50"/>
  <text x="450" y="342" text-anchor="middle" class="label">app.mount("/", s13_app)</text>
  <text x="450" y="360" text-anchor="middle" class="small">/v1/chat/completions 仍可达 · /dashboard/* 本地路由挡挂载</text>

  <!-- 浏览器看回 200 HTML -->
  <line class="arrowR" x1="418" y1="262" x2="380" y2="262" stroke="#228b22"/>
  <line class="arrowR" x1="198" y1="262" x2="162" y2="262" stroke="#228b22"/>
  <line class="arrowR" x1="162" y1="262" x2="162" y2="146" stroke="#228b22"/>
  <text x="240" y="258" text-anchor="middle" class="small" fill="#228b22">200 + HTML</text>

  <!-- Caption -->
  <text x="460" y="438" text-anchor="middle" class="small">Browser -&gt; GET / (Jinja2 模板) · 服务端渲染 · Cookie 会话 · 读 s10/s11 数据</text>
  <text x="460" y="456" text-anchor="middle" class="small">模板每次现算 stats:{users=0, channels=N, logs=M} · 明文 Cookie 仅供本地</text>
</svg>
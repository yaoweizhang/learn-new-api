<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="monospace">
  <style>
    .client     { fill: #fafafa; stroke: #333;    stroke-width: 1.5; }
    .gateway    { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2;   }
    .middleware { fill: #fff5d6; stroke: #b58900; stroke-width: 1.5; }
    .storage    { fill: #e6f4ea; stroke: #228b22; stroke-width: 1.5; }
    .upstream   { fill: #fce8e6; stroke: #c5221f; stroke-width: 1.5; }
    .reference  { fill: #f5f5f5; stroke: #888;    stroke-width: 1; stroke-dasharray: 4 3; }
    .title      { font-size: 14px; font-weight: bold; fill: #222; }
    .label      { font-size: 13px; fill: #222; }
    .small      { font-size: 11px; fill: #555; }
    .refsmall   { font-size: 11px; fill: #777; }
    .arrow      { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrowR     { stroke: #555; stroke-width: 1;   fill: none; marker-end: url(#arrow); stroke-dasharray: 4 3; }
    .arrowRef   { stroke: #888; stroke-width: 1;   fill: none; marker-end: url(#arrowRef); stroke-dasharray: 3 2; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrowRef" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <text x="360" y="22" text-anchor="middle" class="title">s14: Cookie + Jinja2</text>

  <rect class="reference" x="20" y="50" width="260" height="64"/>
  <text x="150" y="76" text-anchor="middle" class="small" fill="#555">s10 + s11 + s09 (前置)</text>
  <text x="150" y="100" text-anchor="middle" class="refsmall">channels · logs · users</text>

  <rect class="client" x="20" y="150" width="120" height="60"/>
  <text x="80" y="178" text-anchor="middle" class="label">Browser</text>
  <text x="80" y="196" text-anchor="middle" class="small">运营用的界面</text>

  <rect class="gateway" x="160" y="150" width="160" height="60"/>
  <text x="240" y="178" text-anchor="middle" class="label">/login GET</text>
  <text x="240" y="196" text-anchor="middle" class="small">Jinja2 form</text>

  <rect class="gateway" x="160" y="230" width="160" height="60"/>
  <text x="240" y="258" text-anchor="middle" class="label">/login POST</text>
  <text x="240" y="276" text-anchor="middle" class="small">校验 + 302</text>

  <rect class="middleware" x="340" y="230" width="160" height="60"/>
  <text x="420" y="258" text-anchor="middle" class="label">admin Cookie</text>
  <text x="420" y="276" text-anchor="middle" class="small">httponly 明文</text>

  <rect class="gateway" x="340" y="150" width="160" height="60"/>
  <text x="420" y="178" text-anchor="middle" class="label">/dashboard/ GET</text>
  <text x="420" y="196" text-anchor="middle" class="small">验 Cookie + render</text>

  <rect class="middleware" x="520" y="150" width="180" height="60"/>
  <text x="610" y="178" text-anchor="middle" class="label">dashboard.html</text>
  <text x="610" y="196" text-anchor="middle" class="small">3 个数字直出</text>

  <line class="arrow" x1="140" y1="180" x2="158" y2="180"/>
  <text x="149" y="175" text-anchor="middle" class="small">GET</text>

  <line class="arrow" x1="240" y1="210" x2="240" y2="228"/>

  <line class="arrow" x1="320" y1="260" x2="338" y2="260"/>
  <text x="329" y="255" text-anchor="middle" class="small">Set</text>

  <line class="arrow" x1="500" y1="180" x2="518" y2="180"/>
  <text x="509" y="175" text-anchor="middle" class="small">页</text>

  <polyline class="arrowR" points="500,200 510,200 510,290 420,290" stroke="#228b22"/>
  <text x="455" y="285" text-anchor="middle" class="small" fill="#228b22">登录回到</text>

  <line class="arrowRef" x1="280" y1="116" x2="280" y2="148"/>
  <text x="286" y="138" text-anchor="start" class="refsmall">接力</text>
</svg>

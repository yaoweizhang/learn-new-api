<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="monospace">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a7"/>
    </marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a6a"/>
    </marker>
  </defs>

  <!-- Client -->
  <rect x="10" y="120" width="80" height="50" fill="#eee" stroke="#333"/>
  <text x="50" y="145" text-anchor="middle">Client</text>
  <text x="50" y="160" text-anchor="middle" font-size="9">+ Bearer</text>

  <!-- Auth (s05) -->
  <rect x="120" y="80" width="120" height="130" fill="#cfc" stroke="#333"/>
  <text x="180" y="100" text-anchor="middle" font-size="12">s05 auth</text>
  <text x="180" y="120" text-anchor="middle" font-size="9">require_api_key</text>
  <text x="180" y="135" text-anchor="middle" font-size="9">is_blocked?</text>
  <text x="180" y="150" text-anchor="middle" font-size="9">lookup_key</text>
  <text x="180" y="170" text-anchor="middle" font-size="9">-&gt; Principal</text>
  <text x="180" y="195" text-anchor="middle" font-size="9" fill="#2a7">200 / 401</text>

  <!-- Token counter (NEW) -->
  <rect x="270" y="20" width="180" height="110" fill="#fdf" stroke="#a6a" stroke-width="2"/>
  <text x="360" y="40" text-anchor="middle" font-size="13" fill="#a6a">s06 count_prompt</text>
  <text x="360" y="60" text-anchor="middle" font-size="10">count_openai (tiktoken)</text>
  <text x="360" y="78" text-anchor="middle" font-size="10">count_estimate (char/4)</text>
  <text x="360" y="98" text-anchor="middle" font-size="10">dispatch by model prefix</text>
  <text x="360" y="118" text-anchor="middle" font-size="10" fill="#a6a">-&gt; prompt_tokens</text>

  <!-- Provider dispatch (s04) -->
  <rect x="270" y="160" width="180" height="110" fill="#fed" stroke="#333"/>
  <text x="360" y="180" text-anchor="middle" font-size="12">s04 dispatch</text>
  <text x="360" y="200" text-anchor="middle" font-size="10">pick_provider(model)</text>
  <text x="360" y="218" text-anchor="middle" font-size="10">to_upstream / from_upstream</text>
  <text x="360" y="238" text-anchor="middle" font-size="10">httpx.AsyncClient.post</text>
  <text x="360" y="258" text-anchor="middle" font-size="10">usage merge</text>

  <!-- Upstream -->
  <rect x="490" y="120" width="80" height="50" fill="#eee" stroke="#333"/>
  <text x="530" y="145" text-anchor="middle">Upstream</text>
  <text x="530" y="160" text-anchor="middle" font-size="9">(OpenAI/Claude/Gemini)</text>

  <!-- Return with usage -->
  <rect x="610" y="120" width="140" height="50" fill="#efe" stroke="#2a7" stroke-width="2"/>
  <text x="680" y="142" text-anchor="middle">Response</text>
  <text x="680" y="158" text-anchor="middle" font-size="9" fill="#2a7">usage.prompt_tokens</text>

  <!-- Client -> Auth -->
  <line x1="90" y1="145" x2="120" y2="145" stroke="#333" marker-end="url(#a)"/>
  <text x="105" y="138" text-anchor="middle" font-size="9">POST</text>

  <!-- Auth -> Token counter (allowed) -->
  <line x1="240" y1="125" x2="270" y2="75" stroke="#a6a" marker-end="url(#p)" stroke-width="1.5"/>
  <text x="248" y="100" text-anchor="middle" font-size="9" fill="#a6a">Principal</text>

  <!-- Auth -> Provider dispatch (reject) -->
  <line x1="240" y1="165" x2="270" y2="195" stroke="#a33" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="248" y="190" text-anchor="middle" font-size="9" fill="#a33">401</text>

  <!-- Token counter -> Provider dispatch -->
  <line x1="360" y1="130" x2="360" y2="160" stroke="#a6a" marker-end="url(#p)" stroke-width="1.5"/>
  <text x="370" y="148" font-size="9" fill="#a6a">prompt_tokens</text>

  <!-- Provider dispatch -> Upstream -->
  <line x1="450" y1="200" x2="490" y2="145" stroke="#333" marker-end="url(#a)"/>
  <text x="465" y="170" text-anchor="middle" font-size="9">HTTP</text>

  <!-- Upstream -> Response with usage -->
  <line x1="570" y1="145" x2="610" y2="145" stroke="#2a7" marker-end="url(#g)" stroke-width="1.5"/>
  <text x="590" y="138" text-anchor="middle" font-size="9" fill="#2a7">usage</text>

  <!-- Response -> Client -->
  <line x1="610" y1="160" x2="90" y2="160" stroke="#333" stroke-dasharray="3 3"/>
  <text x="350" y="295" text-anchor="middle" font-size="9" fill="#666">JSON 200 with usage.prompt_tokens populated</text>
</svg>
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="monospace">
  <style>
    .client     { fill: #fafafa; stroke: #333;    stroke-width: 1.5; }
    .gateway    { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2;   }
    .middleware { fill: #fff5d6; stroke: #b58900; stroke-width: 1.5; }
    .upstream   { fill: #fce8e6; stroke: #c5221f; stroke-width: 1.5; }
    .reference  { fill: #f5f5f5; stroke: #888;    stroke-width: 1; stroke-dasharray: 4 3; }
    .title      { font-size: 15px; font-weight: bold; fill: #222; }
    .label      { font-size: 13px; fill: #222; }
    .small      { font-size: 11px; fill: #555; }
    .refsmall   { font-size: 11px; fill: #777; }
    .arrow      { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrowR     { stroke: #555; stroke-width: 1;   fill: none; marker-end: url(#arrow); stroke-dasharray: 4 3; }
    .arrowRef   { stroke: #888; stroke-width: 1;   fill: none; marker-end: url(#arrowRef); stroke-dasharray: 3 2; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrowRef" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <text x="360" y="22" text-anchor="middle" class="title">s06: 数清每个请求的 token,才知道这一单该收多少钱</text>

  <!-- ============ TOP-LEFT: s05 chat 路径 参考框 (上一章, 本章不动) ============ -->

  <rect class="reference" x="20" y="52" width="200" height="120"/>
  <text x="120" y="74" text-anchor="middle" class="small" fill="#555">s05 chat 路径 (复习)</text>
  <text x="120" y="94" text-anchor="middle" class="refsmall">Chat Client → Bearer sk-...</text>
  <text x="120" y="112" text-anchor="middle" class="refsmall">→ require_api_key 闸门</text>
  <text x="120" y="130" text-anchor="middle" class="refsmall">→ Principal (user_id + scopes)</text>
  <text x="120" y="148" text-anchor="middle" class="refsmall">缺 / 错 / 黑 → 401</text>
  <text x="120" y="166" text-anchor="middle" class="refsmall">本章不重写, 直接接力</text>

  <!-- ============ MAIN FLOW (本章主路径) ============ -->

  <!-- Client -->
  <rect class="client" x="20" y="200" width="120" height="80"/>
  <text x="80" y="226" text-anchor="middle" class="label">Chat Client</text>
  <text x="80" y="244" text-anchor="middle" class="small">POST /v1/chat/completions</text>
  <text x="80" y="262" text-anchor="middle" class="small">model + messages: [...]</text>

  <!-- s05 auth -->
  <rect class="middleware" x="160" y="200" width="120" height="80"/>
  <text x="220" y="226" text-anchor="middle" class="label">s05 auth (复习)</text>
  <text x="220" y="244" text-anchor="middle" class="small">require_api_key</text>
  <text x="220" y="262" text-anchor="middle" class="small">→ Principal</text>

  <!-- count_prompt (NEW — tokenizer) -->
  <rect class="middleware" x="300" y="200" width="140" height="80"/>
  <text x="370" y="226" text-anchor="middle" class="label">count_prompt (本章)</text>
  <text x="370" y="244" text-anchor="middle" class="small">gpt-* / o* → tiktoken</text>
  <text x="370" y="262" text-anchor="middle" class="small">else → char/4 兜底</text>

  <!-- Relay handler: chat_completions -->
  <rect class="gateway" x="460" y="200" width="140" height="80"/>
  <text x="530" y="226" text-anchor="middle" class="label">/v1/chat/completions</text>
  <text x="530" y="244" text-anchor="middle" class="small">pick_provider + httpx post</text>
  <text x="530" y="262" text-anchor="middle" class="small">merge usage → client</text>

  <!-- Upstream -->
  <rect class="upstream" x="620" y="200" width="80" height="80"/>
  <text x="660" y="226" text-anchor="middle" class="label">Upstream</text>
  <text x="660" y="244" text-anchor="middle" class="small">回包带</text>
  <text x="660" y="262" text-anchor="middle" class="small">usage</text>

  <!-- Chain arrows (left to right): client -> auth -> count -> handler -> upstream -->
  <line class="arrow" x1="140" y1="230" x2="158" y2="230"/>
  <line class="arrow" x1="280" y1="230" x2="298" y2="230"/>
  <line class="arrow" x1="440" y1="230" x2="458" y2="230"/>
  <line class="arrow" x1="600" y1="230" x2="618" y2="230"/>

  <!-- Arrow label on auth -> count: encode + count -->
  <text x="289" y="225" text-anchor="middle" class="small">encode + count</text>

  <!-- Arrow label on count -> handler: prompt_tokens -->
  <text x="449" y="225" text-anchor="middle" class="small">tokens 输入 N</text>

  <!-- Arrow label on handler -> upstream: ask -->
  <text x="609" y="225" text-anchor="middle" class="small">ask</text>

  <!-- Upstream -> handler response (dashed): reply with usage -->
  <line class="arrowR" x1="618" y1="252" x2="602" y2="252"/>
  <text x="610" y="247" text-anchor="middle" class="small">回包</text>

  <!-- Handler -> client (dashed): usage populated -->
  <line class="arrowR" x1="460" y1="252" x2="142" y2="252"/>
  <text x="301" y="247" text-anchor="middle" class="small">响应 usage = prompt N + completion M</text>

  <!-- Below gateway: estimate hint (本章做了啥 = 给后续章节的接口) -->
  <rect class="middleware" x="300" y="310" width="300" height="68"/>
  <text x="450" y="332" text-anchor="middle" class="label">估出来给后续章节用</text>
  <text x="450" y="350" text-anchor="middle" class="small">s07: estimate = (pt + 256) × RATE → 预扣</text>
  <text x="450" y="366" text-anchor="middle" class="small">s07 结算: actual = (pt + ct) × RATE → 退/补差额</text>

  <!-- Arrow from count_prompt down to "估出来给后续章节用" -->
  <line class="arrow" x1="370" y1="282" x2="370" y2="308"/>
  <text x="376" y="300" text-anchor="start" class="small">≈ 计价</text>

  <!-- s05 参考框 → s06 主路径 的"接力"虚线 -->
  <line class="arrowRef" x1="220" y1="174" x2="220" y2="198"/>
  <text x="226" y="190" text-anchor="start" class="refsmall">接力</text>

  <!-- Caption: WHY → 本章做了啥 → 后续接力 -->
  <text x="360" y="402" text-anchor="middle" class="small">没有 s06: 网关拿到上游 `usage` 才知道花了多少, 闸门/账单都没法在请求飞行前做决策</text>
  <text x="360" y="420" text-anchor="middle" class="small">本章做了啥: count_prompt 按模型分派 (OpenAI → tiktoken, 其它 → char/4), merge 上游 usage 时 prompt_tokens 取 max(上游, 本地) 兜底</text>
  <text x="360" y="438" text-anchor="middle" class="small">后续接力: s07 用这俩数字预扣 + 结算, s08 在闸门后按 Principal 限速 (本章只数不算, 不预扣不限速)</text>
</svg>
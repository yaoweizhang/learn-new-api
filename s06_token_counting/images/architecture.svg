<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="monospace">
  <style>
    .client     { fill: #fafafa; stroke: #333;    stroke-width: 1.5; }
    .gateway    { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2;   }
    .middleware { fill: #fff5d6; stroke: #b58900; stroke-width: 1.5; }
    .upstream   { fill: #fce8e6; stroke: #c5221f; stroke-width: 1.5; }
    .title      { font-size: 14px; font-weight: bold; fill: #222; }
    .label      { font-size: 13px; fill: #222; }
    .small      { font-size: 11px; fill: #555; }
    .arrow      { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrowR     { stroke: #555; stroke-width: 1;   fill: none; marker-end: url(#arrow); stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <text x="360" y="22" text-anchor="middle" class="title">s06: 转发前数清 prompt token</text>

  <rect class="client" x="40" y="80" width="140" height="80"/>
  <text x="110" y="105" text-anchor="middle" class="label">Client</text>
  <text x="110" y="125" text-anchor="middle" class="small">带 prompt</text>

  <rect class="middleware" x="220" y="72" width="200" height="96"/>
  <text x="320" y="97" text-anchor="middle" class="label">tokenizer</text>
  <text x="320" y="117" text-anchor="middle" class="small">gpt/o → tiktoken · 其它 char/4</text>

  <rect class="gateway" x="460" y="72" width="180" height="96"/>
  <text x="550" y="97" text-anchor="middle" class="label">/v1/chat/completions</text>
  <text x="550" y="117" text-anchor="middle" class="small">合并 upstream usage</text>

  <rect class="upstream" x="680" y="80" width="40" height="80"/>
  <text x="700" y="125" text-anchor="middle" class="small">Up</text>

  <line class="arrow" x1="180" y1="116" x2="218" y2="116"/>
  <text x="199" y="111" text-anchor="middle" class="small">求</text>

  <line class="arrow" x1="420" y1="116" x2="458" y2="116"/>
  <text x="439" y="111" text-anchor="middle" class="small">数 N</text>

  <line class="arrow" x1="640" y1="116" x2="678" y2="116"/>
  <text x="659" y="111" text-anchor="middle" class="small">转</text>

  <line class="arrowR" x1="678" y1="146" x2="642" y2="146"/>
  <line class="arrowR" x1="458" y1="146" x2="222" y2="146"/>
  <line class="arrowR" x1="218" y1="146" x2="182" y2="146"/>
  <text x="320" y="141" text-anchor="middle" class="small">返 usage</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="monospace">
  <style>
    .client     { fill: #fafafa; stroke: #333;    stroke-width: 1.5; }
    .gateway    { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2;   }
    .middleware { fill: #fff5d6; stroke: #b58900; stroke-width: 1.5; }
    .storage    { fill: #e6f4ea; stroke: #228b22; stroke-width: 1.5; }
    .upstream   { fill: #fce8e6; stroke: #c5221f; stroke-width: 1.5; }
    .reference  { fill: #f5f5f5; stroke: #888;    stroke-width: 1; stroke-dasharray: 4 3; }
    .title      { font-size: 14px; font-weight: bold; fill: #222; }
    .label      { font-size: 13px; fill: #222; }
    .small      { font-size: 11px; fill: #555; }
    .refsmall   { font-size: 11px; fill: #777; }
    .arrow      { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrowR     { stroke: #555; stroke-width: 1;   fill: none; marker-end: url(#arrow); stroke-dasharray: 4 3; }
    .arrowRef   { stroke: #888; stroke-width: 1;   fill: none; marker-end: url(#arrowRef); stroke-dasharray: 3 2; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrowRef" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <text x="360" y="22" text-anchor="middle" class="title">s06: 数清每个请求的 token,才知道这一单该收多少钱</text>

  <!-- ============ TOP-LEFT: s05 chat 路径 参考框 (上章, 本章接力) ============ -->

  <rect class="reference" x="20" y="50" width="210" height="80"/>
  <text x="125" y="78" text-anchor="middle" class="small" fill="#555">s05 chat 路径 (复习)</text>
  <text x="125" y="100" text-anchor="middle" class="refsmall">Bearer + require_api_key → Principal</text>
  <text x="125" y="118" text-anchor="middle" class="refsmall">本章接力, 不重写</text>

  <!-- ============ MAIN FLOW (本章主路径) ============ -->

  <!-- Client -->
  <rect class="client" x="20" y="160" width="120" height="64"/>
  <text x="80" y="186" text-anchor="middle" class="label">Client</text>
  <text x="80" y="206" text-anchor="middle" class="small">带 prompt · POST</text>

  <!-- count_prompt (NEW — tokenizer) -->
  <rect class="middleware" x="170" y="160" width="170" height="64"/>
  <text x="255" y="186" text-anchor="middle" class="label">tokenizer.count_prompt</text>
  <text x="255" y="206" text-anchor="middle" class="small">gpt/o → tiktoken · 其它 → char/4</text>

  <!-- Relay handler: chat_completions -->
  <rect class="gateway" x="370" y="160" width="180" height="64"/>
  <text x="460" y="186" text-anchor="middle" class="label">/v1/chat/completions</text>
  <text x="460" y="206" text-anchor="middle" class="small">pick_provider + 合并 usage</text>

  <!-- Upstream -->
  <rect class="upstream" x="580" y="160" width="120" height="64"/>
  <text x="640" y="186" text-anchor="middle" class="label">Upstream</text>
  <text x="640" y="206" text-anchor="middle" class="small">回包带 usage</text>

  <!-- Chain arrows (left to right): client -> count -> handler -> upstream -->
  <line class="arrow" x1="140" y1="190" x2="168" y2="190"/>
  <text x="154" y="185" text-anchor="middle" class="small">JSON</text>

  <line class="arrow" x1="340" y1="190" x2="368" y2="190"/>
  <text x="354" y="185" text-anchor="middle" class="small">数 N</text>

  <line class="arrow" x1="550" y1="190" x2="578" y2="190"/>
  <text x="564" y="185" text-anchor="middle" class="small">ask</text>

  <!-- Upstream -> handler response (dashed): reply with usage -->
  <line class="arrowR" x1="578" y1="208" x2="552" y2="208"/>
  <text x="565" y="225" text-anchor="middle" class="small">回包</text>

  <!-- Handler -> client (dashed): usage populated -->
  <line class="arrowR" x1="370" y1="208" x2="142" y2="208"/>
  <text x="256" y="225" text-anchor="middle" class="small">回吐 usage</text>

  <!-- ============ s05 参考框 → s06 主路径 的"接力"虚线 ============ -->

  <line class="arrowRef" x1="220" y1="132" x2="220" y2="158"/>
  <text x="226" y="150" text-anchor="start" class="refsmall">接力</text>

  <!-- ============ BOTTOM HINT: 给后续章节 ============ -->

</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="monospace">
  <style>
    .client     { fill: #fafafa; stroke: #333;    stroke-width: 1.5; }
    .gateway    { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2;   }
    .middleware { fill: #fff5d6; stroke: #b58900; stroke-width: 1.5; }
    .upstream   { fill: #fce8e6; stroke: #c5221f; stroke-width: 1.5; }
    .title      { font-size: 15px; font-weight: bold; fill: #222; }
    .label      { font-size: 13px; fill: #222; }
    .small      { font-size: 11px; fill: #555; }
    .arrow      { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrowR     { stroke: #555; stroke-width: 1;   fill: none; marker-end: url(#arrow); stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <text x="400" y="22" text-anchor="middle" class="title">s06: tiktoken 数明白</text>

  <!-- Client -->
  <rect class="client" x="20" y="120" width="120" height="80"/>
  <text x="80" y="148" text-anchor="middle" class="label">Client</text>
  <text x="80" y="166" text-anchor="middle" class="small">POST /v1/chat/completions</text>
  <text x="80" y="184" text-anchor="middle" class="small">messages: [...]</text>

  <!-- Auth (s05, prerequisite) -->
  <rect class="middleware" x="160" y="120" width="120" height="80"/>
  <text x="220" y="146" text-anchor="middle" class="label">s05 auth</text>
  <text x="220" y="164" text-anchor="middle" class="small">require_api_key</text>
  <text x="220" y="182" text-anchor="middle" class="small">-&gt; Principal</text>

  <!-- Tokenizer (NEW) -->
  <rect class="middleware" x="300" y="120" width="140" height="80"/>
  <text x="370" y="146" text-anchor="middle" class="label">count_prompt</text>
  <text x="370" y="164" text-anchor="middle" class="small">gpt-*/o* -&gt; tiktoken</text>
  <text x="370" y="182" text-anchor="middle" class="small">else -&gt; len/4</text>

  <!-- Provider dispatch (s04) -->
  <rect class="gateway" x="460" y="120" width="140" height="80"/>
  <text x="530" y="146" text-anchor="middle" class="label">Relay</text>
  <text x="530" y="164" text-anchor="middle" class="small">pick_provider</text>
  <text x="530" y="182" text-anchor="middle" class="small">httpx post</text>

  <!-- 3 Upstream boxes (compressed) -->
  <rect class="upstream" x="620" y="40" width="160" height="60"/>
  <text x="700" y="62" text-anchor="middle" class="small">OpenAI (tiktoken pt)</text>
  <text x="700" y="80" text-anchor="middle" class="small">gpt-* / o*</text>

  <rect class="upstream" x="620" y="130" width="160" height="60"/>
  <text x="700" y="152" text-anchor="middle" class="small">Claude (pt est)</text>
  <text x="700" y="170" text-anchor="middle" class="small">claude-*</text>

  <rect class="upstream" x="620" y="220" width="160" height="60"/>
  <text x="700" y="242" text-anchor="middle" class="small">Gemini (pt est)</text>
  <text x="700" y="260" text-anchor="middle" class="small">gemini-*</text>

  <!-- Chain arrows -->
  <line class="arrow" x1="140" y1="150" x2="158" y2="150"/>
  <line class="arrow" x1="280" y1="150" x2="298" y2="150"/>
  <line class="arrow" x1="440" y1="150" x2="458" y2="150"/>

  <!-- Label on tokenizer -> relay -->
  <text x="450" y="145" text-anchor="middle" class="small">prompt_tokens</text>

  <!-- Dispatch arrows to 3 upstreams -->
  <line class="arrow" x1="600" y1="135" x2="618" y2="70"/>
  <text x="609" y="98" text-anchor="middle" class="small">gpt-*</text>

  <line class="arrow" x1="600" y1="160" x2="618" y2="160"/>
  <text x="609" y="155" text-anchor="middle" class="small">claude-*</text>

  <line class="arrow" x1="600" y1="185" x2="618" y2="250"/>
  <text x="609" y="223" text-anchor="middle" class="small">gemini-*</text>

  <!-- Caption -->
  <text x="400" y="304" text-anchor="middle" class="small">tiktoken 估 pt + 估 ct(非 OpenAI 退化 char/4) -&gt; pre-deduct 用这个 · s07 + s08 复用</text>
</svg>
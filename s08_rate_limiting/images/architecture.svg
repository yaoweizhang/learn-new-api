<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" font-family="monospace">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a7"/>
    </marker>
    <marker id="rl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c80"/>
    </marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a6a"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a33"/>
    </marker>
  </defs>

  <!-- Client -->
  <rect x="10" y="170" width="80" height="50" fill="#eee" stroke="#333"/>
  <text x="50" y="195" text-anchor="middle">Client</text>
  <text x="50" y="210" text-anchor="middle" font-size="9">+ Bearer</text>

  <!-- Auth (s05) -->
  <rect x="120" y="110" width="120" height="150" fill="#cfc" stroke="#333"/>
  <text x="180" y="130" text-anchor="middle" font-size="12">s05 auth</text>
  <text x="180" y="150" text-anchor="middle" font-size="9">require_api_key</text>
  <text x="180" y="170" text-anchor="middle" font-size="9">-&gt; Principal</text>
  <text x="180" y="245" text-anchor="middle" font-size="9" fill="#2a7">200 / 401</text>

  <!-- Token bucket (NEW) -->
  <rect x="270" y="20" width="200" height="150" fill="#ffd" stroke="#c80" stroke-width="2"/>
  <text x="370" y="40" text-anchor="middle" font-size="13" fill="#c80">s08 bucket.py</text>
  <text x="370" y="60" text-anchor="middle" font-size="10">_buckets: dict + Lock</text>
  <text x="370" y="78" text-anchor="middle" font-size="10">configure(uid, cap, refill)</text>
  <text x="370" y="96" text-anchor="middle" font-size="10">_refill: tokens += dt * refill</text>
  <text x="370" y="114" text-anchor="middle" font-size="10">take(uid) -&gt; bool (atomic)</text>
  <text x="370" y="132" text-anchor="middle" font-size="10">default: cap=60, refill=1.0/s</text>
  <text x="370" y="155" text-anchor="middle" font-size="10" fill="#c80">thread-safe in-memory</text>

  <!-- Quota store (s07) -->
  <rect x="270" y="200" width="200" height="120" fill="#fdf" stroke="#a6a"/>
  <text x="370" y="220" text-anchor="middle" font-size="12">s07 quota</text>
  <text x="370" y="240" text-anchor="middle" font-size="10">deduct / refund / settle</text>
  <text x="370" y="258" text-anchor="middle" font-size="10">atomic under Lock</text>

  <!-- Provider dispatch + handler -->
  <rect x="500" y="120" width="160" height="200" fill="#fed" stroke="#333"/>
  <text x="580" y="140" text-anchor="middle" font-size="12">handler</text>
  <text x="580" y="160" text-anchor="middle" font-size="10">if !take(uid): 429</text>
  <text x="580" y="178" text-anchor="middle" font-size="10">estimate = (pt + 256)*RATE</text>
  <text x="580" y="196" text-anchor="middle" font-size="10">if !deduct(est): 402</text>
  <text x="580" y="214" text-anchor="middle" font-size="10">pick_provider / upstream</text>
  <text x="580" y="232" text-anchor="middle" font-size="10">on fail: refund(est)</text>
  <text x="580" y="250" text-anchor="middle" font-size="10">on ok: settle(est, actual)</text>
  <text x="580" y="295" text-anchor="middle" font-size="9" fill="#2a7">200 + quota_charged</text>

  <!-- Client -> Auth -->
  <line x1="90" y1="195" x2="120" y2="195" stroke="#333" marker-end="url(#a)"/>
  <text x="105" y="188" text-anchor="middle" font-size="9">POST</text>

  <!-- Auth -> handler (allowed) -->
  <line x1="240" y1="155" x2="500" y2="180" stroke="#c80" marker-end="url(#rl)" stroke-width="1.5"/>
  <text x="370" y="155" text-anchor="middle" font-size="9" fill="#c80">Principal</text>

  <!-- Auth -> handler (reject 401) -->
  <line x1="240" y1="215" x2="500" y2="260" stroke="#a33" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="370" y="240" text-anchor="middle" font-size="9" fill="#a33">401</text>

  <!-- handler -> bucket (take) -->
  <line x1="540" y1="170" x2="470" y2="110" stroke="#c80" marker-end="url(#rl)" stroke-width="1.5"/>
  <text x="490" y="135" font-size="9" fill="#c80">take(uid)</text>

  <!-- bucket -> handler (denied) -->
  <line x1="430" y1="120" x2="500" y2="225" stroke="#a33" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#r)"/>
  <text x="420" y="175" font-size="9" fill="#a33" text-anchor="end">exhausted -&gt; 429</text>

  <!-- handler -> quota (pre-deduct) -->
  <line x1="540" y1="240" x2="470" y2="260" stroke="#a6a" marker-end="url(#p)" stroke-width="1.5"/>
  <text x="510" y="255" font-size="9" fill="#a6a">deduct(est)</text>

  <!-- quota -> handler (insufficient) -->
  <line x1="430" y1="280" x2="500" y2="290" stroke="#a33" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#r)"/>
  <text x="420" y="305" font-size="9" fill="#a33" text-anchor="end">insufficient -&gt; 402</text>

  <!-- handler -> quota (settle) -->
  <line x1="540" y1="270" x2="470" y2="300" stroke="#a6a" stroke-dasharray="4 3" stroke-width="1.5" marker-end="url(#p)"/>
  <text x="520" y="320" font-size="9" fill="#a6a">settle / refund</text>

  <!-- Footer -->
  <text x="390" y="365" text-anchor="middle" font-size="9" fill="#666">auth -&gt; rate-limit (429) -&gt; quota (402) -&gt; upstream -&gt; settle (estimate - actual refunded)</text>
</svg>
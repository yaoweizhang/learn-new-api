<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="monospace">
  <style>
    .client     { fill: #fafafa; stroke: #333;    stroke-width: 1.5; }
    .gateway    { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2;   }
    .middleware { fill: #fff5d6; stroke: #b58900; stroke-width: 1.5; }
    .storage    { fill: #e6f4ea; stroke: #228b22; stroke-width: 1.5; }
    .upstream   { fill: #fce8e6; stroke: #c5221f; stroke-width: 1.5; }
    .title      { font-size: 15px; font-weight: bold; fill: #222; }
    .label      { font-size: 13px; fill: #222; }
    .small      { font-size: 11px; fill: #555; }
    .arrow      { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrowR     { stroke: #555; stroke-width: 1;   fill: none; marker-end: url(#arrow); stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <text x="400" y="22" text-anchor="middle" class="title">s08: 桶里取 token</text>

  <!-- Client -->
  <rect class="client" x="20" y="120" width="120" height="80"/>
  <text x="80" y="148" text-anchor="middle" class="label">Client</text>
  <text x="80" y="166" text-anchor="middle" class="small">+ Bearer</text>
  <text x="80" y="184" text-anchor="middle" class="small">POST /v1/chat/completions</text>

  <!-- Auth (s05) -->
  <rect class="middleware" x="160" y="120" width="100" height="80"/>
  <text x="210" y="146" text-anchor="middle" class="label">s05</text>
  <text x="210" y="164" text-anchor="middle" class="small">require_api_key</text>
  <text x="210" y="182" text-anchor="middle" class="small">-&gt; Principal</text>

  <!-- Token bucket (NEW) -->
  <rect class="middleware" x="280" y="40" width="160" height="100"/>
  <text x="360" y="62" text-anchor="middle" class="label">bucket.py</text>
  <text x="360" y="80" text-anchor="middle" class="small">_buckets: dict + Lock</text>
  <text x="360" y="98" text-anchor="middle" class="small">cap=60, refill=1.0/s</text>
  <text x="360" y="116" text-anchor="middle" class="small">take(uid) -&gt; bool</text>
  <text x="360" y="134" text-anchor="middle" class="small">atomic, in-memory</text>

  <!-- Relay handler -->
  <rect class="gateway" x="280" y="170" width="160" height="80"/>
  <text x="360" y="194" text-anchor="middle" class="label">Relay</text>
  <text x="360" y="212" text-anchor="middle" class="small">if !take(uid): 429</text>
  <text x="360" y="230" text-anchor="middle" class="small">+ Retry-After header</text>

  <!-- Upstream -->
  <rect class="upstream" x="480" y="170" width="160" height="80"/>
  <text x="560" y="198" text-anchor="middle" class="label">Upstream</text>
  <text x="560" y="216" text-anchor="middle" class="small">OpenAI / Claude / Gemini</text>
  <text x="560" y="234" text-anchor="middle" class="small">httpx post</text>

  <!-- Quota (s07, after pass) -->
  <rect class="storage" x="660" y="170" width="120" height="80"/>
  <text x="720" y="194" text-anchor="middle" class="small">s07</text>
  <text x="720" y="212" text-anchor="middle" class="small">deduct /</text>
  <text x="720" y="230" text-anchor="middle" class="small">settle</text>

  <!-- Chain arrows (left to right) -->
  <line class="arrow" x1="140" y1="150" x2="158" y2="150"/>
  <line class="arrow" x1="260" y1="150" x2="278" y2="150"/>
  <text x="269" y="145" text-anchor="middle" class="small">uid</text>

  <!-- Auth -> handler (allowed) -->
  <line class="arrow" x1="260" y1="180" x2="278" y2="195"/>

  <!-- 401 reject (s05) dashed red back -->
  <line class="arrowR" x1="210" y1="200" x2="210" y2="270" stroke="#c5221f"/>
  <line class="arrowR" x1="210" y1="270" x2="80" y2="270" stroke="#c5221f"/>
  <line class="arrowR" x1="80" y1="270" x2="80" y2="202" stroke="#c5221f"/>
  <text x="210" y="262" text-anchor="middle" class="small" fill="#c5221f">401</text>

  <!-- Bucket -> handler (take) -->
  <line class="arrow" x1="360" y1="142" x2="360" y2="168"/>

  <!-- 429 reject path (dashed amber) from handler back to client -->
  <line class="arrowR" x1="280" y1="210" x2="100" y2="80" stroke="#b58900"/>
  <line class="arrowR" x1="100" y1="80" x2="80" y2="118" stroke="#b58900"/>
  <text x="190" y="85" text-anchor="middle" class="small" fill="#b58900">exhausted -&gt; 429 + Retry-After</text>

  <!-- Handler -> Upstream -->
  <line class="arrow" x1="440" y1="200" x2="478" y2="200"/>
  <text x="459" y="195" text-anchor="middle" class="small">HTTP</text>

  <!-- Upstream -> quota (settle) -->
  <line class="arrowR" x1="640" y1="210" x2="658" y2="210"/>

  <!-- Caption -->
  <text x="400" y="304" text-anchor="middle" class="small">60 tokens burst,refill 1/s · 拒第 61 个请求 -&gt; 429 + Retry-After · 同一用户并发原子</text>
</svg>
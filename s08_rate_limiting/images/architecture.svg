<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="monospace">
  <style>
    .client     { fill: #fafafa; stroke: #333;    stroke-width: 1.5; }
    .gateway    { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2;   }
    .middleware { fill: #fff5d6; stroke: #b58900; stroke-width: 1.5; }
    .storage    { fill: #e6f4ea; stroke: #228b22; stroke-width: 1.5; }
    .upstream   { fill: #fce8e6; stroke: #c5221f; stroke-width: 1.5; }
    .reference  { fill: #f5f5f5; stroke: #888;    stroke-width: 1; stroke-dasharray: 4 3; }
    .title      { font-size: 15px; font-weight: bold; fill: #222; }
    .label      { font-size: 13px; fill: #222; }
    .small      { font-size: 11px; fill: #555; }
    .refsmall   { font-size: 11px; fill: #777; }
    .arrow      { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrowR     { stroke: #555; stroke-width: 1;   fill: none; marker-end: url(#arrow); stroke-dasharray: 4 3; }
    .arrowRef   { stroke: #888; stroke-width: 1;   fill: none; marker-end: url(#arrowRef); stroke-dasharray: 3 2; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrowRef" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <text x="360" y="22" text-anchor="middle" class="title">s08: 按用户桶限速,单用户刷不爆上游</text>

  <!-- ============ TOP-LEFT: s05 + s07 参考框 (前置章节, 本章接力) ============ -->

  <rect class="reference" x="20" y="52" width="290" height="120"/>
  <text x="165" y="74" text-anchor="middle" class="small" fill="#555">s05 auth + s07 配额 (前置)</text>
  <text x="165" y="94" text-anchor="middle" class="refsmall">require_api_key → Principal (user_id)</text>
  <text x="165" y="112" text-anchor="middle" class="refsmall">quota.py: estimate / settle / refund</text>
  <text x="165" y="130" text-anchor="middle" class="refsmall">本章不重写, 在它们之间插一条限速带</text>
  <text x="165" y="148" text-anchor="middle" class="refsmall">对比: 不是全局 fixed window</text>
  <text x="165" y="166" text-anchor="middle" class="refsmall">对比: 不是按 (uid, model) 多桶</text>

  <!-- ============ MAIN FLOW (本章主路径) ============ -->

  <!-- Client -->
  <rect class="client" x="20" y="200" width="120" height="80"/>
  <text x="80" y="226" text-anchor="middle" class="label">Chat Client</text>
  <text x="80" y="244" text-anchor="middle" class="small">+ Bearer</text>
  <text x="80" y="262" text-anchor="middle" class="small">POST /v1/chat/completions</text>

  <!-- s05 auth -->
  <rect class="middleware" x="160" y="200" width="120" height="80"/>
  <text x="220" y="226" text-anchor="middle" class="label">s05 auth (复习)</text>
  <text x="220" y="244" text-anchor="middle" class="small">require_api_key</text>
  <text x="220" y="262" text-anchor="middle" class="small">→ Principal</text>

  <!-- Bucket (NEW — per-user, in-memory) -->
  <rect class="storage" x="300" y="200" width="160" height="80"/>
  <text x="380" y="226" text-anchor="middle" class="label">bucket.py (本章 — 内存)</text>
  <text x="380" y="244" text-anchor="middle" class="small">_buckets: dict[uid → (tokens, ts)]</text>
  <text x="380" y="262" text-anchor="middle" class="small">cap=60, refill=1.0/s, take(uid) 原子</text>

  <!-- Relay handler -->
  <rect class="gateway" x="480" y="200" width="140" height="80"/>
  <text x="550" y="226" text-anchor="middle" class="label">/v1/chat/completions</text>
  <text x="550" y="244" text-anchor="middle" class="small">if !take(uid): 429</text>
  <text x="550" y="262" text-anchor="middle" class="small">→ s07 预扣 + 调上游 + 结算</text>

  <!-- Upstream -->
  <rect class="upstream" x="640" y="200" width="60" height="80"/>
  <text x="670" y="226" text-anchor="middle" class="label">上游</text>
  <text x="670" y="244" text-anchor="middle" class="small">被</text>
  <text x="670" y="262" text-anchor="middle" class="small">保护</text>

  <!-- Chain arrows (left to right): client -> auth -> bucket -> handler -> upstream -->
  <line class="arrow" x1="140" y1="240" x2="158" y2="240"/>
  <text x="149" y="235" text-anchor="middle" class="small">Bearer</text>

  <line class="arrow" x1="280" y1="240" x2="298" y2="240"/>
  <text x="289" y="235" text-anchor="middle" class="small">uid</text>

  <!-- auth -> bucket: identify user for per-user bucket -->
  <text x="289" y="222" text-anchor="middle" class="small">按用户取桶</text>

  <!-- bucket -> handler: take result -->
  <line class="arrow" x1="460" y1="240" x2="478" y2="240"/>
  <text x="469" y="235" text-anchor="middle" class="small">拿 1 token</text>

  <!-- handler -> upstream: ask -->
  <line class="arrow" x1="620" y1="240" x2="638" y2="240"/>
  <text x="629" y="235" text-anchor="middle" class="small">ask</text>

  <!-- 429 reject path (dashed amber) from handler back to client — bucket exhausted -->
  <line class="arrowR" x1="480" y1="295" x2="80" y2="295" stroke="#b58900"/>
  <line class="arrowR" x1="80" y1="295" x2="80" y2="282" stroke="#b58900"/>
  <text x="280" y="290" text-anchor="middle" class="small" fill="#b58900">桶空 → 429 (no Retry-After)</text>

  <!-- "sleep refill_interval" indicator — bucket self-refills -->
  <line class="arrowR" x1="300" y1="282" x2="460" y2="282"/>
  <text x="380" y="277" text-anchor="middle" class="small" fill="#228b22">睡 refill_interval (1.0s) → 桶 +1</text>

  <!-- ============ s05 + s07 参考框 → s08 主路径 的"接力"虚线 ============ -->

  <line class="arrowRef" x1="240" y1="174" x2="380" y2="198"/>
  <text x="320" y="190" text-anchor="start" class="refsmall">接力</text>

  <!-- ============ Caption: WHY → 本章做了啥 → 后续接力 ============ -->

  <text x="360" y="362" text-anchor="middle" class="small">没有 s08: 余额充足的用户能 1 秒打 100 次, 把同代理其它租户的延迟都拖下水, s07 防住"算钱"但防不住"打爆"</text>
  <text x="360" y="380" text-anchor="middle" class="small">本章做了啥: bucket.py 给每个 user_id 一份 (tokens, ts), take 整段原子 (refill + 检查 + 扣) 在 threading.Lock 下, 桶空 → 429 不打上游</text>
  <text x="360" y="408" text-anchor="middle" class="small">后续接力: s09 把 _buckets 挪进 Redis 用 INCR + EXPIRE 让多 worker 共享状态, s10 给管理员按 channel 限速, s_full 给 (uid, model) 做细粒度桶</text>
  <text x="360" y="426" text-anchor="middle" class="small">注意 s08 是按用户 (per-user) 不是全局: 桶按 user_id 拆, 一用户打爆不影响其它用户 (对比: 全局 fixed window 会把所有用户绑在一起限速)</text>
  <text x="360" y="444" text-anchor="middle" class="small">桶状态走的是 bucket.py 进程内 dict[uid → (tokens, ts)], 不是 SQLite — 进程一重启桶重置为默认 60, 多 worker 部署下用户实际能拿到 N_workers × capacity 的突发</text>
</svg>
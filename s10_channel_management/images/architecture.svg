<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="monospace">
  <style>
    .client     { fill: #fafafa; stroke: #333;    stroke-width: 1.5; }
    .gateway    { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2;   }
    .middleware { fill: #fff5d6; stroke: #b58900; stroke-width: 1.5; }
    .storage    { fill: #e6f4ea; stroke: #228b22; stroke-width: 1.5; }
    .upstream   { fill: #fce8e6; stroke: #c5221f; stroke-width: 1.5; }
    .reference  { fill: #f5f5f5; stroke: #888;    stroke-width: 1; stroke-dasharray: 4 3; }
    .title      { font-size: 14px; font-weight: bold; fill: #222; }
    .label      { font-size: 13px; fill: #222; }
    .small      { font-size: 11px; fill: #555; }
    .refsmall   { font-size: 11px; fill: #777; }
    .arrow      { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrowR     { stroke: #555; stroke-width: 1;   fill: none; marker-end: url(#arrow); stroke-dasharray: 4 3; }
    .arrowRef   { stroke: #888; stroke-width: 1;   fill: none; marker-end: url(#arrowRef); stroke-dasharray: 3 2; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrowRef" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <text x="360" y="22" text-anchor="middle" class="title">s10: 渠道表 + 按 model+weight 选路, 动态配多账号</text>

  <!-- ============ TOP-LEFT: s09 参考框 (前置, 本章接力) ============ -->

  <rect class="reference" x="20" y="50" width="260" height="80"/>
  <text x="150" y="78" text-anchor="middle" class="small" fill="#555">s09 用户系统 (前置)</text>
  <text x="150" y="100" text-anchor="middle" class="refsmall">JWT + is_admin → 闸门</text>
  <text x="150" y="118" text-anchor="middle" class="refsmall">不重写, 复用挂 /admin/*</text>

  <!-- ============ MAIN FLOW: admin 写渠道表 ============ -->

  <!-- Admin client -->
  <rect class="client" x="20" y="160" width="120" height="64"/>
  <text x="80" y="186" text-anchor="middle" class="label">Admin Client</text>
  <text x="80" y="206" text-anchor="middle" class="small">+ Bearer &lt;admin&gt;</text>

  <!-- _require_admin gate -->
  <rect class="middleware" x="170" y="160" width="120" height="64"/>
  <text x="230" y="186" text-anchor="middle" class="label">_require_admin</text>
  <text x="230" y="206" text-anchor="middle" class="small">is_admin → OK</text>

  <!-- /admin/channels handlers -->
  <rect class="gateway" x="320" y="160" width="160" height="64"/>
  <text x="400" y="186" text-anchor="middle" class="label">/admin/channels</text>
  <text x="400" y="206" text-anchor="middle" class="small">POST + GET · 增 + 列</text>

  <!-- channels pool (memory dict + Lock) -->
  <rect class="storage" x="510" y="160" width="190" height="64"/>
  <text x="605" y="186" text-anchor="middle" class="label">channels pool</text>
  <text x="605" y="206" text-anchor="middle" class="small">c1/c2/c3 · dict + Lock · 即时生效</text>

  <!-- Admin CRUD chain: client -> gate -> handler -> pool -->
  <line class="arrow" x1="140" y1="190" x2="168" y2="190"/>
  <text x="154" y="185" text-anchor="middle" class="small">jwt</text>

  <line class="arrow" x1="290" y1="190" x2="318" y2="190"/>
  <text x="304" y="185" text-anchor="middle" class="small">OK</text>

  <line class="arrow" x1="480" y1="190" x2="508" y2="190"/>
  <text x="494" y="185" text-anchor="middle" class="small">写</text>

  <!-- 201 back to admin (dashed, routed BELOW row to avoid crossing) -->
  <polyline class="arrowR" points="320,224 320,272 80,272 80,224"/>
  <text x="200" y="267" text-anchor="middle" class="small">201 + {id, name}</text>

  <!-- ============ LOWER PATH: pick_channel_for ============ -->

  <!-- pick_channel_for box -->
  <rect class="middleware" x="170" y="290" width="310" height="22"/>
  <text x="325" y="305" text-anchor="middle" class="small">pick_channel_for(model) · 过滤 → 档 → weight</text>

  <!-- arrows: pool -> pick (diagonal across) -->
  <line class="arrow" x1="605" y1="224" x2="325" y2="288"/>
  <text x="465" y="255" text-anchor="middle" class="small">读池</text>

  <!-- ============ s09 参考框 → s10 主路径 的"接力"虚线 ============ -->

  <line class="arrowRef" x1="280" y1="132" x2="280" y2="158"/>
  <text x="286" y="150" text-anchor="start" class="refsmall">接力</text>
</svg>
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" font-family="monospace">
  <style>
    .client     { fill: #fafafa; stroke: #333;    stroke-width: 1.5; }
    .gateway    { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2;   }
    .middleware { fill: #fff5d6; stroke: #b58900; stroke-width: 1.5; }
    .storage    { fill: #e6f4ea; stroke: #228b22; stroke-width: 1.5; }
    .upstream   { fill: #fce8e6; stroke: #c5221f; stroke-width: 1.5; }
    .title      { font-size: 15px; font-weight: bold; fill: #222; }
    .label      { font-size: 13px; fill: #222; }
    .small      { font-size: 11px; fill: #555; }
    .arrow      { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrowR     { stroke: #555; stroke-width: 1;   fill: none; marker-end: url(#arrow); stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <text x="460" y="22" text-anchor="middle" class="title">s10: admin 渠道 CRUD + 选路</text>

  <!-- Admin client -->
  <rect class="client" x="20" y="80" width="140" height="64"/>
  <text x="90" y="104" text-anchor="middle" class="label">Admin</text>
  <text x="90" y="122" text-anchor="middle" class="small">+ Bearer &lt;admin jwt&gt;</text>
  <text x="90" y="138" text-anchor="middle" class="small">POST/GET /admin/channels</text>

  <!-- _require_admin gate -->
  <rect class="middleware" x="200" y="80" width="160" height="64"/>
  <text x="280" y="104" text-anchor="middle" class="label">_require_admin</text>
  <text x="280" y="122" text-anchor="middle" class="small">decode Bearer &lt;jwt&gt;</text>
  <text x="280" y="138" text-anchor="middle" class="small">403 admin only</text>

  <!-- /admin/channels handlers -->
  <rect class="gateway" x="400" y="80" width="200" height="64"/>
  <text x="500" y="104" text-anchor="middle" class="label">/admin/channels</text>
  <text x="500" y="122" text-anchor="middle" class="small">POST create · GET list</text>
  <text x="500" y="138" text-anchor="middle" class="small">dependencies=[Depends(_require_admin)]</text>

  <!-- channels storage (the pool) -->
  <rect class="storage" x="640" y="80" width="240" height="120"/>
  <text x="760" y="104" text-anchor="middle" class="label">channels pool (s10 channels.py)</text>
  <text x="760" y="122" text-anchor="middle" class="small">id:1 openai-primary  weight=100 pri=0  healthy=True</text>
  <text x="760" y="138" text-anchor="middle" class="small">id:2 openai-backup   weight=50  pri=1  healthy=True</text>
  <text x="760" y="154" text-anchor="middle" class="small">id:3 claude          weight=100 pri=0  healthy=False</text>
  <text x="760" y="172" text-anchor="middle" class="small">_channels: dict[int, Channel] + Lock</text>
  <text x="760" y="188" text-anchor="middle" class="small">create / list / get / mark_unhealthy</text>

  <!-- Request flow: admin -> gate -> handlers -> store -->
  <line class="arrow" x1="160" y1="100" x2="198" y2="100"/>
  <text x="179" y="95" text-anchor="middle" class="small">jwt</text>
  <line class="arrow" x1="360" y1="100" x2="398" y2="100"/>
  <text x="379" y="95" text-anchor="middle" class="small">OK</text>
  <line class="arrow" x1="600" y1="100" x2="638" y2="120"/>
  <text x="619" y="95" text-anchor="middle" class="small">create_channel()</text>

  <!-- 201 back to admin -->
  <line class="arrowR" x1="398" y1="120" x2="362" y2="120"/>
  <line class="arrowR" x1="198" y1="120" x2="162" y2="120"/>
  <text x="280" y="135" text-anchor="middle" class="small">201 + {id, name}</text>

  <!-- ============ Lower path: pick_channel_for ============ -->

  <!-- pick_channel_for box -->
  <rect class="middleware" x="200" y="240" width="240" height="84"/>
  <text x="320" y="264" text-anchor="middle" class="label">pick_channel_for(model_name)</text>
  <text x="320" y="282" text-anchor="middle" class="small">1) filter: enabled &amp;&amp; healthy &amp;&amp; provider</text>
  <text x="320" y="298" text-anchor="middle" class="small">2) tier: min priority asc</text>
  <text x="320" y="314" text-anchor="middle" class="small">3) inside tier: random.choices(weights) | round-robin fallback</text>

  <!-- Picked channel returns -->
  <rect class="storage" x="480" y="240" width="180" height="84"/>
  <text x="570" y="264" text-anchor="middle" class="label">selected Channel</text>
  <text x="570" y="282" text-anchor="middle" class="small">e.g. id:1 openai-primary</text>
  <text x="570" y="298" text-anchor="middle" class="small">weight=100 priority=0 healthy=True</text>
  <text x="570" y="314" text-anchor="middle" class="small">mark_unhealthy(cid) 即时生效</text>

  <!-- upstream -->
  <rect class="upstream" x="700" y="240" width="180" height="84"/>
  <text x="790" y="264" text-anchor="middle" class="label">Upstream</text>
  <text x="790" y="282" text-anchor="middle" class="small">OpenAI / Claude / Gemini</text>
  <text x="790" y="298" text-anchor="middle" class="small">POST {base_url}/v1/chat/...</text>
  <text x="790" y="314" text-anchor="middle" class="small">per-channel key from base_url</text>

  <!-- arrows: storage -> pick -> selected -> upstream -->
  <line class="arrow" x1="640" y1="200" x2="320" y2="238"/>
  <text x="430" y="225" text-anchor="middle" class="small">list_channels() 读池</text>
  <line class="arrow" x1="440" y1="280" x2="478" y2="280"/>
  <text x="459" y="275" text-anchor="middle" class="small">Channel</text>
  <line class="arrow" x1="660" y1="280" x2="698" y2="280"/>
  <text x="679" y="275" text-anchor="middle" class="small">HTTP</text>

  <!-- Response back dashed -->
  <line class="arrowR" x1="698" y1="298" x2="662" y2="298"/>
  <line class="arrowR" x1="478" y1="298" x2="442" y2="298"/>
  <line class="arrowR" x1="318" y1="298" x2="162" y2="298"/>
  <text x="240" y="293" text-anchor="middle" class="small">200 + 响应</text>

  <!-- Annotation: mark_unhealthy -->
  <line class="arrowR" x1="478" y1="320" x2="640" y2="195"/>
  <text x="540" y="368" text-anchor="middle" class="small" fill="#b58900">on fail: mark_unhealthy(cid) -&gt; 下次直接 skip</text>

  <!-- Caption -->
  <text x="460" y="438" text-anchor="middle" class="small">admin CRUD 渠道表 · request 时 pick_channel_for 按 priority/weight 选一条 · mark_unhealthy 立即生效</text>
  <text x="460" y="456" text-anchor="middle" class="small">同 weight=0 时回退 round-robin · 池为空或 provider 不匹配 -&gt; None</text>
</svg>
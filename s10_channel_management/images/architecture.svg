<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="monospace">
  <style>
    .client     { fill: #fafafa; stroke: #333;    stroke-width: 1.5; }
    .gateway    { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2;   }
    .middleware { fill: #fff5d6; stroke: #b58900; stroke-width: 1.5; }
    .storage    { fill: #e6f4ea; stroke: #228b22; stroke-width: 1.5; }
    .upstream   { fill: #fce8e6; stroke: #c5221f; stroke-width: 1.5; }
    .reference  { fill: #f5f5f5; stroke: #888;    stroke-width: 1; stroke-dasharray: 4 3; }
    .title      { font-size: 15px; font-weight: bold; fill: #222; }
    .label      { font-size: 13px; fill: #222; }
    .small      { font-size: 11px; fill: #555; }
    .refsmall   { font-size: 11px; fill: #777; }
    .arrow      { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrowR     { stroke: #555; stroke-width: 1;   fill: none; marker-end: url(#arrow); stroke-dasharray: 4 3; }
    .arrowRef   { stroke: #888; stroke-width: 1;   fill: none; marker-end: url(#arrowRef); stroke-dasharray: 3 2; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrowRef" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <text x="360" y="22" text-anchor="middle" class="title">s10: 一张渠道表 + 一个选路, 同客户端跨多账号</text>

  <!-- ============ TOP-LEFT: s09 参考框 (前置章节, 本章接力) ============ -->

  <rect class="reference" x="20" y="52" width="280" height="100"/>
  <text x="160" y="74" text-anchor="middle" class="small" fill="#555">s09 用户系统 (前置)</text>
  <text x="160" y="92" text-anchor="middle" class="refsmall">POST /auth/signup · /auth/login</text>
  <text x="160" y="108" text-anchor="middle" class="refsmall">jwt_util.issue/decode, is_admin 标记</text>
  <text x="160" y="124" text-anchor="middle" class="refsmall">本章不重写, 复用 jwt 闸门挂 /admin/*</text>
  <text x="160" y="140" text-anchor="middle" class="refsmall">对比: 本章不接 /v1/chat/completions</text>

  <!-- ============ MAIN FLOW: admin 写渠道表 ============ -->

  <!-- Admin client -->
  <rect class="client" x="20" y="200" width="120" height="80"/>
  <text x="80" y="226" text-anchor="middle" class="label">Admin Client</text>
  <text x="80" y="244" text-anchor="middle" class="small">+ Bearer &lt;admin jwt&gt;</text>
  <text x="80" y="262" text-anchor="middle" class="small">POST/GET /admin/channels</text>

  <!-- _require_admin gate -->
  <rect class="middleware" x="160" y="200" width="120" height="80"/>
  <text x="220" y="226" text-anchor="middle" class="label">_require_admin</text>
  <text x="220" y="244" text-anchor="middle" class="small">decode Bearer &lt;jwt&gt;</text>
  <text x="220" y="262" text-anchor="middle" class="small">403 admin only</text>

  <!-- /admin/channels handlers -->
  <rect class="gateway" x="300" y="200" width="140" height="80"/>
  <text x="370" y="226" text-anchor="middle" class="label">/admin/channels</text>
  <text x="370" y="244" text-anchor="middle" class="small">POST create · GET list</text>
  <text x="370" y="262" text-anchor="middle" class="small">dependencies=[...]</text>

  <!-- channels pool (memory dict + Lock) -->
  <rect class="storage" x="460" y="180" width="240" height="120"/>
  <text x="580" y="204" text-anchor="middle" class="label">channels pool (内存 dict)</text>
  <text x="580" y="222" text-anchor="middle" class="small">id:1 openai-primary  w=100 pri=0 healthy=T</text>
  <text x="580" y="238" text-anchor="middle" class="small">id:2 openai-backup   w=50  pri=1 healthy=T</text>
  <text x="580" y="254" text-anchor="middle" class="small">id:3 claude          w=100 pri=0 healthy=F</text>
  <text x="580" y="270" text-anchor="middle" class="small">_channels: dict[int, Channel] + Lock</text>
  <text x="580" y="286" text-anchor="middle" class="small">mark_unhealthy(cid) 即时生效</text>

  <!-- Admin CRUD chain: client -> gate -> handler -> pool -->
  <line class="arrow" x1="140" y1="240" x2="158" y2="240"/>
  <text x="149" y="235" text-anchor="middle" class="small">jwt</text>

  <line class="arrow" x1="280" y1="240" x2="298" y2="240"/>
  <text x="289" y="235" text-anchor="middle" class="small">OK</text>

  <line class="arrow" x1="440" y1="220" x2="458" y2="220"/>
  <text x="449" y="215" text-anchor="middle" class="small">create_channel()</text>

  <!-- 201 back to admin (dashed, routed BELOW row to avoid crossing) -->
  <polyline class="arrowR" points="300,295 300,328 80,328 80,282"/>
  <text x="190" y="323" text-anchor="middle" class="small">201 + {id, name}</text>

  <!-- ============ LOWER PATH: pick_channel_for ============ -->

  <!-- pick_channel_for box -->
  <rect class="middleware" x="160" y="370" width="280" height="100"/>
  <text x="300" y="396" text-anchor="middle" class="label">pick_channel_for(model_name)</text>
  <text x="300" y="414" text-anchor="middle" class="small">1) filter: enabled &amp;&amp; healthy &amp;&amp; provider</text>
  <text x="300" y="430" text-anchor="middle" class="small">2) tier: min priority asc (数字越小越优先)</text>
  <text x="300" y="446" text-anchor="middle" class="small">3) inside tier: random.choices(weight) | round-robin</text>
  <text x="300" y="462" text-anchor="middle" class="small">weight=0 全部 → 回退 round-robin</text>

  <!-- Selected channel returns -->
  <rect class="storage" x="460" y="380" width="240" height="80"/>
  <text x="580" y="406" text-anchor="middle" class="label">selected Channel</text>
  <text x="580" y="424" text-anchor="middle" class="small">e.g. id:1 openai-primary</text>
  <text x="580" y="440" text-anchor="middle" class="small">priority=0 weight=100 healthy=True</text>
  <text x="580" y="456" text-anchor="middle" class="small">mark_unhealthy(cid) → 下次直接 skip</text>

  <!-- arrows: pool -> pick (diagonal across), pick -> selected (right) -->
  <line class="arrow" x1="580" y1="300" x2="300" y2="368"/>
  <text x="430" y="345" text-anchor="middle" class="small">list_channels() 读池</text>
  <line class="arrow" x1="440" y1="420" x2="458" y2="420"/>
  <text x="449" y="415" text-anchor="middle" class="small">Channel</text>

  <!-- ============ s09 参考框 → s10 主路径 的"接力"虚线 ============ -->

  <line class="arrowRef" x1="240" y1="152" x2="240" y2="198"/>
  <text x="246" y="178" text-anchor="start" class="refsmall">接力</text>

  <!-- ============ Caption: WHY → 本章做了啥 → 后续接力 ============ -->

  <text x="360" y="498" text-anchor="middle" class="small">没有 s10: 上游是写死在代码里的 FORWARD_TARGET + UPSTREAM_OPENAI_KEY, 加一个 Azure 部署 / 做主备切换都得改代码重启进程</text>
  <text x="360" y="516" text-anchor="middle" class="small">本章做了啥: 内存渠道表 _channels: dict + Lock, pick_channel_for 按 (priority asc → weight 加权随机) 选一条, admin CRUD 立刻生效, mark_unhealthy 立即跳过</text>
  <text x="360" y="534" text-anchor="middle" class="small">后续接力: s11 在每次请求时调 pick_channel_for 把调用日志落到渠道名, s13 把失败接成 mark_unhealthy 自动回血回路 (本章不接 /v1/chat/completions, 转发与选路分开讲更清楚)</text>
</svg>
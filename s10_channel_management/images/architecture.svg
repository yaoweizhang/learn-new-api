<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="monospace">
  <style>
    .client     { fill: #fafafa; stroke: #333;    stroke-width: 1.5; }
    .gateway    { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2;   }
    .middleware { fill: #fff5d6; stroke: #b58900; stroke-width: 1.5; }
    .storage    { fill: #e6f4ea; stroke: #228b22; stroke-width: 1.5; }
    .upstream   { fill: #fce8e6; stroke: #c5221f; stroke-width: 1.5; }
    .reference  { fill: #f5f5f5; stroke: #888;    stroke-width: 1; stroke-dasharray: 4 3; }
    .title      { font-size: 14px; font-weight: bold; fill: #222; }
    .label      { font-size: 13px; fill: #222; }
    .small      { font-size: 11px; fill: #555; }
    .refsmall   { font-size: 11px; fill: #777; }
    .arrow      { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrowR     { stroke: #555; stroke-width: 1;   fill: none; marker-end: url(#arrow); stroke-dasharray: 4 3; }
    .arrowRef   { stroke: #888; stroke-width: 1;   fill: none; marker-end: url(#arrowRef); stroke-dasharray: 3 2; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrowRef" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <text x="360" y="22" text-anchor="middle" class="title">s10: 渠道表+三步选路,管理员 CRUD</text>

  <!-- s09 用户系统 参考框 (前置) -->
  <rect class="reference" x="20" y="50" width="200" height="50"/>
  <text x="120" y="76" text-anchor="middle" class="small" fill="#555">s09 用户系统</text>
  <text x="120" y="94" text-anchor="middle" class="refsmall">JWT + is_admin</text>

  <!-- Admin client -->
  <rect class="client" x="20" y="150" width="120" height="60"/>
  <text x="80" y="178" text-anchor="middle" class="label">Admin</text>
  <text x="80" y="198" text-anchor="middle" class="small">Bearer</text>

  <!-- _require_admin gate -->
  <rect class="middleware" x="170" y="150" width="120" height="60"/>
  <text x="230" y="178" text-anchor="middle" class="label">_require_admin</text>
  <text x="230" y="198" text-anchor="middle" class="small">is_admin</text>

  <!-- /admin/channels handlers -->
  <rect class="gateway" x="320" y="150" width="160" height="60"/>
  <text x="400" y="178" text-anchor="middle" class="label">/admin/channels</text>
  <text x="400" y="198" text-anchor="middle" class="small">POST + GET</text>

  <!-- channels pool (Round-9 fix be65e8e: ≤ 2 lines preserved) -->
  <rect class="storage" x="510" y="150" width="190" height="60"/>
  <text x="605" y="178" text-anchor="middle" class="label">channels pool</text>
  <text x="605" y="198" text-anchor="middle" class="small">dict + Lock</text>

  <!-- chain arrows -->
  <line class="arrow" x1="140" y1="180" x2="168" y2="180"/>
  <text x="154" y="175" text-anchor="middle" class="small">jwt</text>

  <line class="arrow" x1="290" y1="180" x2="318" y2="180"/>
  <text x="304" y="175" text-anchor="middle" class="small">过</text>

  <line class="arrow" x1="480" y1="180" x2="508" y2="180"/>
  <text x="494" y="175" text-anchor="middle" class="small">写</text>

  <!-- 201 back to admin (dashed, routed BELOW) -->
  <polyline class="arrowR" points="320,210 320,250 80,250 80,210"/>
  <text x="200" y="245" text-anchor="middle" class="small">201</text>

  <!-- pick_channel_for (lower band) -->
  <rect class="middleware" x="170" y="270" width="310" height="22"/>
  <text x="325" y="285" text-anchor="middle" class="small">pick_channel_for · 过滤→档→weight</text>

  <!-- pool -> pick -->
  <line class="arrow" x1="605" y1="210" x2="325" y2="268"/>
  <text x="465" y="240" text-anchor="middle" class="small">读</text>

  <!-- s09 参考 → s10 主路径 的"接力"虚线 -->
  <line class="arrowRef" x1="220" y1="100" x2="220" y2="148"/>
  <text x="226" y="140" text-anchor="start" class="refsmall">接力</text>
</svg>
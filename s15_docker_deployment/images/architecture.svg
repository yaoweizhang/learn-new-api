<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="monospace">
  <style>
    .client     { fill: #fafafa; stroke: #333;    stroke-width: 1.5; }
    .gateway    { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2;   }
    .middleware { fill: #fff5d6; stroke: #b58900; stroke-width: 1.5; }
    .storage    { fill: #e6f4ea; stroke: #228b22; stroke-width: 1.5; }
    .upstream   { fill: #fce8e6; stroke: #c5221f; stroke-width: 1.5; }
    .title      { font-size: 15px; font-weight: bold; fill: #222; }
    .label      { font-size: 13px; fill: #222; }
    .small      { font-size: 11px; fill: #555; }
    .arrow      { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrowR     { stroke: #555; stroke-width: 1;   fill: none; marker-end: url(#arrow); stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <text x="400" y="22" text-anchor="middle" class="title">s15: compose 一行拉起</text>

  <!-- Docker host outer box -->
  <rect x="14" y="50" width="772" height="370" fill="none" stroke="#888" stroke-width="1.5"/>
  <text x="30" y="68" class="small" fill="#555">Docker host</text>

  <!-- ============ Container: gateway ============ -->

  <!-- Container boundary -->
  <rect x="40" y="90" width="500" height="310" fill="none" stroke="#1a73e8" stroke-width="2"/>
  <text x="58" y="108" class="small" fill="#1a73e8" font-weight="bold">Container: gateway</text>
  <text x="200" y="108" class="small" fill="#555">FROM python:3.11-slim · WORKDIR /app</text>

  <!-- /healthz route -->
  <rect class="gateway" x="60" y="130" width="200" height="64"/>
  <text x="160" y="152" text-anchor="middle" class="label">GET /healthz</text>
  <text x="160" y="170" text-anchor="middle" class="small">s15 本地路由 · mount 之前</text>
  <text x="160" y="186" text-anchor="middle" class="small">深检 {ok, checks{db, upstream}}</text>

  <!-- s14 mount -->
  <rect class="gateway" x="290" y="130" width="230" height="64"/>
  <text x="405" y="152" text-anchor="middle" class="label">s14 mount</text>
  <text x="405" y="170" text-anchor="middle" class="small">/dashboard/* · /auth/* · /admin/*</text>
  <text x="405" y="186" text-anchor="middle" class="small">app.mount("/", s14_app)</text>

  <!-- s13 chained mount -->
  <rect class="gateway" x="60" y="220" width="460" height="56"/>
  <text x="290" y="240" text-anchor="middle" class="label">s13 / s12 / s11 / s10 / s09 / s08 链路</text>
  <text x="290" y="258" text-anchor="middle" class="small">/v1/chat/completions · /admin/cache/stats · ...</text>

  <!-- uvicorn -->
  <rect class="middleware" x="60" y="296" width="460" height="40"/>
  <text x="290" y="316" text-anchor="middle" class="label">Uvicorn : 0.0.0.0:8015</text>
  <text x="290" y="332" text-anchor="middle" class="small">CMD ["python","s15_docker_deployment/code.py"]</text>

  <!-- HEALTHCHECK -->
  <rect class="middleware" x="60" y="350" width="460" height="40"/>
  <text x="290" y="370" text-anchor="middle" class="label">HEALTHCHECK</text>
  <text x="290" y="386" text-anchor="middle" class="small">interval=30s timeout=5s start=10s retries=3</text>

  <!-- arrows inside container: /healthz -> s14 mount -->
  <line class="arrow" x1="260" y1="158" x2="288" y2="158"/>
  <line class="arrow" x1="405" y1="194" x2="290" y2="218"/>
  <text x="345" y="208" text-anchor="middle" class="small">mount</text>

  <!-- Probe arrow (DOCKER -> /healthz) from outside top-left -->
  <line class="arrowR" x1="160" y1="50" x2="160" y2="128" stroke="#1a73e8"/>
  <text x="50" y="100" class="small" fill="#1a73e8">curl /healthz</text>

  <!-- ============ Dockerfile / docker-compose panel ============ -->
  <rect x="560" y="90" width="220" height="310" fill="none" stroke="#888" stroke-dasharray="4 3" stroke-width="1"/>
  <text x="578" y="108" class="small" fill="#555" font-weight="bold">build files</text>

  <!-- Dockerfile -->
  <rect class="storage" x="572" y="120" width="200" height="120"/>
  <text x="672" y="142" text-anchor="middle" class="label">Dockerfile</text>
  <text x="672" y="160" text-anchor="middle" class="small">FROM python:3.11-slim</text>
  <text x="672" y="176" text-anchor="middle" class="small">COPY requirements.txt .</text>
  <text x="672" y="192" text-anchor="middle" class="small">RUN pip install ...</text>
  <text x="672" y="208" text-anchor="middle" class="small">COPY . . · EXPOSE 8015</text>
  <text x="672" y="224" text-anchor="middle" class="small">HEALTHCHECK CMD</text>

  <!-- docker-compose -->
  <rect class="storage" x="572" y="256" width="200" height="130"/>
  <text x="672" y="278" text-anchor="middle" class="label">docker-compose.yml</text>
  <text x="672" y="296" text-anchor="middle" class="small">services:</text>
  <text x="672" y="312" text-anchor="middle" class="small">  gateway:</text>
  <text x="672" y="328" text-anchor="middle" class="small">    build: .</text>
  <text x="672" y="344" text-anchor="middle" class="small">    ports: "8015:8015"</text>
  <text x="672" y="360" text-anchor="middle" class="small">    healthcheck: from Dockerfile</text>
  <text x="672" y="376" text-anchor="middle" class="small">单容器,无外部依赖</text>

  <!-- docker host -> compose/dockerfile -->
  <line class="arrowR" x1="520" y1="380" x2="570" y2="380"/>
  <text x="525" y="376" class="small">docker compose up</text>

  <!-- Caption -->
  <text x="400" y="448" text-anchor="middle" class="small">Dockerfile + docker-compose · 单容器 · HEALTHCHECK 走 /healthz(s05+)</text>
  <text x="400" y="466" text-anchor="middle" class="small">深检桩 ok=True · 生产里换 db.read + upstream HEAD;Compose 不依赖 redis/mysql</text>
</svg>
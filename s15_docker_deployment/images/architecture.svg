<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="monospace">
  <style>
    .client     { fill: #fafafa; stroke: #333;    stroke-width: 1.5; }
    .gateway    { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2;   }
    .middleware { fill: #fff5d6; stroke: #b58900; stroke-width: 1.5; }
    .storage    { fill: #e6f4ea; stroke: #228b22; stroke-width: 1.5; }
    .upstream   { fill: #fce8e6; stroke: #c5221f; stroke-width: 1.5; }
    .reference  { fill: #f5f5f5; stroke: #888;    stroke-width: 1; stroke-dasharray: 4 3; }
    .title      { font-size: 14px; font-weight: bold; fill: #222; }
    .label      { font-size: 13px; fill: #222; }
    .small      { font-size: 11px; fill: #555; }
    .refsmall   { font-size: 11px; fill: #777; }
    .arrow      { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrowR     { stroke: #555; stroke-width: 1;   fill: none; marker-end: url(#arrow); stroke-dasharray: 4 3; }
    .arrowRef   { stroke: #888; stroke-width: 1;   fill: none; marker-end: url(#arrowRef); stroke-dasharray: 3 2; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrowRef" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <text x="360" y="22" text-anchor="middle" class="title">s15: compose 起 · 自动探</text>

  <rect class="reference" x="20" y="50" width="260" height="64"/>
  <text x="150" y="76" text-anchor="middle" class="small" fill="#555">s01-s14 链路 (前置)</text>
  <text x="150" y="100" text-anchor="middle" class="refsmall">/v1 · /admin · /dashboard</text>

  <rect class="client" x="20" y="150" width="120" height="60"/>
  <text x="80" y="178" text-anchor="middle" class="label">CLI</text>
  <text x="80" y="196" text-anchor="middle" class="small">docker compose up</text>

  <rect x="160" y="150" width="540" height="170" fill="none" stroke="#1a73e8" stroke-width="2"/>
  <text x="180" y="170" text-anchor="start" class="small" fill="#1a73e8">Container: gateway</text>

  <rect class="gateway" x="180" y="190" width="200" height="60"/>
  <text x="280" y="216" text-anchor="middle" class="label">/healthz</text>
  <text x="280" y="234" text-anchor="middle" class="small">本地路由挡 mount</text>

  <rect class="gateway" x="400" y="190" width="280" height="60"/>
  <text x="540" y="216" text-anchor="middle" class="label">s14 mount</text>
  <text x="540" y="234" text-anchor="middle" class="small">/v1 · /dashboard · /admin</text>

  <rect class="middleware" x="180" y="270" width="500" height="40"/>
  <text x="430" y="288" text-anchor="middle" class="label">uvicorn :8015</text>
  <text x="430" y="302" text-anchor="middle" class="small">python s15_docker_deployment/code.py</text>

  <rect class="middleware" x="540" y="80" width="160" height="50"/>
  <text x="620" y="100" text-anchor="middle" class="label">HEALTHCHECK</text>
  <text x="620" y="116" text-anchor="middle" class="small">每 30s 探 /healthz</text>

  <line class="arrow" x1="140" y1="180" x2="178" y2="180"/>
  <text x="160" y="175" text-anchor="middle" class="small">up</text>

  <polyline class="arrow" points="380,220 540,140 620,132"/>
  <text x="440" y="170" text-anchor="middle" class="small" fill="#1a73e8">探</text>

  <polyline class="arrowR" points="620,132 620,200 382,200"/>
  <text x="500" y="195" text-anchor="middle" class="small" fill="#228b22">200</text>

  <line class="arrowRef" x1="280" y1="116" x2="280" y2="148"/>
  <text x="286" y="138" text-anchor="start" class="refsmall">接力</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 580" font-family="monospace">
  <style>
    .client     { fill: #fafafa; stroke: #333;    stroke-width: 1.5; }
    .gateway    { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2;   }
    .middleware { fill: #fff5d6; stroke: #b58900; stroke-width: 1.5; }
    .storage    { fill: #e6f4ea; stroke: #228b22; stroke-width: 1.5; }
    .upstream   { fill: #fce8e6; stroke: #c5221f; stroke-width: 1.5; }
    .reference  { fill: #f5f5f5; stroke: #888;    stroke-width: 1; stroke-dasharray: 4 3; }
    .title      { font-size: 15px; font-weight: bold; fill: #222; }
    .label      { font-size: 13px; fill: #222; }
    .small      { font-size: 11px; fill: #555; }
    .refsmall   { font-size: 11px; fill: #777; }
    .arrow      { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrowR     { stroke: #555; stroke-width: 1;   fill: none; marker-end: url(#arrow); stroke-dasharray: 4 3; }
    .arrowRef   { stroke: #888; stroke-width: 1;   fill: none; marker-end: url(#arrowRef); stroke-dasharray: 3 2; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrowRef" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <text x="360" y="22" text-anchor="middle" class="title">s11: 每次调用一行落库, 异步 + 统计, 出事了能翻</text>

  <!-- ============ TOP-LEFT: s05 + s10 参考框 (前置章节, 本章接力) ============ -->

  <rect class="reference" x="20" y="52" width="280" height="100"/>
  <text x="160" y="74" text-anchor="middle" class="small" fill="#555">s05 auth + s10 channels (前置)</text>
  <text x="160" y="92" text-anchor="middle" class="refsmall">require_api_key → Principal · channels.pick_channel_for</text>
  <text x="160" y="108" text-anchor="middle" class="refsmall">/v1/chat/completions 已经能转发</text>
  <text x="160" y="124" text-anchor="middle" class="refsmall">本章不重写, 在外面挂中间件 + 日志模块</text>
  <text x="160" y="140" text-anchor="middle" class="refsmall">对比: 不直接 enqueue 进 SQLite (内存 deque 先)</text>

  <!-- ============ MAIN FLOW ROW (本章主路径) ============ -->

  <!-- Client -->
  <rect class="client" x="20" y="200" width="120" height="80"/>
  <text x="80" y="226" text-anchor="middle" class="label">Chat Client</text>
  <text x="80" y="244" text-anchor="middle" class="small">+ Bearer</text>
  <text x="80" y="262" text-anchor="middle" class="small">POST /v1/chat/completions</text>

  <!-- LogMiddleware (NEW) -->
  <rect class="middleware" x="160" y="200" width="160" height="80"/>
  <text x="240" y="226" text-anchor="middle" class="label">LogMiddleware (s11 NEW)</text>
  <text x="240" y="244" text-anchor="middle" class="small">peek body · 解 model</text>
  <text x="240" y="262" text-anchor="middle" class="small">on 200: enqueue 一行</text>

  <!-- s10 mount -->
  <rect class="gateway" x="340" y="200" width="160" height="80"/>
  <text x="420" y="226" text-anchor="middle" class="label">s10 mount (链路)</text>
  <text x="420" y="244" text-anchor="middle" class="small">/v1/chat/completions</text>
  <text x="420" y="262" text-anchor="middle" class="small">s09 → s08 → ... → 上游</text>

  <!-- Upstream -->
  <rect class="upstream" x="520" y="200" width="100" height="80"/>
  <text x="570" y="226" text-anchor="middle" class="label">Upstream</text>
  <text x="570" y="244" text-anchor="middle" class="small">返回</text>
  <text x="570" y="262" text-anchor="middle" class="small">200 JSON</text>

  <!-- chain arrows: client → middleware → mount → upstream -->
  <line class="arrow" x1="140" y1="240" x2="158" y2="240"/>
  <text x="149" y="235" text-anchor="middle" class="small">JSON</text>

  <line class="arrow" x1="320" y1="240" x2="338" y2="240"/>
  <text x="329" y="235" text-anchor="middle" class="small">call_next</text>

  <line class="arrow" x1="500" y1="240" x2="518" y2="240"/>
  <text x="509" y="235" text-anchor="middle" class="small">HTTP</text>

  <!-- 200 response path back to client -->
  <line class="arrowR" x1="518" y1="260" x2="502" y2="260"/>
  <line class="arrowR" x1="338" y1="260" x2="322" y2="260"/>
  <line class="arrowR" x1="158" y1="260" x2="142" y2="260"/>
  <text x="320" y="255" text-anchor="middle" class="small">200 + JSON</text>

  <!-- ============ LOG STORE PIPELINE (下面一排, 三件) ============ -->

  <!-- _buffer -->
  <rect class="storage" x="60" y="340" width="160" height="80"/>
  <text x="140" y="366" text-anchor="middle" class="label">_buffer : deque[dict]</text>
  <text x="140" y="384" text-anchor="middle" class="small">enqueue → append(entry)</text>
  <text x="140" y="400" text-anchor="middle" class="small">threading.Lock</text>
  <text x="140" y="416" text-anchor="middle" class="small">写一次加一行</text>

  <!-- flush_loop (timer) -->
  <rect class="middleware" x="240" y="340" width="200" height="80"/>
  <text x="340" y="366" text-anchor="middle" class="label">flush_loop (async task)</text>
  <text x="340" y="384" text-anchor="middle" class="small">await asyncio.sleep(0.1)</text>
  <text x="340" y="400" text-anchor="middle" class="small">drain_now() 整段搬</text>
  <text x="340" y="416" text-anchor="middle" class="small">@app.on_event(startup)</text>

  <!-- _flushed list -->
  <rect class="storage" x="460" y="340" width="160" height="80"/>
  <text x="540" y="366" text-anchor="middle" class="label">_flushed : list[dict]</text>
  <text x="540" y="384" text-anchor="middle" class="small">list_logs() 读这里</text>
  <text x="540" y="400" text-anchor="middle" class="small">on shutdown: drain_now()</text>
  <text x="540" y="416" text-anchor="middle" class="small">落盘列表 (内存)</text>

  <!-- arrows: middleware -> _buffer (enqueue) -->
  <polyline class="arrow" points="220,280 220,320 140,320 140,338" stroke="#228b22"/>
  <text x="180" y="316" text-anchor="middle" class="small" fill="#228b22">enqueue 异步入队</text>

  <!-- _buffer -> flush_loop -->
  <line class="arrow" x1="220" y1="380" x2="238" y2="380"/>
  <text x="229" y="375" text-anchor="middle" class="small">peek 100ms</text>

  <!-- flush_loop -> _flushed -->
  <line class="arrow" x1="440" y1="380" x2="458" y2="380"/>
  <text x="449" y="375" text-anchor="middle" class="small">flush 100ms/批</text>

  <!-- ============ /admin/* 读取端 ============ -->

  <rect class="gateway" x="200" y="450" width="320" height="50"/>
  <text x="360" y="470" text-anchor="middle" class="label">GET /admin/logs · GET /admin/stats</text>
  <text x="360" y="486" text-anchor="middle" class="small">本地路由先注册 · 直接读 _flushed</text>

  <!-- _flushed -> /admin -->
  <line class="arrow" x1="540" y1="420" x2="450" y2="448" stroke="#1a73e8"/>
  <text x="510" y="438" text-anchor="middle" class="small" fill="#1a73e8">GET 读取</text>

  <!-- ============ s05 + s10 参考框 → s11 主路径 的"接力"虚线 ============ -->

  <line class="arrowRef" x1="240" y1="152" x2="240" y2="198"/>
  <text x="246" y="178" text-anchor="start" class="refsmall">接力</text>

  <!-- ============ Caption: WHY → 本章做了啥 → 后续接力 ============ -->

  <text x="360" y="522" text-anchor="middle" class="small">没有 s11: 每条 chat 调用走完即忘, 报障只能凭记忆, 运营用量只能看第三方控制台, 无法对账 (s07 预扣 vs 真实)</text>
  <text x="360" y="538" text-anchor="middle" class="small">本章做了啥: LogMiddleware 在 200 时 enqueue 一行, 100ms flush_loop 异步搬 _buffer → _flushed, /admin/logs + /admin/stats 实时读</text>
  <text x="360" y="554" text-anchor="middle" class="small">后续接力: s14 把这俩端点换成 Jinja2 浏览器看板, s16 把这一行扩成 Prometheus 指标 + trace_id, 生产再换 SQLite/Postgres 持久化</text>
</svg>
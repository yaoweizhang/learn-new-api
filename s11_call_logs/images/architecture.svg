<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="monospace">
  <style>
    .client     { fill: #fafafa; stroke: #333;    stroke-width: 1.5; }
    .gateway    { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2;   }
    .middleware { fill: #fff5d6; stroke: #b58900; stroke-width: 1.5; }
    .storage    { fill: #e6f4ea; stroke: #228b22; stroke-width: 1.5; }
    .upstream   { fill: #fce8e6; stroke: #c5221f; stroke-width: 1.5; }
    .reference  { fill: #f5f5f5; stroke: #888;    stroke-width: 1; stroke-dasharray: 4 3; }
    .title      { font-size: 14px; font-weight: bold; fill: #222; }
    .label      { font-size: 13px; fill: #222; }
    .small      { font-size: 11px; fill: #555; }
    .refsmall   { font-size: 11px; fill: #777; }
    .arrow      { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrowR     { stroke: #555; stroke-width: 1;   fill: none; marker-end: url(#arrow); stroke-dasharray: 4 3; }
    .arrowRef   { stroke: #888; stroke-width: 1;   fill: none; marker-end: url(#arrowRef); stroke-dasharray: 3 2; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrowRef" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <text x="360" y="22" text-anchor="middle" class="title">s11: 调用一行异步落库, 100ms flush + admin 可查</text>

  <!-- ============ TOP-LEFT: s05 + s10 参考框 (前置章节, 本章接力) ============ -->

  <rect class="reference" x="20" y="50" width="260" height="64"/>
  <text x="150" y="76" text-anchor="middle" class="small" fill="#555">s05 auth + s10 channels (前置)</text>
  <text x="150" y="100" text-anchor="middle" class="refsmall">/v1/chat/completions 已能转发</text>

  <!-- ============ MAIN FLOW ROW (本章主路径) ============ -->

  <!-- Client -->
  <rect class="client" x="20" y="150" width="120" height="60"/>
  <text x="80" y="178" text-anchor="middle" class="label">Client</text>
  <text x="80" y="196" text-anchor="middle" class="small">POST · Bearer</text>

  <!-- LogMiddleware (NEW) -->
  <rect class="middleware" x="160" y="150" width="160" height="60"/>
  <text x="240" y="178" text-anchor="middle" class="label">LogMiddleware</text>
  <text x="240" y="196" text-anchor="middle" class="small">on 200: enqueue 一行</text>

  <!-- s10 mount -->
  <rect class="gateway" x="340" y="150" width="160" height="60"/>
  <text x="420" y="178" text-anchor="middle" class="label">s10 mount</text>
  <text x="420" y="196" text-anchor="middle" class="small">s09 → ... → 上游</text>

  <!-- Upstream -->
  <rect class="upstream" x="520" y="150" width="100" height="60"/>
  <text x="570" y="178" text-anchor="middle" class="label">Upstream</text>
  <text x="570" y="196" text-anchor="middle" class="small">200 JSON</text>

  <!-- chain arrows -->
  <line class="arrow" x1="140" y1="180" x2="158" y2="180"/>
  <text x="149" y="175" text-anchor="middle" class="small">JSON</text>

  <line class="arrow" x1="320" y1="180" x2="338" y2="180"/>
  <text x="329" y="175" text-anchor="middle" class="small">next</text>

  <line class="arrow" x1="500" y1="180" x2="518" y2="180"/>
  <text x="509" y="175" text-anchor="middle" class="small">HTTP</text>

  <!-- 200 response back -->
  <line class="arrowR" x1="518" y1="200" x2="502" y2="200"/>
  <line class="arrowR" x1="338" y1="200" x2="322" y2="200"/>
  <line class="arrowR" x1="158" y1="200" x2="142" y2="200"/>
  <text x="320" y="195" text-anchor="middle" class="small">200</text>

  <!-- ============ LOG STORE PIPELINE (下面一排) ============ -->

  <!-- _buffer -->
  <rect class="storage" x="60" y="250" width="160" height="60"/>
  <text x="140" y="278" text-anchor="middle" class="label">_buffer</text>
  <text x="140" y="296" text-anchor="middle" class="small">deque · 写入端</text>

  <!-- flush_loop -->
  <rect class="middleware" x="240" y="250" width="200" height="60"/>
  <text x="340" y="278" text-anchor="middle" class="label">flush_loop</text>
  <text x="340" y="296" text-anchor="middle" class="small">sleep 0.1 · 整段搬</text>

  <!-- _flushed -->
  <rect class="storage" x="460" y="250" width="160" height="60"/>
  <text x="540" y="278" text-anchor="middle" class="label">_flushed</text>
  <text x="540" y="296" text-anchor="middle" class="small">list · 读取端</text>

  <!-- arrows pipeline -->
  <line class="arrow" x1="220" y1="280" x2="238" y2="280"/>
  <text x="229" y="275" text-anchor="middle" class="small">进</text>

  <line class="arrow" x1="440" y1="280" x2="458" y2="280"/>
  <text x="449" y="275" text-anchor="middle" class="small">出</text>

  <!-- middleware -> _buffer (left side enqueue) -->
  <polyline class="arrow" points="200,210 200,240 140,240 140,248" stroke="#228b22"/>
  <text x="170" y="234" text-anchor="middle" class="small" fill="#228b22">入队</text>

  <!-- ============ s05 + s10 参考框 → s11 主路径 的"接力"虚线 ============ -->

  <line class="arrowRef" x1="240" y1="116" x2="240" y2="148"/>
  <text x="246" y="138" text-anchor="start" class="refsmall">接力</text>
</svg>

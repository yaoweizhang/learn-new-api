<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="monospace">
  <style>
    .client     { fill: #fafafa; stroke: #333;    stroke-width: 1.5; }
    .gateway    { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 2;   }
    .middleware { fill: #fff5d6; stroke: #b58900; stroke-width: 1.5; }
    .storage    { fill: #e6f4ea; stroke: #228b22; stroke-width: 1.5; }
    .upstream   { fill: #fce8e6; stroke: #c5221f; stroke-width: 1.5; }
    .title      { font-size: 15px; font-weight: bold; fill: #222; }
    .label      { font-size: 13px; fill: #222; }
    .small      { font-size: 11px; fill: #555; }
    .arrow      { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrowR     { stroke: #555; stroke-width: 1;   fill: none; marker-end: url(#arrow); stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <text x="400" y="22" text-anchor="middle" class="title">s11: 中间件 peek body,后台 100ms 落盘</text>

  <!-- Client -->
  <rect class="client" x="20" y="80" width="140" height="64"/>
  <text x="90" y="104" text-anchor="middle" class="label">Client</text>
  <text x="90" y="122" text-anchor="middle" class="small">+ Bearer</text>
  <text x="90" y="138" text-anchor="middle" class="small">POST /v1/chat/completions</text>

  <!-- LogMiddleware (NEW, in front of mount chain) -->
  <rect class="middleware" x="200" y="60" width="220" height="100"/>
  <text x="310" y="84" text-anchor="middle" class="label">LogMiddleware (s11 NEW)</text>
  <text x="310" y="102" text-anchor="middle" class="small">1) await request.body() · json.loads</text>
  <text x="310" y="118" text-anchor="middle" class="small">2) request.state.model = payload["model"]</text>
  <text x="310" y="134" text-anchor="middle" class="small">3) install receive() -&gt; replay bytes</text>
  <text x="310" y="150" text-anchor="middle" class="small">4) on 200: enqueue({path,ts,status,model})</text>

  <!-- Mounted chain (s10) -->
  <rect class="gateway" x="460" y="60" width="160" height="100"/>
  <text x="540" y="84" text-anchor="middle" class="label">s10 mount</text>
  <text x="540" y="102" text-anchor="middle" class="small">/v1/chat/completions</text>
  <text x="540" y="118" text-anchor="middle" class="small">s09 -&gt; s08 (auth/quota/...</text>
  <text x="540" y="134" text-anchor="middle" class="small">+ channels)</text>
  <text x="540" y="150" text-anchor="middle" class="small">return Response 200</text>

  <!-- Upstream -->
  <rect class="upstream" x="660" y="60" width="120" height="100"/>
  <text x="720" y="84" text-anchor="middle" class="label">Upstream</text>
  <text x="720" y="118" text-anchor="middle" class="small">OpenAI / ...</text>
  <text x="720" y="134" text-anchor="middle" class="small">httpx post</text>

  <!-- request flow -->
  <line class="arrow" x1="160" y1="100" x2="198" y2="100"/>
  <text x="179" y="95" text-anchor="middle" class="small">JSON</text>
  <line class="arrow" x1="420" y1="100" x2="458" y2="100"/>
  <text x="439" y="95" text-anchor="middle" class="small">call_next</text>
  <line class="arrow" x1="620" y1="100" x2="658" y2="100"/>
  <text x="639" y="95" text-anchor="middle" class="small">HTTP</text>

  <!-- response back -->
  <line class="arrowR" x1="658" y1="120" x2="622" y2="120"/>
  <line class="arrowR" x1="458" y1="120" x2="422" y2="120"/>
  <line class="arrowR" x1="198" y1="120" x2="162" y2="120"/>
  <text x="360" y="115" text-anchor="middle" class="small">response</text>

  <!-- ============ log_store below ============ -->

  <!-- deque buffer -->
  <rect class="storage" x="60" y="240" width="200" height="80"/>
  <text x="160" y="264" text-anchor="middle" class="label">_buffer : deque[dict]</text>
  <text x="160" y="282" text-anchor="middle" class="small">enqueue() -&gt; _buffer.append(entry)</text>
  <text x="160" y="298" text-anchor="middle" class="small">threading.Lock</text>
  <text x="160" y="314" text-anchor="middle" class="small">write-only</text>

  <!-- flush_loop timer -->
  <rect class="middleware" x="290" y="240" width="220" height="80"/>
  <text x="400" y="264" text-anchor="middle" class="label">flush_loop (async task)</text>
  <text x="400" y="282" text-anchor="middle" class="small">await asyncio.sleep(0.1)</text>
  <text x="400" y="298" text-anchor="middle" class="small">drain_now() 每 100ms 一次</text>
  <text x="400" y="314" text-anchor="middle" class="small">on_event("startup") 启动</text>

  <!-- _flushed list (disk equivalent) -->
  <rect class="storage" x="540" y="240" width="200" height="80"/>
  <text x="640" y="264" text-anchor="middle" class="label">_flushed : list[dict]</text>
  <text x="640" y="282" text-anchor="middle" class="small">list_logs() -&gt; list(_flushed)</text>
  <text x="640" y="298" text-anchor="middle" class="small">on shutdown: drain_now()</text>
  <text x="640" y="314" text-anchor="middle" class="small">TestClient 兼容</text>

  <!-- arrows: middleware -> _buffer (enqueue) -->
  <line class="arrow" x1="310" y1="160" x2="160" y2="238"/>
  <text x="200" y="200" text-anchor="middle" class="small" fill="#228b22">enqueue(entry)</text>

  <!-- _buffer -> flush_loop (every 100ms) -->
  <line class="arrow" x1="260" y1="280" x2="288" y2="280"/>
  <text x="274" y="275" text-anchor="middle" class="small">peek</text>

  <!-- flush_loop -> _flushed (drain) -->
  <line class="arrow" x1="510" y1="280" x2="538" y2="280"/>
  <text x="524" y="275" text-anchor="middle" class="small">drain</text>

  <!-- _flushed sample row -->
  <rect class="storage" x="540" y="350" width="200" height="80"/>
  <text x="640" y="374" text-anchor="middle" class="label">log row sample</text>
  <text x="640" y="392" text-anchor="middle" class="small">path: /v1/chat/completions</text>
  <text x="640" y="408" text-anchor="middle" class="small">ts · status: 200 · model: gpt-4o-mini</text>
  <text x="640" y="424" text-anchor="middle" class="small">/admin/stats =&gt; {total, by_model}</text>

  <line class="arrow" x1="640" y1="320" x2="640" y2="348"/>

  <!-- Caption -->
  <text x="400" y="458" text-anchor="middle" class="small">中间件 peek body -&gt; _buffer.append · 后台 100ms flush -&gt; JSON on disk · request 不阻塞</text>
</svg>
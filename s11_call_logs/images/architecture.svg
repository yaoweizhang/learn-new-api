<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" font-family="monospace">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#37c"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a7"/>
    </marker>
    <marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c80"/>
    </marker>
  </defs>

  <!-- Client -->
  <rect x="10" y="220" width="90" height="60" fill="#eee" stroke="#333"/>
  <text x="55" y="245" text-anchor="middle">Client</text>
  <text x="55" y="260" text-anchor="middle" font-size="9">curl / TestClient</text>

  <!-- FastAPI app (s11) -->
  <rect x="140" y="20" width="280" height="480" fill="#eef" stroke="#37c" stroke-width="2"/>
  <text x="280" y="40" text-anchor="middle" font-size="13" fill="#37c">s11 code.py</text>

  <!-- LogMiddleware -->
  <rect x="160" y="60" width="240" height="180" fill="#dde" stroke="#37c"/>
  <text x="280" y="80" text-anchor="middle" font-size="11">LogMiddleware.dispatch</text>
  <text x="280" y="100" text-anchor="middle" font-size="9">1) await request.body() -&gt; json.loads</text>
  <text x="280" y="115" text-anchor="middle" font-size="9">2) request.state.model = payload["model"]</text>
  <text x="280" y="130" text-anchor="middle" font-size="9">3) install new receive() -&gt; replay bytes</text>
  <text x="280" y="155" text-anchor="middle" font-size="9">4) await call_next(request)</text>
  <text x="280" y="175" text-anchor="middle" font-size="9">5) drain response.body_iterator</text>
  <text x="280" y="190" text-anchor="middle" font-size="9">6) rewrap body_iterator + enqueue()</text>
  <text x="280" y="215" text-anchor="middle" font-size="9" fill="#a33">skipped for SSE (streaming)</text>

  <!-- /admin/logs, /admin/stats -->
  <rect x="160" y="260" width="240" height="80" fill="#dde" stroke="#37c"/>
  <text x="280" y="280" text-anchor="middle" font-size="11">GET /admin/logs</text>
  <text x="280" y="300" text-anchor="middle" font-size="9">returns list_logs() = list(_flushed)</text>
  <text x="280" y="325" text-anchor="middle" font-size="11">GET /admin/stats</text>

  <!-- startup/shutdown -->
  <rect x="160" y="360" width="240" height="60" fill="#fee" stroke="#c80"/>
  <text x="280" y="380" text-anchor="middle" font-size="11">on_event("startup")</text>
  <text x="280" y="398" text-anchor="middle" font-size="9">asyncio.create_task(flush_loop)</text>
  <text x="280" y="413" text-anchor="middle" font-size="9">on_event("shutdown") stop + drain_now</text>

  <!-- Mounted s10 -->
  <rect x="460" y="60" width="220" height="200" fill="#fed" stroke="#333"/>
  <text x="570" y="80" text-anchor="middle" font-size="12">/ mount (s10 app)</text>
  <text x="570" y="105" text-anchor="middle" font-size="10">/v1/chat/completions</text>
  <text x="570" y="120" text-anchor="middle" font-size="9" fill="#666">(s09 mounts s08 at /; s08 owns /v1 prefix)</text>
  <text x="570" y="145" text-anchor="middle" font-size="10">/admin/channels (s10)</text>
  <text x="570" y="165" text-anchor="middle" font-size="10">/auth/signup, /auth/login (s09)</text>
  <text x="570" y="185" text-anchor="middle" font-size="10">/v1/chat/completions (s08)</text>
  <text x="570" y="205" text-anchor="middle" font-size="9" fill="#666">auth/quota/rate live here</text>
  <text x="570" y="248" text-anchor="middle" font-size="9" fill="#666">mounted LAST so /admin/*</text>
  <text x="570" y="258" text-anchor="middle" font-size="9" fill="#666">match first in Starlette</text>

  <!-- log_store -->
  <rect x="720" y="60" width="180" height="200" fill="#efe" stroke="#282"/>
  <text x="810" y="80" text-anchor="middle" font-size="11" fill="#282">log_store.py</text>
  <text x="810" y="105" text-anchor="middle" font-size="10">_buffer : deque[dict]</text>
  <text x="810" y="120" text-anchor="middle" font-size="9">  enqueue() -&gt; append</text>
  <text x="810" y="145" text-anchor="middle" font-size="10">_flushed : list[dict]</text>
  <text x="810" y="160" text-anchor="middle" font-size="9">  list_logs() -&gt; copy</text>
  <text x="810" y="185" text-anchor="middle" font-size="10" fill="#2a7">flush_loop (async task)</text>
  <text x="810" y="200" text-anchor="middle" font-size="9">  every 100ms: drain _buffer</text>
  <text x="810" y="220" text-anchor="middle" font-size="9" fill="#c80">_drain_now() in shutdown</text>
  <text x="810" y="240" text-anchor="middle" font-size="9" fill="#c80">_lock : threading.Lock</text>

  <!-- Logs sample data -->
  <rect x="720" y="290" width="180" height="160" fill="#ffe" stroke="#c80"/>
  <text x="810" y="310" text-anchor="middle" font-size="11" fill="#c80">flushed sample</text>
  <text x="810" y="330" text-anchor="middle" font-size="9">path: /v1/chat/completions</text>
  <text x="810" y="345" text-anchor="middle" font-size="9">ts: 1719...</text>
  <text x="810" y="360" text-anchor="middle" font-size="9">status: 200</text>
  <text x="810" y="375" text-anchor="middle" font-size="9" fill="#2a7">model: gpt-4o-mini</text>
  <text x="810" y="405" text-anchor="middle" font-size="9" fill="#c80">/admin/stats =&gt; {total:1,</text>
  <text x="810" y="420" text-anchor="middle" font-size="9" fill="#c80">  by_model: {gpt-4o-mini:1}}</text>

  <!-- Arrows -->
  <!-- Client -> chat path -->
  <line x1="100" y1="240" x2="160" y2="90" stroke="#333" marker-end="url(#a)"/>
  <text x="115" y="160" font-size="9">Bearer sk-test</text>
  <text x="115" y="172" font-size="9">+ JSON body</text>

  <!-- Middleware -> s10 mount -->
  <line x1="400" y1="150" x2="460" y2="135" stroke="#37c" marker-end="url(#b)" stroke-width="1.2"/>
  <text x="410" y="125" font-size="9" fill="#37c">call_next</text>

  <!-- s10 mount -> middleware back -->
  <line x1="460" y1="195" x2="400" y2="200" stroke="#37c" stroke-dasharray="3 3" marker-end="url(#b)"/>
  <text x="410" y="225" font-size="9" fill="#37c">response (200)</text>

  <!-- Middleware -> log_store (enqueue) -->
  <line x1="400" y1="230" x2="720" y2="115" stroke="#282" marker-end="url(#a)" stroke-width="1.2"/>
  <text x="540" y="170" font-size="9" fill="#282">enqueue({model, ts, status})</text>

  <!-- log_store buffer -> log_store flushed (flush_loop) -->
  <line x1="810" y1="155" x2="810" y2="195" stroke="#2a7" stroke-width="1.4" marker-end="url(#g)"/>
  <text x="830" y="180" font-size="9" fill="#2a7">every 100ms</text>

  <!-- Middleware -> Client (200) -->
  <path d="M160,75 Q90,15 55,220" fill="none" stroke="#37c" stroke-width="1.2" marker-end="url(#b)"/>
  <text x="80" y="60" font-size="9" fill="#37c">200 + body</text>

  <!-- Admin client -> /admin/logs -->
  <path d="M55,270 Q200,460 160,310" fill="none" stroke="#37c" stroke-dasharray="3 3" marker-end="url(#b)"/>
  <text x="55" y="475" font-size="9" fill="#37c">GET /admin/logs</text>

  <!-- /admin/logs -> log_store -->
  <line x1="400" y1="290" x2="720" y2="160" stroke="#282" marker-end="url(#a)" stroke-width="1.2"/>
  <text x="500" y="290" font-size="9" fill="#282">list_logs() -&gt; copy of _flushed</text>

  <!-- log_store flushed -> sample data -->
  <line x1="810" y1="260" x2="810" y2="290" stroke="#c80" marker-end="url(#y)" stroke-width="1.2"/>

  <!-- Footer -->
  <text x="460" y="510" text-anchor="middle" font-size="9" fill="#666">s11: async call logging via middleware + deque flush loop  |  model extracted from body via request.state.model  |  v2 = Postgres</text>
</svg>